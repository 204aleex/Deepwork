async function renderDirectorio(destino, enLinea, close, consulta) {
  if (!destino) return;
  destino.innerHTML = '<div class="glist">' + '<div class="skeleton"></div>'.repeat(3) + "</div>";

  let lista = [];
  try {
    lista = await rpc("dw_public_groups", { p_query: consulta || null, p_limit: 40 }) || [];
  } catch (e) {
    destino.innerHTML = '<div class="sheet-empty">No se ha podido cargar la lista.<br>' + escapeHtml(e.message) + "</div>";
    return;
  }
  if (!destino.isConnected) return;

  const pie = enLinea
    ? '<div class="rank-cta">' +
        '<button class="btn btn-ghost" id="dirCode">Tengo un código</button>' +
        '<button class="btn btn-primary" id="dirCreate">Crear un grupo</button>' +
      "</div>"
    : "";

  if (!lista.length) {
    destino.innerHTML =
      '<div class="sheet-empty">' +
        (consulta ? "Ningún grupo abierto con ese nombre." : "Todavía no hay grupos abiertos.<br>Puedes crear el primero.") +
      "</div>" + pie;
  } else {
    // Todo lo que viene del servidor lo escribe ahora cualquiera: pasa por
    // escapeHtml sin excepción.
    destino.innerHTML = '<div class="glist">' + lista.map((g, i) => {
      const partes = [g.miembros + (g.miembros === 1 ? " persona" : " personas")];
      if (g.trabajando) partes.push('<span class="viva">' + g.trabajando + " trabajando ahora</span>");
      else if (g.en_linea) partes.push('<span class="viva">' + g.en_linea + " en línea</span>");
      if (g.week_minutes > 0) partes.push(fmtMinutes(g.week_minutes) + " esta semana");
      const actual = group && group.groupId === g.group_id;
      return '<div class="gcard' + (actual ? " actual" : "") + '" style="animation-delay:' + Math.min(i * 40, 320) + 'ms">' +
        '<div class="gcard-who">' +
          '<div class="gcard-name">' + escapeHtml(g.name) + "</div>" +
          '<div class="gcard-sub">' + partes.join(" · ") + "</div>" +
        "</div>" +

/* Da de baja el miembro anterior al cambiar de grupo o de apodo.
   Sin esto, entrar otra vez dejaba tu identidad vieja viva en el
   servidor: aparecías dos veces en la misma tabla, cada una con sus
   horas, y el total del grupo salía duplicado. Se hace DESPUÉS de que el
   alta nueva haya ido bien, para no quedarte sin grupo si falla; si la
   baja no sale, entra en la cola de pendientes y se reintenta. */
function encolarBaja(credenciales) {
  const cola = readJSON(K.PENDING_LEAVE) || [];
  if (cola.some((c) => c.p_member === credenciales.p_member)) return;
  cola.push(credenciales);
  writeJSON(K.PENDING_LEAVE, cola);
}
function desencolarBaja(memberId) {
  const cola = readJSON(K.PENDING_LEAVE) || [];
  const quedan = cola.filter((c) => c.p_member !== memberId);
  if (quedan.length) writeJSON(K.PENDING_LEAVE, quedan);
  else localStorage.removeItem(K.PENDING_LEAVE);
}

async function bajaAnterior(anterior) {
  if (!anterior || !anterior.memberId) return;
  const credenciales = { p_member: anterior.memberId, p_secret: anterior.secret };
  try {
    await rpc("dw_leave", credenciales);
    desencolarBaja(credenciales.p_member);
  } catch (e) {
    // DW005 significa que ese miembro ya no existe: nada que reintentar.
    if (/DW005|Credenciales no v/i.test(String(e.message))) desencolarBaja(credenciales.p_member);
    // si falla por red, se queda en la cola y se reintenta
  }
}

async function entrarEnGrupo(data) {
  const anterior = group;
  // La baja se apunta ANTES de pisar el grupo local. Si la app se cierra
  // justo aquí, la credencial vieja sigue en la cola y la baja se
  // reintenta al arrancar; antes se perdía y el miembro quedaba huérfano
  // para siempre, duplicando tus horas en la tabla.
  if (anterior && anterior.memberId && anterior.memberId !== data.member_id) {
    encolarBaja({ p_member: anterior.memberId, p_secret: anterior.secret });
  }
  group = {
    code: data.code, name: data.name, groupId: data.group_id,
    memberId: data.member_id, secret: data.secret, nickname: data.nickname,
    isPublic: !!data.is_public, isOwner: !!data.is_owner,
    showPresence: data.show_presence !== false
  };
  saveGroup();
  prefs.nickname = data.nickname;
  savePrefs();
  board = null;
  boardAt = 0;
  marcarSucio();
  renderRanking();
  haptic([10, 40, 18]);
  if (anterior && anterior.memberId !== group.memberId) await bajaAnterior(anterior);
  await ciclo({ forzar: true, conDias: true });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function copyCode() {
  const done = () => { haptic(10); toast("Código " + group.code + " copiado"); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(group.code).then(done, () => toast("No se ha podido copiar", true));
  } else {
    const tmp = document.createElement("input");
    tmp.value = group.code;
    document.body.appendChild(tmp);
    tmp.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("No se ha podido copiar", true); }
    tmp.remove();
  }
}

/* ------------------------------ diálogos ---------------------------- */

function showModalError(message) {
  // Si la petición falla después de cerrar el diálogo no hay dónde pintar el
  // error: antes esto reventaba con un TypeError al leer parentNode de null.
  const caja = document.querySelector(".modal");
  if (!caja) { toast(message, true); return; }

  const box = caja.querySelector(".error");
  if (box) { box.textContent = message; return; }

  const el = document.createElement("div");
  el.className = "error";
  el.setAttribute("role", "alert");
  el.textContent = message;
  const fields = caja.querySelector(".fields");
  if (fields) fields.parentNode.insertBefore(el, fields);
  else caja.insertBefore(el, caja.querySelector(".modal-actions") || null);
}

function busy(button, isBusy, label) {
  if (!button) return;
  button.disabled = isBusy;
  button.style.opacity = isBusy ? ".6" : "";
  button.textContent = isBusy ? "…" : label;
}

            // privado en vez de fallar, y se avisa.
            if (!/404|Could not find|schema cache|not exist|not unique/i.test(String(e.message))) throw e;
            data = await rpc("dw_create_group", { p_name: $("gName").value, p_nickname: $("gNick").value });
            sinAbrir = quiereAbierto;
          }
          close();
          await entrarEnGrupo(data);
          toast(sinAbrir
            ? "Grupo creado como privado · código " + data.code
            : "Grupo creado · código " + data.code, sinAbrir);
        } catch (e) {
          busy(button, false, "Crear");
          showModalError(e.message);
        }
      };
      document.querySelectorAll(".modal input").forEach((i) =>
        i.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); }));
      wireButton($("gCancel"), close);
      wireButton($("gCreate"), submit);
    }
  );
}

function openJoinGroup() {
  openModal(
    "<h2>Unirme a un grupo</h2>" +
    '<div class="sub">Pide el código de 6 letras a quien lo creó</div>' +
    '<div class="fields">' +
      '<div><div class="field-label">Código</div>' +
        '<input class="code" id="gCode" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="ABC123" /></div>' +
      '<div><div class="field-label">Tu apodo</div>' +
        '<input class="text" id="gNick" maxlength="24" placeholder="Alex" value="' + escapeHtml(prefs.nickname || "") + '" /></div>' +
    "</div>" +
    '<div class="modal-actions">' +
      '<button class="btn btn-ghost" id="gCancel">Cancelar</button>' +
      '<button class="btn btn-primary" id="gJoin">Entrar</button>' +
    "</div>",
    (close) => {
      $("gCode").focus();
      const submit = async () => {
        const button = $("gJoin");
        if (button.disabled) return;   // Enter repetido no dispara varios envios
        busy(button, true, "Entrar");
        try {
          const data = await rpc("dw_join_group", { p_code: $("gCode").value, p_nickname: $("gNick").value });
          close();
          await entrarEnGrupo(data);
          toast("Dentro de " + data.name);
        } catch (e) {
          busy(button, false, "Entrar");
          showModalError(e.message);
        }
      };
      document.querySelectorAll(".modal input").forEach((i) =>
        i.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); }));
      wireButton($("gCancel"), close);
      wireButton($("gJoin"), submit);
    }
  );
}


function openLeave() {
  openModal(
    "<h2>Salir del grupo</h2>" +
    '<div class="sub">Tu registro diario se queda intacto en este dispositivo. Lo que se borra es tu copia en el grupo, y desaparecerás del ranking de los demás.</div>' +
    '<div class="modal-actions">' +
      '<button class="btn btn-ghost" id="gCancel">Quedarme</button>' +
      '<button class="btn btn-stop" id="gLeave">Salir</button>' +
    "</div>",
    (close) => {
      wireButton($("gCancel"), close);
      wireButton($("gLeave"), async () => {
        const button = $("gLeave");
        if (button.disabled) return;
        busy(button, true, "Salir");
        const credenciales = { p_member: group.memberId, p_secret: group.secret };
        let entregado = true;
        try {
          await rpc("dw_leave", credenciales);
        } catch (e) {
          // Sin conexión salíamos igual en local y el miembro se quedaba
          // huérfano en el servidor: seguías apareciendo en el ranking de
          // los demás y tu apodo quedaba pillado para siempre. Ahora la
          // baja queda pendiente y se reintenta al recuperar la red.
          entregado = false;
          const cola = readJSON(K.PENDING_LEAVE) || [];
          cola.push(credenciales);
          writeJSON(K.PENDING_LEAVE, cola);
        }
        group = null;
        board = null;
        saveGroup();
        close();
        renderRanking();
        toast(entregado ? "Has salido del grupo" : "Fuera del grupo · la baja se enviará al recuperar la conexión", !entregado);
      });
    }
  );
}

/* ------------------------------ arranque ---------------------------- */

loadSync();
if (Object.keys(doc.days).length) persist();   // migra el formato antiguo a las claves nuevas
checkRecovery();
montarReloj();
render();
if (session && !sessionPausada()) { startTicking(); acquireWakeLock(); }
loadAsync();
requestPersistence();
renderRanking();

/* El calendario arranca plegado en movil y abierto en pantallas grandes, y
   a partir de ahi manda lo que decida el usuario. En el escritorio de tres
   columnas no se pliega: alli es una columna entera, y dejarla plegar
   abriria un hueco vacio de media pantalla. */
const fold = $("historyFold");
function aplicarPliegue() {
  const abierto = calendarioVertical()
    ? true
    : ((typeof prefs.fold === "boolean") ? prefs.fold : innerWidth >= 760);
  fold.classList.toggle("cerrado", !abierto);
  $("foldHead").setAttribute("aria-expanded", String(abierto));
  return abierto;
}
aplicarPliegue();
wireButton($("foldHead"), () => {
  if (calendarioVertical()) return;
  const abierto = fold.classList.contains("cerrado");
  fold.classList.toggle("cerrado", !abierto);
  $("foldHead").setAttribute("aria-expanded", String(abierto));
  prefs.fold = abierto;
  savePrefs();
  if (abierto) ponerHoyALaVista();
});

/* Al cambiar de tamaño hay que repintar el calendario: al cruzar el umbral
   de las tres columnas cambia de orientacion —girar la rejilla solo con CSS
   no se puede, la cabecera y las etiquetas de fila son distintas— y al
   cambiar de alto cambia cuantas semanas caben.

   Va por el evento resize y no solo por el de la media query porque hay
   entornos donde el segundo no llega (el navegador integrado del editor,
   por ejemplo, cambia el viewport sin dispararlo) y el calendario se
   quedaba en horizontal dentro de una columna vertical. */
let repintarTimer = null;
function repintarCalendario() {
  clearTimeout(repintarTimer);
  repintarTimer = setTimeout(() => {
    aplicarPliegue();
    renderGrid();
  }, 180);
}
consultaAncha.addEventListener("change", repintarCalendario);
window.addEventListener("resize", repintarCalendario);

if (group && supaReady()) flushPendingLeaves();
arrancarVigilante();
arrancarRepintador();
programarLatido();

wireButton($("groupChip"), openGrupos);
wireButton($("acctChip"), openCuenta);

// Si venimos de Google, se recogen los tokens antes de nada.
if (recogerVuelta()) {
  renderRanking();
  toast("Sesión iniciada");
}
recuperarGrupo().then(() => { if (group && supaReady()) ciclo({ forzar: true, conDias: true }); });

// hoy es lo ultimo de la rejilla: se deja a la vista de entrada
ponerHoyALaVista();

// delegación de eventos en la rejilla: un único listener para 182 celdas
const rows = $("gridRows");
rows.addEventListener("click", (e) => {
  const cell = e.target.closest(".cell");
  if (cell && !cell.disabled) { haptic(8); openDayEditor(cell.dataset.key); }
});
rows.addEventListener("mouseover", (e) => {
  const cell = e.target.closest(".cell");
  if (cell && !cell.disabled) showTip(cell);
});
rows.addEventListener("mouseleave", hideTip);
rows.addEventListener("focusin", (e) => {
  const cell = e.target.closest(".cell");
  if (cell && !cell.disabled) { moverFoco(cell); showTip(cell); }
});
rows.addEventListener("focusout", hideTip);

// En táctil el tooltip se quedaba puesto hasta tocar en otro sitio.
rows.addEventListener("touchstart", hideTip, { passive: true });
$("gridWrap").addEventListener("scroll", hideTip, { passive: true });
window.addEventListener("scroll", hideTip, { passive: true });

/* Navegación por teclado de la rejilla. Antes las 182 celdas estaban todas
   en el orden de tabulación: llegar al pie de la página exigía 182 pulsaciones
   de Tab. Ahora sólo una celda es tabulable y dentro se anda con las flechas,
   que es como se recorre una cuadrícula. */
function moverFoco(cell) {
  rows.querySelectorAll('.cell[tabindex="0"]').forEach((c) => c.setAttribute("tabindex", "-1"));
  cell.setAttribute("tabindex", "0");
}

rows.addEventListener("keydown", (e) => {
  const cell = e.target.closest(".cell");
  if (!cell) return;
  const salto = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!salto && e.key !== "Home" && e.key !== "End") return;
  e.preventDefault();

  const libres = [...rows.querySelectorAll(".cell:not(.future)")];
  if (e.key === "Home") { const c = libres[0]; if (c) { moverFoco(c); c.focus(); } return; }
  if (e.key === "End") { const c = libres[libres.length - 1]; if (c) { moverFoco(c); c.focus(); } return; }

  const fila = cell.parentElement;
  const filas = [...rows.querySelectorAll(".grid-row")];
  const y = filas.indexOf(fila);
  const x = [...fila.querySelectorAll(".cell")].indexOf(cell);
  const destinoFila = filas[y + salto[1]];
  if (!destinoFila) return;
  const destino = [...destinoFila.querySelectorAll(".cell")][x + salto[0]];
  if (!destino || destino.classList.contains("future")) return;
  moverFoco(destino);
  destino.focus();
});

wireButton($("goalBtn"), openGoalEditor);
wireButton($("goalText"), openGoalEditor);
wireButton($("exportBtn"), exportData);
wireButton($("importBtn"), () => $("importFile").click());
$("importFile").addEventListener("change", (e) => {
  if (e.target.files && e.target.files[0]) importData(e.target.files[0]);
  e.target.value = "";
});

// atajo de teclado: S para empezar o terminar
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // Con un diálogo abierto el atajo no manda: antes, escribir un apodo con
  // ese sonido arrancaba o paraba la sesión sin que se viera.
  if (closeModal) return;
  const activo = document.activeElement;
  if (activo && /^(INPUT|TEXTAREA|SELECT)$/.test(activo.tagName)) return;
  if (activo && activo.isContentEditable) return;
  if (e.key === "s" || e.key === "S") {
    e.preventDefault();
    session ? stopSession() : startSession();
  }
  // P pausa o reanuda sin terminar la sesión.
  if (e.key === "p" || e.key === "P") {
    e.preventDefault();
    if (!session) return;
    sessionPausada() ? resumeSession() : pauseSession();
  }
});

// otra pestaña ha guardado: nos ponemos al día sin recargar
window.addEventListener("storage", (e) => {
  if (e.key !== K.LOG && e.key !== K.SESSION) return;
  loadSync();
  render();
  // Una sesión en pausa no debe volver a correr sola.
  if (session && !sessionPausada() && !tickHandle) startTicking();
  if (!session || sessionPausada()) stopTicking();
});

// al volver a la app: recalcular, recuperar el bloqueo de pantalla y latir
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") { programarLatido(); return; }
  lastTodayKey = dateKey(new Date());
  checkRecovery();
  render();
  refrescarPresencia();
  if (session && !sessionPausada()) { acquireWakeLock(); startTicking(); }
  // Latido inmediato al volver: si no, el grupo te vería desconectado
  // durante casi un minuto después de desbloquear el móvil.
  if (group && supaReady()) ciclo({});
  else programarLatido();
});

// se recupera la conexión: sale lo que quedó pendiente
window.addEventListener("online", () => {
  fallosSeguidos = 0;
  if (group && supaReady()) { flushPendingLeaves(); ciclo({ conDias: true }); }
});

/* Al salir se anota la sesión abierta y, si hay minutos sin enviar, se
   intentan con keepalive (sendBeacon no vale: no admite cabeceras propias
   y Supabase exige apikey y Authorization).

   Lo importante es lo que NO se hace: no se manda un cierre de sesión.
   Cerrar la pestaña es indistinguible de bloquear el móvil, y guardarse el
   teléfono en el bolsillo es justo el caso de uso principal de la app. La
   sesión se deja caducar sola en el servidor. */
window.addEventListener("pagehide", () => {
  if (session) writeJSON(K.SESSION, session);
  if (group && supaReady() && diasSucios) {
    rpc("dw_sync", {
      p_member: group.memberId, p_secret: group.secret,
      p_days: daysPayload(), p_session_secs: sesionSegundos(),
      p_board: false, p_today: dateKey(new Date())
    }, { keepalive: true }).catch(() => {});
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
