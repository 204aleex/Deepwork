<script>
"use strict";

/* =======================================================================
   Deep Work — registro diario
   Los datos viven en el dispositivo, en tres sitios a la vez (localStorage,
   copia de seguridad e IndexedDB) y se fusionan al arrancar. Así un borrado
   parcial del navegador no se lleva el historial por delante.
   ======================================================================= */

const K = {
  LOG:     "deepwork:log:v2",
  BACKUP:  "deepwork:log:backup:v2",
  SESSION: "deepwork:session:v2",
  PREFS:   "deepwork:prefs:v2",
  GROUP:   "deepwork:group:v1",
  PENDING_LEAVE: "deepwork:leave-pendiente:v1",
  ULTIMO_CICLO:  "deepwork:ultimo-ciclo",
  CUENTA:  "deepwork:cuenta:v1",
  OLD_LOG: "deepwork-log",
  OLD_SES: "deepwork-active-session"
};

const WEEKS_TO_SHOW = 26;
/* La escala sale del CSS (--l0..--l4), que es la unica fuente. Antes estaba
   repetida en tres sitios: aqui, en la leyenda y en :root. */
const LEVEL_COLORS = (() => {
  const cs = getComputedStyle(document.documentElement);
  return [0, 1, 2, 3, 4].map((i) => cs.getPropertyValue("--l" + i).trim() || "#2f2f3d");
})();
const DAY_NAMES = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
/* En vertical los dias son columnas de 22px: "Mié" no cabe y "M" no
   distingue martes de miercoles. Dos letras si. */
const DAY_SHORT = ["Lu", "Ma", "Mi", "Ju", "Vi", "Sá", "Do"];
const LONG_SESSION_H = 5;   // por encima de esto, al volver preguntamos qué hacer
const MIN_SAVE_MIN = 0.5;   // sesiones más cortas no se guardan

/* ---------------------------- utilidades ---------------------------- */

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

function dateKey(d) {
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function keyToDate(key) {
  const p = key.split("-").map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}
function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
}
function startOfWeek(d) {
  const x = startOfDay(d);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));  // semana que empieza en lunes
  return x;
}
function fmtMinutes(mins) {
  const total = Math.round(mins);
  const h = Math.floor(total / 60);
  const m = total % 60;
  if (h === 0) return m + "m";
  if (m === 0) return h + "h";
  return h + "h " + m + "m";
}
function fmtClock(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor((s % 3600) / 60)) + ":" + pad(s % 60);
}
/* El color de cada día se mide contra TU objetivo, no contra unos
   umbrales fijos. Antes eran 30 / 90 / 180 minutos a pelo: con un
   objetivo de 2 h, media hora ya pintaba el segundo nivel y el día
   parecía mucho mejor de lo que fue.

   Ahora el tono más vivo es exactamente cumplir el objetivo, y por
   debajo va bajando por cuartos. Cambiar el objetivo recolorea la
   rejilla entera, que es lo que hace que la escala signifique algo. */
function levelFor(mins) {
  if (!mins || mins <= 0) return 0;
  const objetivo = Math.max(1, prefs.goal || 120);
  const parte = mins / objetivo;
  if (parte >= 1)   return 4;   // objetivo cumplido
  if (parte >= 0.6) return 3;
  if (parte >= 0.3) return 2;
  return 1;
}
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/* ------------------------- almacenamiento --------------------------- */
/* Documento: { version: 2, days: { "2026-08-23": { m: minutos, t: sello } } }
   El sello por día permite fusionar dos copias sin perder nada: gana la
   escritura más reciente de ese día concreto, no el documento entero. */

function readJSON(key) {
  try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; }
}
function writeJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
}

function emptyDoc() { return { version: 2, days: {}, updatedAt: 0 }; }

function normalize(raw) {
  const doc = emptyDoc();
  if (!raw || typeof raw !== "object") return doc;

  if (raw.version === 2 && raw.days) {
    doc.updatedAt = raw.updatedAt || 0;
    for (const key in raw.days) {
      const v = raw.days[key];
      if (typeof v === "number") doc.days[key] = { m: v, t: doc.updatedAt };
      else if (v && typeof v.m === "number") doc.days[key] = { m: v.m, t: v.t || 0 };
    }
    return doc;
  }

  // formato antiguo: { "2026-08-23": 42 }
  for (const key in raw) {
    if (/^\d{4}-\d{2}-\d{2}$/.test(key) && typeof raw[key] === "number") {
      doc.days[key] = { m: raw[key], t: 1 };
    }
  }
  doc.updatedAt = 1;
  return doc;
}

function mergeDocs(a, b) {
  const out = emptyDoc();
  out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  const keys = new Set(Object.keys(a.days).concat(Object.keys(b.days)));
  keys.forEach((k) => {
    const x = a.days[k], y = b.days[k];
    if (!x) { out.days[k] = y; return; }
    if (!y) { out.days[k] = x; return; }
    out.days[k] = (y.t || 0) > (x.t || 0) ? y : x;   // empate: gana `a`
  });
  return out;
}

/* IndexedDB como tercera copia. Sobrevive a limpiezas que sí vacían
   localStorage, y en iOS aguanta bastante más. Todo con try/catch: si el
   navegador la bloquea (modo privado), la app sigue funcionando igual. */
const IDB = { name: "deepwork", store: "kv", version: 1 };

function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!("indexedDB" in window)) return reject(new Error("sin indexedDB"));
    const req = indexedDB.open(IDB.name, IDB.version);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(IDB.store)) req.result.createObjectStore(IDB.store);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const req = db.transaction(IDB.store, "readonly").objectStore(IDB.store).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return null; }
}
async function idbSet(key, value) {
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB.store, "readwrite");
      tx.objectStore(IDB.store).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* sin IndexedDB seguimos con localStorage */ }
}

/* Pide almacenamiento persistente. Es lo que evita que Safari y Chrome
   borren los datos por inactividad, que es el motivo real de que el
   historial "se reiniciara". */
async function requestPersistence() {
  try {
    if (navigator.storage && navigator.storage.persist) {
      if (await navigator.storage.persisted()) return true;
      return await navigator.storage.persist();
    }
  } catch (e) { /* ignorar */ }
  return false;
}

/* ------------------------------ estado ------------------------------ */

let doc = emptyDoc();
let prefs = Object.assign({ goal: 120 }, readJSON(K.PREFS) || {});
let session = null;          // { startedAt }
let tickHandle = null;
let wakeLock = null;
let lastTodayKey = dateKey(new Date());
let lastStats = { today: null, week: null, streak: null };
let pendingRecovery = null;

function loadSync() {
  let d = normalize(readJSON(K.LOG));
  d = mergeDocs(d, normalize(readJSON(K.BACKUP)));
  d = mergeDocs(d, normalize(readJSON(K.OLD_LOG)));
  doc = d;
  bumpStampFloor(doc);

  // La sesión se refleja siempre, también cuando ya no hay ninguna. Antes
  // esto solo asignaba, nunca limpiaba: si parabas la sesión en otra
  // pestaña, esta seguía contando y al pararla aquí sumaba el rato por
  // segunda vez.
  const raw = readJSON(K.SESSION) || readJSON(K.OLD_SES);
  // startedAt puede ser null si quedó en pausa; entonces vale con que haya
  // tramos guardados. Y se acepta el formato antiguo, sin tramos.
  const enPausa = raw && raw.startedAt === null && Array.isArray(raw.tramos) && raw.tramos.length > 0;
  const valida = enPausa || (raw && typeof raw.startedAt === "number" &&
                 raw.startedAt > 0 && raw.startedAt <= Date.now());
  // Con el aviso de recuperación en pantalla, K.SESSION sigue ahí a
  // propósito (para que sobreviva a una recarga), así que no se reactiva
  // sola: la decisión de guardarla o tirarla es del usuario.
  session = valida && !pendingRecovery
    ? { startedAt: raw.startedAt || null, tramos: Array.isArray(raw.tramos) ? raw.tramos : [] }
    : null;
}

async function loadAsync() {
  const fromIdb = normalize(await idbGet("log"));
  const merged = mergeDocs(doc, fromIdb);
  const changed = JSON.stringify(merged.days) !== JSON.stringify(doc.days);
  doc = merged;
  bumpStampFloor(doc);
  persist();                      // deja las tres copias al día desde el arranque
  if (changed) render();
}

/* Escribe fusionando antes con lo que haya en disco: si tienes la app
   abierta en dos pestañas, ninguna pisa el trabajo de la otra. */
function persist() {
  doc = mergeDocs(normalize(readJSON(K.LOG)), doc);
  doc.updatedAt = stamp();
  const ok = writeJSON(K.LOG, doc);
  writeJSON(K.BACKUP, doc);
  idbSet("log", doc);
  if (!ok) toast("No se ha podido guardar en este navegador", true);
  schedulePush();
}

function savePrefs() { writeJSON(K.PREFS, prefs); }

/* Sello estrictamente creciente. Con Date.now() a secas, dos escrituras en
   el mismo milisegundo empatan y la fusión se queda con la de disco: la
   segunda edición se perdía. */
let lastStamp = 0;
function stamp() {
  const now = Date.now();
  lastStamp = now > lastStamp ? now : lastStamp + 1;
  return lastStamp;
}

/* Pone el contador por encima del sello mas alto que ya haya guardado.
   Sin esto, un sello con fecha futura (reloj del movil mal puesto, o un
   dato corrupto) dejaba ese dia congelado para siempre: cada edicion
   nueva nacia con un sello menor y la fusion la descartaba en silencio. */
function bumpStampFloor(d) {
  for (const key in d.days) {
    const t = d.days[key].t || 0;
    if (t > lastStamp) lastStamp = t;
  }
}

function minutesOf(key) {
  const entry = doc.days[key];
  return entry ? entry.m : 0;
}
function setMinutes(key, mins) {
  const value = Math.max(0, mins);
  doc.days[key] = { m: value, t: stamp() };
  persist();
}
function addMinutes(key, mins) {
  setMinutes(key, minutesOf(key) + mins);
}

/* --------------------------- microdetalles -------------------------- */

function haptic(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignorar */ }
}

function toast(message, isWarning) {
  const wrap = $("toastWrap");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = '<span class="dot" style="background:' + (isWarning ? "#ff6b6b" : "#3ddc97") + '"></span>';
  el.appendChild(document.createTextNode(message));
  wrap.appendChild(el);
  setTimeout(() => {
    el.classList.add("out");
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

function ripple(event) {
  const btn = event.currentTarget;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const span = document.createElement("span");
  span.className = "ripple";
  span.style.width = span.style.height = size + "px";
  span.style.left = (event.clientX - rect.left - size / 2) + "px";
  span.style.top = (event.clientY - rect.top - size / 2) + "px";
  btn.appendChild(span);
  setTimeout(() => span.remove(), 600);
}

function wireButton(el, handler) {
  if (!el) return;
  el.addEventListener("click", (e) => { ripple(e); handler(e); });
}

function bump(el) {
  if (!el) return;
  el.classList.remove("bump");
  void el.offsetWidth;              // reinicia la animación
  el.classList.add("bump");
  setTimeout(() => el.classList.remove("bump"), 380);
}

/* ---------------------------- sesiones ------------------------------ */

async function acquireWakeLock() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch (e) { wakeLock = null; }
}
function releaseWakeLock() {
  try { if (wakeLock) wakeLock.release(); } catch (e) { /* ignorar */ }
  wakeLock = null;
}

/* Una sesión se guarda como tramos de trabajo más el que esté abierto:
   { startedAt: <ms o null si está en pausa>, tramos: [{from, to}, ...] }.
   Guardar tramos y no un total acumulado es lo que permite que
   commitRange() siga repartiendo bien entre días: una sesión que empieza
   a las 23:40, se pausa y se reanuda a las 00:20 tiene que dejar minutos
   en los dos días, no todos en uno. */
function tramosDe(s) {
  return (s && Array.isArray(s.tramos)) ? s.tramos : [];
}
function sessionPausada() {
  return !!session && !session.startedAt;
}
function sessionMs() {
  if (!session) return 0;
  let total = 0;
  for (const t of tramosDe(session)) total += Math.max(0, t.to - t.from);
  if (session.startedAt) total += Math.max(0, Date.now() - session.startedAt);
  return total;
}

function startSession() {
  session = { startedAt: Date.now(), tramos: [] };
  writeJSON(K.SESSION, session);
  haptic(12);
  acquireWakeLock();
  render();
  startTicking();
  toast("Sesión iniciada");
  // El grupo se entera en el acto, no dentro de 45 segundos.
  if (group && supaReady()) ciclo({});
}

function pauseSession() {
  if (!session || !session.startedAt) return;
  session.tramos = tramosDe(session).concat([{ from: session.startedAt, to: Date.now() }]);
  session.startedAt = null;
  writeJSON(K.SESSION, session);
  stopTicking();
  releaseWakeLock();        // en pausa no hace falta mantener la pantalla
  haptic(10);
  render();
  toast("Sesión en pausa");
  // Se deja de anunciar como "en sesión": en pausa no estás trabajando.
  if (group && supaReady()) ciclo({});
}

function resumeSession() {
  if (!session || session.startedAt) return;
  session.startedAt = Date.now();
  writeJSON(K.SESSION, session);
  acquireWakeLock();
  startTicking();
  haptic(12);
  render();
  toast("Sesión reanudada");
  if (group && supaReady()) ciclo({});
}

/* Reparte el tiempo entre días si la sesión cruza la medianoche. */
function commitRange(from, to) {
  let cursor = from;
  let total = 0;
  while (cursor < to) {
    const day = new Date(cursor);
    const midnight = new Date(day);
    midnight.setHours(24, 0, 0, 0);
    const end = Math.min(to, midnight.getTime());
    const mins = (end - cursor) / 60000;
    if (mins > 0) { addMinutes(dateKey(day), mins); total += mins; }
    cursor = end;
  }
  return total;
}

function stopSession() {
  if (!session) return;
  // Se cierra el tramo abierto, si lo había, y se guardan todos.
  const tramos = tramosDe(session).slice();
  if (session.startedAt) tramos.push({ from: session.startedAt, to: Date.now() });
  const elapsed = tramos.reduce((n, t) => n + Math.max(0, t.to - t.from), 0) / 60000;

  session = null;
  localStorage.removeItem(K.SESSION);
  localStorage.removeItem(K.OLD_SES);
  stopTicking();
  releaseWakeLock();

  if (elapsed >= MIN_SAVE_MIN) {
    // Tramo a tramo: cada uno se reparte entre los días que toque.
    for (const t of tramos) commitRange(t.from, t.to);
    haptic([10, 40, 18]);
    render();
    popToday();
    toast("Guardado: " + fmtMinutes(elapsed));
    if (group && supaReady()) ciclo({ conDias: true });   // el grupo se entera al momento
  } else {
    render();
    toast("Sesión demasiado corta, no se ha guardado", true);
  }
}

function discardSession() {
  if (!session) return;
  session = null;
  localStorage.removeItem(K.SESSION);
  localStorage.removeItem(K.OLD_SES);
  stopTicking();
  releaseWakeLock();
  render();
  toast("Sesión descartada", true);
  if (group && supaReady()) ciclo({});
}

function startTicking() {
  stopTicking();
  tickHandle = setInterval(tick, 1000);
}
function stopTicking() {
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = null;
  document.title = "Deep Work";
}

function tick() {
  // si el reloj cruza la medianoche con la app abierta, redibujamos entero
  const nowKey = dateKey(new Date());
  if (nowKey !== lastTodayKey) { lastTodayKey = nowKey; render(); return; }

  pintarReloj();
  if (session) {
    document.title = fmtClock(Math.floor(sessionMs() / 1000)) + " · Deep Work";
  }
  updateStats();
  updateTodayCell();
  // La fila propia la refresca refrescarPresencia(), que sólo reescribe
  // textos: reconstruir la lista entera cada minuto se llevaba por delante
  // el foco, el scroll interno y las animaciones a media asta.
}

/* --------------------- recuperación de sesión ----------------------- */
/* Si el móvil se apagó con una sesión abierta, al volver no damos por
   buenas ocho horas de trabajo: preguntamos. */

function checkRecovery() {
  if (!session || !session.startedAt) return;   // en pausa no corre el tiempo

  // El umbral mira SÓLO el tramo abierto, que es el único que puede
  // haberse quedado colgado con el móvil apagado. Medir el acumulado
  // mataba jornadas legítimas: 3 h por la mañana + pausa para comer +
  // 2 h por la tarde ya pasaban de LONG_SESSION_H, y al volver a la
  // pestaña la sesión en marcha se moría en la cara.
  const abiertoH = (Date.now() - session.startedAt) / 3600000;
  if (abiertoH < LONG_SESSION_H) return;

  // El corte se congela AQUÍ, no cuando se pulsa el botón: si no, el
  // aviso podía quedarse una hora en pantalla, guardarse hasta el
  // instante del clic y solaparse con una sesión empezada mientras tanto,
  // contando dos veces la misma franja.
  const abierto = { from: session.startedAt, to: Date.now() };
  const tramos = tramosDe(session).slice().concat([abierto]);
  const totalH = tramos.reduce((n, t) => n + Math.max(0, t.to - t.from), 0) / 3600000;
  pendingRecovery = { startedAt: session.startedAt, hours: totalH, abiertoH: abiertoH, tramos: tramos };
  session = null;
  stopTicking();
  renderNotice();
}

function renderNotice() {
  const slot = $("noticeSlot");
  if (!pendingRecovery) { slot.innerHTML = ""; return; }

  const started = new Date(pendingRecovery.startedAt);
  const when = started.toLocaleString("es-ES", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  slot.innerHTML =
    '<div class="notice">' +
      '<span>Había una sesión abierta desde el ' + when + ' (' + fmtMinutes(pendingRecovery.hours * 60) + ').</span>' +
      '<span class="spacer"></span>' +
      '<button class="btn btn-primary" id="recKeep" style="padding:8px 12px;font-size:12px">Guardarla</button>' +
      '<button class="btn btn-ghost" id="recDrop" style="padding:8px 12px;font-size:12px">Descartar</button>' +
    '</div>';

  /* Limpia el rastro de la sesión recuperada sin tocar una que esté
     corriendo ahora. Antes esto borraba K.SESSION a secas: si mientras el
     aviso estaba en pantalla habías empezado una sesión nueva, se cargaba
     su registro y al recargar la app esa sesión había desaparecido. */
  const cerrarAviso = () => {
    pendingRecovery = null;
    localStorage.removeItem(K.OLD_SES);
    if (session) writeJSON(K.SESSION, session);
    else localStorage.removeItem(K.SESSION);
    // Mientras el aviso estaba en pantalla no se anunciaba nada al grupo
    // (sesionSegundos devuelve null con pendingRecovery puesto). Ahora que
    // hay decisión, que se entere en el momento.
    if (group && supaReady()) ciclo({ conDias: true });
  };

  wireButton($("recKeep"), () => {
    const mins = pendingRecovery.hours * 60;
    // Los tramos ya incluyen el abierto, cerrado en el momento de la
    // detección: lo que se guarda coincide exactamente con lo que dice el
    // aviso, pase el tiempo que pase hasta que se pulsa.
    for (const t of (pendingRecovery.tramos || [])) commitRange(t.from, t.to);
    cerrarAviso();
    render();
    popToday();
    toast("Guardado: " + fmtMinutes(mins));
  });
  wireButton($("recDrop"), () => {
    cerrarAviso();
    render();
    toast("Sesión descartada", true);
  });
}

/* ------------------------------ modal ------------------------------- */

let closeModal = null;

let modalSeq = 0;

function openModal(html, setup) {
  if (closeModal) closeModal();
  const slot = $("modalSlot");
  const antes = document.activeElement;          // a dónde vuelve el foco al cerrar
  const tituloId = "modal-titulo-" + (++modalSeq);

  const backdrop = document.createElement("div");
  backdrop.className = "backdrop";
  backdrop.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="' + tituloId + '">' + html + "</div>";
  slot.appendChild(backdrop);

  const caja = backdrop.querySelector(".modal");
  const titulo = caja.querySelector("h2");
  if (titulo) titulo.id = tituloId;              // el diálogo tiene nombre accesible

  const close = () => {
    backdrop.classList.add("closing");
    // Se retira este backdrop concreto, no todo el contenedor: antes el
    // temporizador de 200 ms vaciaba el hueco entero y se llevaba por
    // delante el modal que se acabara de abrir encima.
    setTimeout(() => backdrop.remove(), 200);
    document.removeEventListener("keydown", onKey, true);
    closeModal = null;
    if (antes && antes.focus) { try { antes.focus(); } catch (e) { /* ya no existe */ } }
  };

  const enfocables = () => caja.querySelectorAll(
    'button:not([disabled]), input:not([disabled]), [href], select, textarea, [tabindex]:not([tabindex="-1"])'
  );

  const onKey = (e) => {
    if (e.key === "Escape") { e.preventDefault(); close(); return; }
    if (e.key !== "Tab") return;
    // El foco se queda dentro del diálogo mientras esté abierto.
    const lista = enfocables();
    if (!lista.length) return;
    const primero = lista[0], ultimo = lista[lista.length - 1];
    // Se contempla el caso de que el foco esté en la propia caja (que es
    // donde lo deja openModal cuando nadie lo pide): con shift+Tab desde
    // ahí, el foco se escapaba a la capa de debajo.
    const foco = document.activeElement;
    if (!caja.contains(foco)) { e.preventDefault(); (e.shiftKey ? ultimo : primero).focus(); return; }
    if (e.shiftKey && (foco === primero || foco === caja)) { e.preventDefault(); ultimo.focus(); }
    else if (!e.shiftKey && foco === ultimo) { e.preventDefault(); primero.focus(); }
  };

  backdrop.addEventListener("mousedown", (e) => { if (e.target === backdrop) close(); });
  document.addEventListener("keydown", onKey, true);
  closeModal = close;
  setup(close);

  // Si nadie ha pedido el foco, se lo lleva el propio diálogo, para que un
  // lector de pantalla lo anuncie y el tabulador no siga en la página.
  if (!caja.contains(document.activeElement)) {
    caja.setAttribute("tabindex", "-1");
    caja.focus();
  }
}

function openDayEditor(key) {
  const date = keyToDate(key);
  const current = Math.round(minutesOf(key));
  const title = capitalize(date.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" }));
  const isToday = key === dateKey(new Date());

  openModal(
    "<h2>" + title + "</h2>" +
    '<div class="sub">' + (isToday ? "Hoy · " : "") + "Minutos de trabajo profundo</div>" +
    '<div class="stepper">' +
      '<button class="step-btn" data-delta="-15">−15</button>' +
      '<input type="number" id="dayMinutes" min="0" step="5" inputmode="numeric" value="' + current + '" />' +
      '<button class="step-btn" data-delta="15">+15</button>' +
    "</div>" +
    '<div class="presets">' +
      '<button class="chip" data-add="25">+25 pomodoro</button>' +
      '<button class="chip" data-add="50">+50</button>' +
      '<button class="chip" data-add="90">+90</button>' +
      '<button class="chip" data-set="0">Vaciar</button>' +
    "</div>" +
    '<div class="modal-actions">' +
      '<button class="btn btn-ghost" id="dayCancel">Cancelar</button>' +
      '<button class="btn btn-primary" id="daySave">Guardar</button>' +
    "</div>",
    (close) => {
      const input = $("dayMinutes");
      const read = () => clamp(parseFloat(input.value) || 0, 0, 24 * 60);
      const write = (v) => { input.value = Math.round(clamp(v, 0, 24 * 60)); haptic(8); };

      document.querySelectorAll(".step-btn").forEach((btn) => {
        btn.onclick = () => write(read() + parseFloat(btn.dataset.delta));
      });
      document.querySelectorAll(".chip").forEach((chip) => {
        chip.onclick = () => {
          if (chip.dataset.set !== undefined) write(parseFloat(chip.dataset.set));
          else write(read() + parseFloat(chip.dataset.add));
        };
      });

      input.focus();
      input.select();
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") $("daySave").click(); });

      wireButton($("dayCancel"), close);
      wireButton($("daySave"), () => {
        const before = minutesOf(key);
        setMinutes(key, read());
        close();
        render();
        popCell(key);
        haptic(12);
        const diff = minutesOf(key) - before;
        toast(diff === 0 ? "Sin cambios" : (diff > 0 ? "+" : "−") + fmtMinutes(Math.abs(diff)) + " el " + title.toLowerCase());
      });
    }
  );
}

/* --------------------------- copia y datos -------------------------- */

function exportData() {
  const payload = { app: "deepwork", exportedAt: new Date().toISOString(), version: 2, days: doc.days, prefs: prefs };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "deepwork-" + dateKey(new Date()) + ".json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast("Copia descargada");
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const raw = JSON.parse(String(reader.result));
      const incoming = normalize(raw.days ? { version: 2, days: raw.days, updatedAt: stamp() } : raw);
      const before = new Set(Object.keys(doc.days));
      doc = mergeDocs(doc, incoming);
      if (raw.prefs && typeof raw.prefs.goal === "number") { prefs.goal = raw.prefs.goal; savePrefs(); }
      persist();
      render();
      const added = Object.keys(doc.days).filter((k) => !before.has(k)).length;
      toast("Importado · " + added + (added === 1 ? " día nuevo" : " días nuevos"));
    } catch (e) {
      toast("El archivo no es válido", true);
    }
  };
  reader.readAsText(file);
}

/* ----------------------------- render ------------------------------- */

function liveMinutes() {
  return sessionMs() / 60000;
}

/* Parte de la sesion en marcha que cae dentro de un dia concreto. Antes se
   sumaba entera a "hoy", asi que una sesion empezada a las 23:30 aparecia
   a las 00:15 como 45 minutos del dia nuevo, cuando media hora era de ayer.
   Al pararla, commitRange() si repartia bien, y las cifras daban un salto.
   El final del dia se calcula con setDate y no sumando 24 horas, para que
   los domingos de cambio de hora (23 o 25 horas) salgan bien. */
function liveMinutesOn(key) {
  if (!session) return 0;
  const inicio = keyToDate(key).getTime();
  const fin = new Date(keyToDate(key));
  fin.setDate(fin.getDate() + 1);
  const finMs = fin.getTime();

  const abiertos = tramosDe(session).slice();
  if (session.startedAt) abiertos.push({ from: session.startedAt, to: Date.now() });

  let ms = 0;
  for (const t of abiertos) {
    const desde = Math.max(t.from, inicio);
    const hasta = Math.min(t.to, finMs);
    if (hasta > desde) ms += hasta - desde;
  }
  return ms / 60000;
}

function minutesForDay(key) {
  return minutesOf(key) + liveMinutesOn(key);
}

function render() {
  // El día se recalcula en cada pintado. Si no, tras pasar la medianoche
  // con la app abierta, la barra de objetivo seguía midiendo contra el día
  // anterior porque lastTodayKey se había quedado atrás.
  lastTodayKey = dateKey(new Date());
  document.body.classList.toggle("running", !!session && !sessionPausada());
  document.body.classList.toggle("paused", sessionPausada());
  renderTimer();
  renderNotice();
  renderGrid();
  updateStats();
  updateGoal();
  updateSummary();
  renderRanking();
}

function renderTimer() {
  const buttons = $("timerButtons");

  if (session) {
    const pausada = sessionPausada();
    buttons.innerHTML =
      (pausada
        ? '<button class="btn btn-primary" id="resumeBtn">▶ Reanudar</button>'
        : '<button class="btn btn-ghost" id="pauseBtn">❚❚ Pausar</button>') +
      '<button class="btn btn-stop" id="stopBtn">■ Terminar</button>';
    if (pausada) wireButton($("resumeBtn"), resumeSession);
    else wireButton($("pauseBtn"), pauseSession);
    wireButton($("stopBtn"), stopSession);
    $("dialState").textContent = pausada ? "EN PAUSA" : "EN SESIÓN";
    // Descartar deja de compartir fila con los botones grandes: con tres
    // no caben en un movil, y es la accion que menos se usa.
    $("stageExtra").innerHTML = '<button class="link-btn" id="discardBtn">Descartar sesión</button>';
    wireButton($("discardBtn"), discardSession);
  } else {
    buttons.innerHTML = '<button class="btn btn-primary" id="startBtn">● Empezar sesión</button>';
    wireButton($("startBtn"), startSession);
    $("dialState").textContent = "LISTO";
    $("stageExtra").innerHTML = '<button class="link-btn" id="manualOpenBtn">+ Añadir tiempo a mano</button>';
    wireButton($("manualOpenBtn"), () => openDayEditor(dateKey(new Date())));

/* Parado, la cifra grande es EL TOTAL DE HOY: un 00:00 muerto desperdicia
   el elemento principal de la pantalla. Corriendo, el cronómetro. */
/* ------------------------- reloj de aletas -------------------------- */

const sinMovimiento = window.matchMedia("(prefers-reduced-motion: reduce)");
let flipAletas = [];
let relojEstrenado = false;

/* Se monta una vez. Reconstruirlo en cada pintado mataria la animacion a
   media asta y tiraria el estado de cada aleta. */
function montarReloj() {
  const aleta = '<span class="flip" data-d="0">' +
      '<span class="flip-mitad f-arr"><span>0</span></span>' +
      '<span class="flip-mitad f-aba"><span>0</span></span>' +
      '<span class="flip-hoja  f-arr"><span>0</span></span>' +
      '<span class="flip-hoja  f-aba"><span>0</span></span>' +
    "</span>";
  const dosPuntos = '<span class="flip-dosp"><i></i><i></i></span>';
  const cont = $("timerClock");
  cont.innerHTML = aleta + aleta + dosPuntos + aleta + aleta + dosPuntos + aleta + aleta;
  flipAletas = [].slice.call(cont.querySelectorAll(".flip"));
}

/* Cambiar un digito: la hoja de arriba cae con el viejo mientras la mitad
   de arriba ya lleva el nuevo detras; despues la hoja de abajo sube con
   el nuevo y, al acabar, la mitad de abajo se pone al dia. */
function ponerAleta(el, nuevo, animar) {
  if (!el || el.dataset.d === nuevo) return;
  const viejo = el.dataset.d;
  el.dataset.d = nuevo;
  const mArr = el.children[0].firstElementChild;
  const mAba = el.children[1].firstElementChild;
  const hArr = el.children[2].firstElementChild;
  const hAba = el.children[3].firstElementChild;

  if (!animar || sinMovimiento.matches) {
    mArr.textContent = nuevo;
    mAba.textContent = nuevo;
    return;
  }

  hArr.textContent = viejo;
  hAba.textContent = nuevo;
  mArr.textContent = nuevo;
  el.classList.remove("girando");
  void el.offsetWidth;          // reinicia la animacion si venia girando
  el.classList.add("girando");
  clearTimeout(el.tempo);
  el.tempo = setTimeout(() => {
    mAba.textContent = nuevo;
    el.classList.remove("girando");
  }, 560);
}

/* Parado, el reloj marca EL TOTAL DE HOY: un 00:00:00 muerto desperdicia
   el elemento principal de la pantalla. Corriendo, la sesion. */
function pintarReloj() {
  const secs = session
    ? Math.max(0, Math.floor(sessionMs() / 1000))
    : Math.max(0, Math.round(minutesForDay(lastTodayKey) * 60));
  const horas = Math.min(99, Math.floor(secs / 3600));
  const cifras = pad(horas) + pad(Math.floor((secs % 3600) / 60)) + pad(secs % 60);

  // Sin sesion no hay nada que girar: la cifra de hoy no cambia sola.
  const animar = relojEstrenado && !!session && !sessionPausada();
  for (let i = 0; i < 6; i++) ponerAleta(flipAletas[i], cifras.charAt(i), animar);
  relojEstrenado = true;

  const sr = $("timerClockSr");
  if (sr) sr.textContent = (session ? "Sesión: " : "Hoy: ") + fmtMinutes(secs / 60);
}

function updateStats() {
  const today = startOfDay(new Date());
  const todayKey = dateKey(today);
  const totalToday = minutesForDay(todayKey);

  const weekStart = startOfWeek(today);
  let totalWeek = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    if (d > today) break;
    totalWeek += minutesForDay(dateKey(d));
  }

  let streak = 0;
  const cursor = new Date(today);
  if (!(totalToday > 0)) cursor.setDate(cursor.getDate() - 1);
  while (minutesForDay(dateKey(cursor)) > 0) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }

  const nextToday = fmtMinutes(totalToday);
  const nextWeek = fmtMinutes(totalWeek);
  const nextStreak = streak + " día" + (streak === 1 ? "" : "s");

  const pinta = (id, valor, anterior, etiqueta) => {
    if (valor === anterior) return;
    const el = $(id);
    el.textContent = valor;
    el.setAttribute("aria-label", etiqueta + ": " + valor);
    if (anterior !== null) bump(el.parentElement);
  };
  pinta("statToday", nextToday, lastStats.today, "Hoy");
  pinta("statWeek", nextWeek, lastStats.week, "Esta semana");
  pinta("statStreak", nextStreak, lastStats.streak, "Racha");

  lastStats = { today: nextToday, week: nextWeek, streak: nextStreak };
  updateGoal(totalToday);
}

const DIAL_VUELTA = 2 * Math.PI * 88;   // el radio del <circle> del SVG

function updateGoal(totalToday) {
  const mins = totalToday === undefined ? minutesForDay(lastTodayKey) : totalToday;
  const frac = clamp(mins / prefs.goal, 0, 1);
  const done = mins >= prefs.goal;
  const arco = $("dialArc");

  arco.style.strokeDashoffset = String(DIAL_VUELTA * (1 - frac));
  arco.classList.toggle("done", done);
  $("dialWrap").setAttribute("aria-valuenow", Math.round(frac * 100));

  const falta = Math.max(0, prefs.goal - mins);
  $("goalText").textContent = done
    ? "Objetivo cumplido · " + fmtMinutes(mins)
    : (session ? fmtMinutes(mins) + " hoy · faltan " + fmtMinutes(falta)
               : "Faltan " + fmtMinutes(falta) + " de " + fmtMinutes(prefs.goal));
}

function updateSummary() {
  const values = Object.keys(doc.days).map((k) => doc.days[k].m).filter((m) => m > 0);
  const total = values.reduce((a, b) => a + b, 0);
  const best = values.length ? Math.max.apply(null, values) : 0;
  $("sumTotal").textContent = fmtMinutes(total);
  $("sumBest").textContent = fmtMinutes(best);
  $("sumAvg").textContent = values.length ? fmtMinutes(total / values.length) : "0m";
  $("sumDays").textContent = String(values.length);
  // El resumen va en el título del pliegue para que se vea que el
  // historial sigue ahí sin tener que abrirlo.
  $("foldSub").textContent = values.length
    ? values.length + " días · " + fmtMinutes(total)
    : "todavía sin registros";
}

/* El calendario tiene dos orientaciones y son la MISMA rejilla: las mismas
   celdas, el mismo tooltip y el mismo teclado. Solo cambia quien es fila y
   quien es columna.
     - horizontal (movil): filas = dias de la semana, columnas = semanas.
       Es la tira ancha de siempre, la unica que cabe en un movil.
     - vertical (escritorio): filas = semanas, columnas = dias. Asi el
       calendario ocupa una columna estrecha y alta, como en la maqueta. */
const consultaAncha = window.matchMedia("(min-width: 1120px) and (min-height: 720px)");
function calendarioVertical() { return consultaAncha.matches; }
let orientacionPintada = null;

function renderGrid() {
  const today = startOfDay(new Date());
  const todayKey = dateKey(today);

  // Cuantas semanas se pintan. En horizontal siempre 26, que es lo que
  // cabe en la tira de un movil. En vertical, las que quepan en la columna
  // sin dejarla a medias: en una pantalla de 1080 son unas 29, en una alta
  // casi el año entero. Nunca menos de 26 (entonces hace scroll) ni mas de
  // 53, que ya es un año completo.
  const cuantas = semanasQueCaben();
  const firstWeek = startOfWeek(today);
  firstWeek.setDate(firstWeek.getDate() - 7 * (cuantas - 1));

  const semanas = [];
  for (let w = 0; w < cuantas; w++) {
    const dias = [];
    for (let d = 0; d < 7; d++) {
      const date = new Date(firstWeek);
      date.setDate(date.getDate() + 7 * w + d);
      dias.push(date);
    }
    semanas.push(dias);
  }

  function celda(date, retardo) {
    const key = dateKey(date);
    const future = date > today;
    const mins = future ? 0 : minutesForDay(key);
    const classes = ["cell"];
    if (future) classes.push("future");
    if (key === todayKey) classes.push("today");
    const style = "animation-delay:" + Math.min(retardo, 500) + "ms;" +
                  (future ? "" : "background:" + LEVEL_COLORS[levelFor(mins)] + ";");
    const label = date.toLocaleDateString("es-ES", { day: "numeric", month: "long" }) + ", " + fmtMinutes(mins);
    // Sólo hoy queda en el orden de tabulación; al resto se llega con las flechas.
    const tab = future ? "-1" : (key === todayKey ? "0" : "-1");
    return "<button type=\"button\" class=\"" + classes.join(" ") + "\" data-key=\"" + key + "\"" +
           ' tabindex="' + tab + '"' +
           (future ? " disabled aria-hidden=\"true\"" : ' aria-label="' + label + '"') +
           ' style="' + style + '"></button>';
  }

  const vertical = calendarioVertical();
  const wrap = $("gridWrap");

  // Se conserva el sitio donde estabas mirando. Antes cada render() —y hay
  // uno al volver a la pestaña— devolvia la rejilla al principio, o sea a
  // hace seis meses, dejando hoy fuera de pantalla.
  const pegado = vertical
    ? wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 4
    : wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 4;
  const antesX = wrap.scrollLeft;
  const antesY = wrap.scrollTop;
  const giro = orientacionPintada !== null && orientacionPintada !== vertical;

  $("gridInner").className = "grid-inner" + (vertical ? " vert" : "");
  wrap.className = "grid-wrap" + (vertical ? " vert" : "");

  if (vertical) {
    $("monthRow").innerHTML =
      '<div class="cal-gutter"></div>' +
      DAY_SHORT.map((d) => '<div class="month-cell">' + d + "</div>").join("");

    let lastMonth = null;
    let rowsHtml = "";
    semanas.forEach((dias, fila) => {
      // El mes se rotula en la semana donde cambia. Se mira el domingo y no
      // el lunes: una semana a caballo entre dos meses pertenece, para
      // quien la lee, al mes en el que acaba.
      const mes = dias[6].getMonth();
      let label = "";
      if (mes !== lastMonth) { label = dias[6].toLocaleDateString("es-ES", { month: "short" }); lastMonth = mes; }
      rowsHtml += '<div class="grid-row"><div class="day-label">' + label + "</div>" +
        dias.map((date, col) => celda(date, fila * 9 + col * 5)).join("") + "</div>";
    });
    $("gridRows").innerHTML = rowsHtml;
  } else {
    let lastMonth = null;
    let monthHtml = '<div style="width:38px"></div>';
    semanas.forEach((dias) => {
      const month = dias[0].getMonth();
      let label = "";
      if (month !== lastMonth) { label = dias[0].toLocaleDateString("es-ES", { month: "short" }); lastMonth = month; }
      monthHtml += '<div class="month-cell">' + label + "</div>";
    });
    $("monthRow").innerHTML = monthHtml;

    let rowsHtml = "";
    for (let row = 0; row < 7; row++) {
      rowsHtml += '<div class="grid-row"><div class="day-label">' + DAY_NAMES[row] + "</div>";
      semanas.forEach((dias, col) => { rowsHtml += celda(dias[row], col * 9 + row * 5); });
      rowsHtml += "</div>";
    }
    $("gridRows").innerHTML = rowsHtml;
  }

  orientacionPintada = vertical;
  if (pegado || giro) ponerHoyALaVista();
  else { wrap.scrollLeft = antesX; wrap.scrollTop = antesY; }
}

/* Hoy es la ultima celda de la rejilla, asi que llevarla a la vista es
   irse al final: a la derecha del todo en horizontal, abajo del todo en
   vertical. */
/* El lado de la celda sale del ancho de la columna, asi que el alto de
   fila se deduce de ahi: hueco del mes + su separacion + siete celdas con
   seis separaciones. */
const SEMANAS_MAX = 53;
function semanasQueCaben() {
  if (!calendarioVertical()) return WEEKS_TO_SHOW;
  const wrap = $("gridWrap");
  const css = getComputedStyle($("historyFold"));
  const gap = parseFloat(css.getPropertyValue("--cell-gap")) || 4;
  const hueco = parseFloat(css.getPropertyValue("--cal-gutter")) || 30;
  const util = wrap.clientWidth - hueco - gap * 7;
  if (util <= 0) return WEEKS_TO_SHOW;
  const paso = util / 7 + gap;
  const caben = Math.floor((wrap.clientHeight - 24) / paso);
  return Math.max(WEEKS_TO_SHOW, Math.min(SEMANAS_MAX, caben));
}

function ponerHoyALaVista() {
  const wrap = $("gridWrap");
  if (calendarioVertical()) wrap.scrollTop = wrap.scrollHeight;
  else wrap.scrollLeft = wrap.scrollWidth;
}

function updateTodayCell() {
  const cell = $("gridRows").querySelector('[data-key="' + lastTodayKey + '"]');
  if (!cell) return;
  const color = LEVEL_COLORS[levelFor(minutesForDay(lastTodayKey))];
  if (cell.style.backgroundColor !== color) cell.style.background = color;
}

function popCell(key) {
  const cell = $("gridRows").querySelector('[data-key="' + key + '"]');
  if (!cell) return;
  cell.classList.remove("pop");
  void cell.offsetWidth;
  cell.classList.add("pop");
  setTimeout(() => cell.classList.remove("pop"), 700);
}
function popToday() { popCell(lastTodayKey); }

/* ------------------------- tooltip de la rejilla -------------------- */

function showTip(cell) {
  const key = cell.dataset.key;
  const date = keyToDate(key);
  const mins = minutesForDay(key);
  const tip = $("tip");
  const objetivo = Math.max(1, prefs.goal || 120);
  const parte = Math.round((mins / objetivo) * 100);
  tip.innerHTML = "<b>" + fmtMinutes(mins) + "</b>" +
    (mins > 0 ? ' <small>· ' + parte + "% del objetivo</small>" : "") +
    ' <small>· ' + date.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "short" }) + "</small>";
  const rect = cell.getBoundingClientRect();

  // Se mide una vez visible para poder encajarlo dentro de la pantalla:
  // en las columnas de los extremos se salía por el lado, y en la fila del
  // lunes se salía por arriba.
  tip.classList.add("show");
  tip.style.left = "0px";
  tip.style.top = "0px";
  const ancho = tip.offsetWidth;
  const alto = tip.offsetHeight;
  const margen = 8;

  const centro = rect.left + rect.width / 2;
  tip.style.left = clamp(centro, margen + ancho / 2, innerWidth - margen - ancho / 2) + "px";

  const arriba = rect.top - 4;
  const cabeArriba = rect.top - alto - 14 >= margen;
  tip.classList.toggle("below", !cabeArriba);
  tip.style.top = (cabeArriba ? arriba : rect.bottom + alto + 14) + "px";

  $("hoverInfo").textContent =
    capitalize(date.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "short" })) + " · " + fmtMinutes(mins);
}
function hideTip() {
  $("tip").classList.remove("show");
  $("hoverInfo").innerHTML = "&nbsp;";
}

/* =====================================================================
   Ranking por grupos
   ---------------------------------------------------------------------
   El registro local sigue mandando: la app funciona igual sin conexión y
   sin grupo. Esto sólo añade una copia de tus minutos en Supabase para
   poder compararlos con los de tu gente. El código del grupo es la llave
   compartida; el secreto de cada miembro, guardado sólo en su
   dispositivo, es lo que impide que nadie escriba en tu nombre.
   ===================================================================== */

const SUPA = window.DEEPWORK_CONFIG || {};
const supaReady = () => !!(SUPA.SUPABASE_URL && SUPA.SUPABASE_KEY);
const supaBase = () => String(SUPA.SUPABASE_URL || "").replace(/\/+$/, "");

/* =====================================================================
   Cuenta de Google
   ---------------------------------------------------------------------
   Sin librería: el flujo de Supabase es una redirección de ida y vuelta.
   Se va a /auth/v1/authorize, Google pregunta, y Supabase devuelve aquí
   con los tokens en el trozo de la URL que va detrás de la almohadilla.

   Por qué importa: hasta ahora tu identidad en un grupo vivía sólo en el
   localStorage del móvil. Cuando el navegador lo borraba (iOS y Android
   lo hacen con las PWA que llevan días sin abrirse) la app se quedaba sin
   grupo, volvías a entrar y nacía una fila nueva mientras la vieja se
   quedaba con tus horas. Con la cuenta, la identidad la pone el servidor
   y es la misma en todos tus dispositivos.
   ===================================================================== */

let cuenta = readJSON(K.CUENTA);          // { access_token, refresh_token, expira, email }
let refrescando = null;

function sesionIniciada() { return !!(cuenta && cuenta.refresh_token); }

function leerJwt(token) {
  try {
    const cuerpo = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(decodeURIComponent(escape(atob(cuerpo))));
  } catch (e) { return {}; }
}

function guardarCuenta(datos) {
  if (!datos || !datos.access_token) { cuenta = null; localStorage.removeItem(K.CUENTA); return; }
  const claims = leerJwt(datos.access_token);
  cuenta = {
    access_token: datos.access_token,
    refresh_token: datos.refresh_token,
    // Se resta un minuto de margen: mejor refrescar de más que que caduque
    // en mitad de una petición.
    expira: Date.now() + (Number(datos.expires_in || 3600) - 60) * 1000,
    email: claims.email || (claims.user_metadata && claims.user_metadata.email) || "",
    nombre: (claims.user_metadata && (claims.user_metadata.full_name || claims.user_metadata.name)) || ""
  };
  writeJSON(K.CUENTA, cuenta);
}

/* Entrar con el correo. Supabase manda un mensaje que trae un código de
   seis cifras y/o un enlace: valen los dos caminos. El código es mejor en
   el móvil, porque no te saca de la app instalada. */
async function pedirCodigo(email) {
  const vuelta = location.origin + location.pathname;
  const r = await fetch(supaBase() + "/auth/v1/otp", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPA.SUPABASE_KEY },
    body: JSON.stringify({ email: email, create_user: true, options: { email_redirect_to: vuelta } })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.msg || d.error_description || d.message || "No se ha podido enviar el correo");
  return true;
}

async function verificarCodigo(email, codigo) {
  const r = await fetch(supaBase() + "/auth/v1/verify", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPA.SUPABASE_KEY },
    body: JSON.stringify({ type: "email", email: email, token: String(codigo).trim() })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.access_token) {
    throw new Error(d.msg || d.error_description || d.message || "El código no es válido o ha caducado");
  }
  guardarCuenta(d);
  return true;
}

function entrarConGoogle() {
  if (!supaReady()) { toast("Falta configurar Supabase", true); return; }
  // Se vuelve exactamente a esta página, sin parámetros ni almohadilla.
  const vuelta = location.origin + location.pathname;
  location.href = supaBase() + "/auth/v1/authorize?provider=google&redirect_to=" + encodeURIComponent(vuelta);
}

async function salirDeLaCuenta() {
  const token = cuenta && cuenta.access_token;
  guardarCuenta(null);
  // El grupo se conserva en local: la sesión de la cuenta y la pertenencia
  // al grupo son cosas distintas.
  renderRanking();
  if (token) {
    try {
      await fetch(supaBase() + "/auth/v1/logout", {
        method: "POST",
        headers: { apikey: SUPA.SUPABASE_KEY, Authorization: "Bearer " + token }
      });
    } catch (e) { /* da igual: en local ya está fuera */ }
  }
  toast("Sesión cerrada");
}

/* Recoge los tokens que Supabase deja en la URL al volver de Google. */
function recogerVuelta() {
  if (!location.hash || location.hash.indexOf("access_token") < 0) {
    // Google puede devolver también un error
    if (location.hash && location.hash.indexOf("error") >= 0) {
      const p = new URLSearchParams(location.hash.slice(1));
      const msg = p.get("error_description") || p.get("error");
      history.replaceState(null, "", location.origin + location.pathname);
      if (msg) setTimeout(() => toast(decodeURIComponent(msg.replace(/\+/g, " ")), true), 400);
    }
    return false;
  }
  const p = new URLSearchParams(location.hash.slice(1));
  guardarCuenta({
    access_token: p.get("access_token"),
    refresh_token: p.get("refresh_token"),
    expires_in: p.get("expires_in")
  });
  // La almohadilla se limpia para que los tokens no se queden en la barra
  // de direcciones ni en el historial.
  history.replaceState(null, "", location.origin + location.pathname);
  return true;
}

async function tokenValido() {
  if (!sesionIniciada()) return null;
  if (Date.now() < cuenta.expira) return cuenta.access_token;
  if (refrescando) return refrescando;

  refrescando = (async () => {
    try {
      const r = await fetch(supaBase() + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPA.SUPABASE_KEY },
        body: JSON.stringify({ refresh_token: cuenta.refresh_token })
      });
      const d = await r.json();
      if (!r.ok || !d.access_token) throw new Error("refresco rechazado");
      guardarCuenta(d);
      return cuenta.access_token;
    } catch (e) {
      // El refresco caducado deja la cuenta fuera, pero NO toca el grupo:
      // se sigue funcionando con las credenciales del dispositivo.
      guardarCuenta(null);
      renderRanking();
      return null;
    } finally {
      refrescando = null;
    }
  })();
  return refrescando;
}

/* Parámetros de presencia. Los umbrales del servidor y los de aquí tienen
   que moverse juntos: si el servidor descartara la sesión antes que el
   cliente, desaparecerías del grupo justo mientras la app te pregunta qué
   hacer con ella. Por eso FANTASMA_H (6) va una hora por encima de
   LONG_SESSION_H (5), que es cuando se pregunta. */
const P = {
  EN_LINEA_S:   150,        // sin latido más reciente, ya no está delante
  DORMIDO_S:    720,        // sesión abierta pero pantalla apagada
  FANTASMA_H:   6,          // igual que el interval '6 hours' de dw_board
  RANCIO_S:     120,        // pasado esto no se afirma nada sobre el presente
  CAD_SESION:      45000,   // sesión + pestaña visible
  CAD_SESION_OCULTA: 180000,
  CAD_MIRANDO:     45000,   // sin sesión, con la tabla a la vista
  CAD_LEJOS:      150000,   // sin sesión, la tabla fuera de pantalla
  VIGILANTE:       20000,   // sólo comprueba el reloj, no marca ritmo
  REPINTADO:       15000    // refresco local de las etiquetas de tiempo
};

let group = readJSON(K.GROUP);
let board = null;                       // última respuesta con members
let boardAt = 0;                        // cuándo llegó, para no mentir sobre el presente
let boardError = null;
let vista = (prefs.vista === "ranking") ? "ranking" : "gente";
let metric = (prefs.metric === "today" || prefs.metric === "total") ? prefs.metric : "week";
let syncState = { state: "idle", at: 0, error: null };
let boardFresh = false;
let enVuelo = null;                     // promesa del ciclo en curso
let otroCiclo = false;                  // había otro esperando
let diasSucios = false;
let edicionSeq = 0;                     // detecta ediciones hechas en pleno vuelo
let pushTimer = null;
let latidoTimer = null;
let vigilante = null;
let repintador = null;
let ultimoIntento = 0;
let fallosSeguidos = 0;
let filtroGente = "";

const RPC_TIMEOUT = 12000;

async function rpc(fn, args, opciones) {
  const base = supaBase();
  // Con la sesión iniciada, la petición va firmada por la cuenta: es lo
  // que hace que auth.uid() valga algo dentro de las funciones.
  const token = await tokenValido();
  // Con una red que acepta la conexión y luego no contesta (típico de un
  // wifi de bar), fetch se queda esperando indefinidamente.
  const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  const corte = ctrl ? setTimeout(() => ctrl.abort(), RPC_TIMEOUT) : null;

  let res;
  try {
    res = await fetch(base + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: SUPA.SUPABASE_KEY,
        Authorization: "Bearer " + (token || SUPA.SUPABASE_KEY)
      },
      body: JSON.stringify(args),
      signal: ctrl ? ctrl.signal : undefined,
      keepalive: !!(opciones && opciones.keepalive)
    });
  } catch (e) {
    throw new Error(e && e.name === "AbortError" ? "La conexión ha tardado demasiado" : "Sin conexión");
  } finally {
    if (corte) clearTimeout(corte);
  }

  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { /* respuesta vacía */ }
  if (!res.ok) {
    throw new Error((data && (data.message || data.hint || data.error_description)) || ("Error " + res.status));
  }
  return data;
}

function saveGroup() {
  if (group) writeJSON(K.GROUP, group);
  else localStorage.removeItem(K.GROUP);
  // Espejo en IndexedDB, igual que el registro de días. El localStorage es
  // lo primero que el navegador tira cuando hace limpieza, y perder estas
  // credenciales era justo lo que obligaba a volver a entrar en el grupo.
  idbSet("group", group || null);
}

/* Recupera la pertenencia por el orden más fiable primero: la cuenta
   (vale en cualquier dispositivo), luego el espejo local. */
async function recuperarGrupo() {
  if (!supaReady()) return;

  if (!group) {
    const espejo = await idbGet("group");
    if (espejo && espejo.memberId) { group = espejo; saveGroup(); renderRanking(); }
  }

  if (!sesionIniciada()) return;
  try {
    const r = await rpc("dw_my_membership", {});
    const lista = (r && r.memberships) || [];
    if (!lista.length) return;
    // Si ya hay grupo local y sigue estando entre los de la cuenta, se
    // conserva ese; si no, se coge el más reciente.
    const actual = group && lista.find((m) => m.group_id === group.groupId);
    const elegido = actual || lista[0];
    const nuevo = {
      code: elegido.code, name: elegido.name, groupId: elegido.group_id,
      memberId: elegido.member_id, secret: elegido.secret, nickname: elegido.nickname,
      isPublic: !!elegido.is_public, isOwner: !!elegido.is_owner,
      showPresence: elegido.show_presence !== false
    };
    const cambia = !group || group.memberId !== nuevo.memberId;
    group = nuevo;
    saveGroup();
    if (cambia) {
      prefs.nickname = nuevo.nickname;
      savePrefs();
      marcarSucio();
      renderRanking();
      toast("Grupo recuperado: " + nuevo.name);
    }
  } catch (e) { /* sin conexión se sigue con lo local */ }
}

/* Van también los días a cero: dw_sync hace upsert, así que si se
   omitieran, vaciar un día no lo borraría del ranking. */
function daysPayload() {
  const out = {};
  for (const key in doc.days) out[key] = Math.round(doc.days[key].m * 10) / 10;
  return out;
}

/* Segundos que lleva abierta la sesión, o null si no hay ninguna.
   OJO: no se lee K.SESSION del disco. Con el aviso de recuperación en
   pantalla, `session` vale null pero la clave SIGUE guardada a propósito;
   leerla a pelo te anunciaría "en sesión desde hace 8 horas" a todo el
   grupo mientras miras el aviso sin decidirte. */
function sesionSegundos() {
  // En pausa no se anuncia sesión: decir "en sesión" de alguien que la ha
  // parado sería mentir al grupo.
  if (pendingRecovery || !session || !session.startedAt) return null;
  const secs = Math.floor(sessionMs() / 1000);
  if (secs < 0 || secs > P.FANTASMA_H * 3600) return null;
  return secs;
}

function marcarSucio() {
  diasSucios = true;
  edicionSeq++;
}

function schedulePush() {
  if (!group || !supaReady()) return;
  marcarSucio();
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => ciclo({ forzar: true }), 2500);   // agrupa ráfagas
}

function cadencia() {
  if (document.visibilityState !== "visible") {
    return session ? P.CAD_SESION_OCULTA : null;   // sin sesión y oculta: no se late
  }
  if (session) return P.CAD_SESION;
  return tablaALaVista() ? P.CAD_MIRANDO : P.CAD_LEJOS;
}

function tablaALaVista() {
  const el = $("rankCard");
  if (!el) return false;
  const r = el.getBoundingClientRect();
  return r.bottom > 0 && r.top < innerHeight;
}

/* Un ciclo = una petición: minutos, latido y tabla a la vez. Al ser la
   misma petición, la carrera entre enviar y leer (que ya costó un parche
   en la versión anterior) deja de poder existir. */
function ciclo(opciones) {
  const op = opciones || {};
  if (!group || !supaReady()) return Promise.resolve();
  if (enVuelo) { otroCiclo = true; return enVuelo; }

  ultimoIntento = Date.now();
  const mandaDias = diasSucios || !!op.conDias;
  const seq = edicionSeq;                 // se captura ANTES de salir
  const quien = { id: group.memberId, secret: group.secret };

  /* Repliegue a las funciones antiguas mientras el SQL nuevo no esté
     puesto. Sin esto, publicar este cliente antes de migrar la base
     dejaría el ranking roto para todo el que ya tenga la app instalada.
     Se pierde la presencia, que es lo que no existe todavía; el ranking y
     el envío de minutos siguen funcionando igual. */
  const viejo = async () => {
    await rpc("dw_push", {
      p_member: quien.id, p_secret: quien.secret,
      p_days: mandaDias ? daysPayload() : {}, p_nickname: null
    });
    const r = await rpc("dw_leaderboard", { p_code: group.code, p_today: dateKey(new Date()) });
    return r ? { name: r.name, code: r.code, members: r.members } : null;
  };
  const faltaSync = (msg) => /dw_sync|404|Could not find|schema cache|not exist/i.test(String(msg));

  if (op.ruidoso) { syncState = { state: "sending", at: syncState.at, error: null }; renderSync(); }

  enVuelo = (async () => {
    try {
      let datos;
      try {
        datos = await rpc("dw_sync", {
          p_member: quien.id,
          p_secret: quien.secret,
          p_days: mandaDias ? daysPayload() : null,
          p_session_secs: sesionSegundos(),
          p_board: true,
          p_today: dateKey(new Date())
        });
      } catch (e) {
        if (!faltaSync(e.message)) throw e;
        datos = await viejo();
      }

      // Sólo se limpia si no ha habido ediciones mientras la petición
      // volaba. Limpiarlo a secas perdería esa edición para siempre, en
      // silencio, con la app diciendo "Al día".
      if (mandaDias && seq === edicionSeq) diasSucios = false;

      // El grupo puede haber cambiado durante la espera.
      if (group && group.memberId === quien.id) {
        if (datos && datos.members) { board = datos.members; boardAt = Date.now(); boardFresh = true; }
        if (datos) {
          let cambio = false;
          if (datos.name && datos.name !== group.name) { group.name = datos.name; cambio = true; }
          if (datos.code && datos.code !== group.code) { group.code = datos.code; cambio = true; }
          if (datos.group_id && datos.group_id !== group.groupId) { group.groupId = datos.group_id; cambio = true; }
          if (typeof datos.is_public === "boolean" && datos.is_public !== group.isPublic) { group.isPublic = datos.is_public; cambio = true; }
          if (typeof datos.is_owner === "boolean" && datos.is_owner !== group.isOwner) { group.isOwner = datos.is_owner; cambio = true; }
          if (typeof datos.show_presence === "boolean" && datos.show_presence !== group.showPresence) { group.showPresence = datos.show_presence; cambio = true; }
          if (cambio) saveGroup();
        }
        boardError = null;
        syncState = { state: "ok", at: Date.now(), error: null };
        fallosSeguidos = 0;
        try { localStorage.setItem(K.ULTIMO_CICLO, String(Date.now())); } catch (e) { /* modo privado */ }
        renderRanking();
      }
    } catch (e) {
      // Si el miembro ya no existe (te sacaron, o el grupo se borró al
      // quedarse vacío) no tiene sentido reintentar cada 45 segundos para
      // siempre: se suelta el grupo en local y se avisa una sola vez.
      if (/DW005|Credenciales no v/i.test(String(e.message)) && group && group.memberId === quien.id) {
        group = null;
        board = null;
        boardAt = 0;
        boardError = null;
        saveGroup();
        renderRanking();
        toast("Ya no perteneces a ese grupo", true);
      } else {
        boardError = e.message;
        fallosSeguidos++;
        syncState = { state: "error", at: syncState.at, error: e.message };
        renderSync();
      }
    }
    enVuelo = null;
    programarLatido();
    if (otroCiclo) { otroCiclo = false; setTimeout(() => ciclo({}), 300); }
  })();

  return enVuelo;
}

/* Nada de setInterval marcando el ritmo: Chrome estrangula los timers de
   las pestañas ocultas y congela la pestaña a los cinco minutos, y iOS
   suspende el proceso al bloquear la pantalla. Un latido que cuenta
   "han pasado 45 s de temporizador" se descuadra y no se recupera; uno
   que mira el reloj se pone al día en el primer tick que le concedan. */
function programarLatido() {
  clearTimeout(latidoTimer);
  const espera = cadencia();
  if (espera == null) return;
  const castigo = Math.min(fallosSeguidos, 4);
  const conFallo = castigo ? Math.min(espera * Math.pow(2, castigo), 240000) : espera;
  const jitter = 0.85 + Math.random() * 0.3;
  latidoTimer = setTimeout(() => ciclo({}), conFallo * jitter);
}

function arrancarVigilante() {
  clearInterval(vigilante);
  vigilante = setInterval(() => {
    if (!group || !supaReady()) return;
    const espera = cadencia();
    if (espera == null) return;
    if (Date.now() - ultimoIntento < espera) return;
    // Otra pestaña acaba de sincronizar: nos saltamos el turno. Falla
    // abierto a propósito: como mucho se duplica una petición, y dw_sync
    // es idempotente. Un turno con vencimiento fallaría cerrado, dejando
    // una pestaña sin sincronizar para siempre y sin ningún síntoma.
    const ultimo = Number(localStorage.getItem(K.ULTIMO_CICLO) || 0);
    if (Date.now() - ultimo < espera * 0.7) return;
    ciclo({});
  }, P.VIGILANTE);
}

function arrancarRepintador() {
  clearInterval(repintador);
  repintador = setInterval(refrescarPresencia, P.REPINTADO);
}

async function flushPendingLeaves() {
  if (!supaReady()) return;
  const cola = readJSON(K.PENDING_LEAVE);
  if (!cola || !cola.length) return;

  // Se retira de la cola sólo lo que se ha resuelto de verdad, una por
  // una. Reescribir la cola entera al final machacaba las bajas que se
  // hubieran encolado mientras las peticiones volaban, y un DW005
  // (miembro que ya no existe) se reintentaba eternamente.
  for (const credenciales of cola) {
    if (group && credenciales.p_member === group.memberId) { desencolarBaja(credenciales.p_member); continue; }
    try {
      await rpc("dw_leave", credenciales);
      desencolarBaja(credenciales.p_member);
    } catch (e) {
      if (/DW005|Credenciales no v/i.test(String(e.message))) desencolarBaja(credenciales.p_member);
    }
  }
}

async function syncNow(announce) {
  flushPendingLeaves();
  await ciclo({ forzar: true, conDias: true, ruidoso: announce });
  if (announce) toast(boardError ? "No se ha podido actualizar" : "Ranking actualizado", !!boardError);
}


/* --------------------------- estado de cada persona ------------------ */

/* Los segundos llegan del servidor como TRANSCURRIDOS, nunca como fechas:
   así el reloj del móvil deja de intervenir. Aquí se anclan al reloj
   propio para que sigan corriendo entre respuesta y respuesta. */
function edadDe(secs) {
  if (secs == null) return null;
  return secs + Math.floor((Date.now() - boardAt) / 1000);
}

function rancio() {
  return !boardAt || Date.now() - boardAt > P.RANCIO_S * 1000;
}

function estadoDe(p) {
  if (!p.show_presence) return "oculto";
  const visto = edadDe(p.seen_secs);
  const sesion = edadDe(p.session_secs);
  // Con datos viejos no se afirma nada sobre el presente: el ranking se
  // sigue viendo, porque esas cifras no caducan, pero ni un punto verde.
  if (rancio()) return "fuera";
  if (sesion != null && sesion < P.FANTASMA_H * 3600) {
    if (visto != null && visto <= P.EN_LINEA_S) return "sesion";
    if (visto != null && visto <= P.DORMIDO_S) return "dormido";
    return "fuera";
  }
  if (visto != null && visto <= P.EN_LINEA_S) return "linea";
  return "fuera";
}

function textoHace(secs) {
  if (secs == null) return "sin datos";
  if (secs < 60) return "hace un momento";
  const min = Math.floor(secs / 60);
  if (min < 60) return "hace " + min + " min";
  const h = Math.floor(min / 60);
  if (h < 6) return "hace " + h + " h";
  // Pasadas seis horas manda el día natural, que dice más que "hace 19 h".
  const cuando = new Date(Date.now() - secs * 1000);
  const hoy = startOfDay(new Date());
  const dia = startOfDay(cuando);
  const hora = cuando.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  const dias = Math.round((hoy - dia) / 86400000);
  if (dias === 0) return "hoy a las " + hora;
  if (dias === 1) return "ayer a las " + hora;
  if (dias < 7) return "hace " + dias + " días";
  return cuando.toLocaleDateString("es-ES", { day: "numeric", month: "short" });
}

function textoPresencia(p) {
  const estado = estadoDe(p);
  const sesion = edadDe(p.session_secs);
  if (estado === "oculto") return "no comparte su conexión";
  if (estado === "sesion") return "En sesión · " + fmtMinutes(sesion / 60);
  if (estado === "dormido") {
    // Entre 150 s y 12 min sin latido el contador se congela: decir la hora
    // de inicio es cierto tanto si sigue trabajando como si no.
    const desde = new Date(Date.now() - sesion * 1000);
    return "En sesión desde las " + desde.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  }
  if (estado === "linea") return "En línea";
  return textoHace(edadDe(p.seen_secs));
}

const ORDEN_PRESENCIA = { sesion: 0, dormido: 1, linea: 2, fuera: 3, oculto: 4 };


/* ------------------------------ pintado ----------------------------- */

const METRICS = [
  { id: "today", label: "Hoy" },
  { id: "week",  label: "Semana" },
  { id: "total", label: "Total" }
];

/* Un tono estable por apodo para el monograma: el mismo nombre siempre
   sale del mismo color, así se reconoce a la gente de un vistazo. */
/* Corona de quien creó el grupo. El servidor la marca por fila, así que
   la ve todo el mundo, no sólo el dueño. */
function corona(m) {
  if (!m || !m.is_owner) return "";
  return '<span class="corona" title="Creó el grupo" aria-hidden="true">👑</span>' +
         '<span class="sr-only">, creó el grupo</span>';
}

function tonoDe(nombre) {
  let h = 0;
  for (let i = 0; i < nombre.length; i++) h = (h * 31 + nombre.charCodeAt(i)) % 360;
  return "hsl(" + h + " 42% 42%)";
}
function inicialDe(nombre) {
  const limpio = String(nombre).trim();
  return (limpio ? limpio[0] : "?").toUpperCase();
}

/* Fila de datos común a las dos pestañas: mis propias cifras llevan
   sumada la sesión en marcha, que el servidor todavía no conoce. */
function filasDelGrupo() {
  // Cada cifra recibe la parte de la sesión que le toca. Sumar
  // liveMinutes() entera a "hoy" y a "la semana" deshacía el reparto por
  // días: una sesión empezada anoche inflaba el día de hoy con minutos de
  // ayer, y la semana con minutos de la semana pasada.
  const liveTotal = liveMinutes();
  const liveHoy = liveMinutesOn(lastTodayKey);
  let liveSemana = 0;
  {
    const lunes = startOfWeek(new Date());
    for (let i = 0; i < 7; i++) {
      const d = new Date(lunes);
      d.setDate(d.getDate() + i);
      liveSemana += liveMinutesOn(dateKey(d));
    }
  }
  return (board || []).map((m) => {
    const mine = group && m.member_id === group.memberId;
    return {
      raw: m,
      mine: !!mine,
      nickname: m.nickname,
      today: (m.today || 0) + (mine ? liveHoy : 0),
      week:  (m.week  || 0) + (mine ? liveSemana : 0),
      total: (m.total || 0) + (mine ? liveTotal : 0),
      streak: m.streak || 0,
      lastDay: m.last_day || null,
      estado: mine && session ? "sesion" : estadoDe(m)
    };
  });
}

/* ---- pestaña Gente: quién está ahora ---- */
function renderGente(body, filas) {
  // Ordena por presencia, no por minutos: quien empieza a trabajar sube,
  // que es justo el momento que se quiere ver. Desempate estable por
  // apodo para que las filas no bailen entre refrescos.
  const orden = filas.slice().sort((a, b) => {
    const d = ORDEN_PRESENCIA[a.estado] - ORDEN_PRESENCIA[b.estado];
    if (d) return d;
    if (a.estado === "sesion" || a.estado === "dormido") {
      return (edadDe(b.raw.session_secs) || 0) - (edadDe(a.raw.session_secs) || 0);
    }
    if (a.estado === "fuera") return (edadDe(a.raw.seen_secs) || 1e9) - (edadDe(b.raw.seen_secs) || 1e9);
    return a.nickname.localeCompare(b.nickname, "es");
  });

  const filtro = filtroGente.trim().toLowerCase();
  const visibles = filtro ? orden.filter((f) => f.nickname.toLowerCase().includes(filtro)) : orden;

  // Tres regímenes de densidad: tres amigos con filas apretadas parecen un
  // grupo muerto, y cuarenta con filas holgadas son metros de scroll.
  const densidad = orden.length <= 6 ? "holgado" : (orden.length <= 20 ? "" : "denso");

  const buscador = orden.length >= 15
    ? '<div class="people-filter"><input type="search" id="peopleFilter" placeholder="Buscar en el grupo" value="' + escapeHtml(filtroGente) + '" /></div>'
    : "";

  const html = visibles.map((f) => {
    const nombre = escapeHtml(f.nickname);
    const viva = f.estado === "sesion" || f.estado === "dormido";
    return '<div class="person' + (f.mine ? " me" : "") + '">' +
      '<span class="dot-state ' + f.estado + '" aria-hidden="true"></span>' +
      '<span class="mono" aria-hidden="true" style="background:' + tonoDe(f.nickname) + '">' + escapeHtml(inicialDe(f.nickname)) + "</span>" +
      '<div class="person-who">' +
        '<div class="person-name">' + nombre + corona(f.raw) +
          (f.mine ? '<span class="you">TÚ</span>' : "") + "</div>" +
        '<div class="person-sub' + (viva ? " viva" : "") + '">' +
          '<span data-presencia="' + escapeHtml(f.raw.member_id) + '">' +
            escapeHtml(textoPresencia(f.raw)) + "</span>" +
        "</div>" +
      "</div>" +
      '<div class="person-value">' + fmtMinutes(f.today) + "</div>" +
    "</div>";
  }).join("");

  body.innerHTML = buscador +
    '<div class="people ' + densidad + '">' + html + "</div>" +
    (rancio() && boardAt ? '<div class="stale-note">Datos de ' + textoHace(Math.floor((Date.now() - boardAt) / 1000)) + "</div>" : "") +
    (visibles.length ? "" : '<div class="rank-empty">Nadie con ese nombre.</div>') +
    (filtro ? "" : panelInvitacion(orden.length));
  cablearInvitacion();

  const campo = $("peopleFilter");
  if (campo) {
    campo.oninput = () => { filtroGente = campo.value; renderRanking(); $("peopleFilter").focus(); };
  }
}

/* ---- pestaña Ranking: quién lleva más ---- */
function renderTablaRanking(body, filas) {
  const orden = filas.slice().sort((a, b) => b[metric] - a[metric] || a.nickname.localeCompare(b.nickname, "es"));
  const top = orden.length ? Math.max(orden[0][metric], 1) : 1;
  const medals = ["🥇", "🥈", "🥉"];

  body.innerHTML = '<div class="rank-list">' + orden.map((r, i) => {
    const value = r[metric];
    const width = clamp((value / top) * 100, 0, 100);
    const conMedalla = i < 3 && value > 0;
    const puesto = '<span aria-hidden="true">' + (conMedalla ? medals[i] : "") + "</span>" +
                   '<span class="pos-num">' + (i + 1) + "</span>";
    // La presencia abre la linea de debajo. Antes solo estaba en la
    // pestaña Gente: en el ranking veias las horas de alguien sin saber si
    // estaba trabajando en ese momento, que es la mitad de la gracia.
    const viva = r.estado === "sesion" || r.estado === "dormido";
    const presencia = r.mine && session
      ? "En sesión · " + fmtMinutes(liveMinutes())
      : textoPresencia(r.raw);

    const sub = [];
    if (r.streak > 0) sub.push('<span aria-hidden="true">🔥</span> ' + r.streak + " día" + (r.streak === 1 ? "" : "s"));
    if (metric !== "total") sub.push("total " + fmtMinutes(r.total));
    if (!r.lastDay && !value) sub.push("sin registrar nada aún");

    const anim = boardFresh ? "animation-delay:" + Math.min(i * 45, 400) + "ms" : "animation:none";
    return '<div class="rank-row' + (r.mine ? " me" : "") + '" style="' + anim + '">' +
      '<div class="bar" aria-hidden="true" style="width:' + width + '%"></div>' +
      '<div class="rank-pos' + (conMedalla ? " medal" : "") + '">' + puesto + "</div>" +
      '<span class="dot-state ' + r.estado + '" aria-hidden="true"></span>' +
      '<span class="mono" aria-hidden="true" style="background:' + tonoDe(r.nickname) + '">' +
        escapeHtml(inicialDe(r.nickname)) + "</span>" +
      '<div class="rank-who">' +
        '<div class="rank-name">' + escapeHtml(r.nickname) + corona(r.raw) +
          (r.mine ? '<span class="you">TÚ</span>' : "") + "</div>" +
        '<div class="rank-sub' + (viva ? " viva" : "") + '">' +
          '<span data-presencia="' + escapeHtml(r.raw.member_id) + '">' + escapeHtml(presencia) + "</span>" +
          (sub.length ? " · " + sub.join(" · ") : "") +
        "</div>" +
      "</div>" +
      '<div class="rank-value">' + fmtMinutes(value) + "</div>" +
    "</div>";
  }).join("") + "</div>" + panelInvitacion(orden.length);
  cablearInvitacion();
}

/* Refresco local de las etiquetas de tiempo, sin tocar la red y sin
   reconstruir la lista: reconstruir el innerHTML cada 15 s se llevaría por
   delante el foco del teclado, el scroll interno y las animaciones. */
function refrescarPresencia() {
  if (!group || !board) return;
  document.querySelectorAll("[data-presencia]").forEach((el) => {
    const m = (board || []).find((x) => x.member_id === el.dataset.presencia);
    if (!m) return;
    const mio = group && m.member_id === group.memberId;
    const estado = mio && session ? "sesion" : estadoDe(m);
    const texto = mio && session ? "En sesión · " + fmtMinutes(liveMinutes()) : textoPresencia(m);
    if (el.textContent !== texto) el.textContent = texto;
    // El estado se pinta igual en Gente y en Ranking: el punto va en la
    // fila y el verde en la linea de debajo, sea cual sea la pestaña.
    const linea = el.closest(".person-sub, .rank-sub");
    if (linea) linea.classList.toggle("viva", estado === "sesion" || estado === "dormido");
    const fila = el.closest(".person, .rank-row");
    const punto = fila && fila.querySelector(".dot-state");
    if (punto && !punto.classList.contains(estado)) punto.className = "dot-state " + estado;
  });
}

/* ===================== hoja de grupos ===================== */

let closeSheet = null;

function openSheet(titulo, cuerpoHtml, pieHtml, setup) {
  if (closeSheet) closeSheet();
  const slot = $("sheetSlot");
  const antes = document.activeElement;

  const back = document.createElement("div");
  back.className = "sheet-back";
  back.innerHTML =
    '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + escapeHtml(titulo) + '">' +
      '<div class="sheet-head"><h2>' + escapeHtml(titulo) + "</h2>" +
        '<button class="link-btn" data-cerrar aria-label="Cerrar">Cerrar</button></div>' +
      '<div class="sheet-body">' + cuerpoHtml + "</div>" +
      (pieHtml ? '<div class="sheet-foot">' + pieHtml + "</div>" : "") +
    "</div>";
  slot.appendChild(back);

  // Referencias directas, nunca $(). Al reabrir la hoja, la anterior sigue
  // 220 ms en el DOM mientras se cierra, y un getElementById devolvía la
  // que se estaba muriendo: la hoja nueva nacía sin listeners.
  const caja = back.querySelector(".sheet");
  const cuerpo = back.querySelector(".sheet-body");
  const btnCerrar = back.querySelector("[data-cerrar]");

  const close = () => {
    back.classList.add("closing");
    setTimeout(() => back.remove(), 220);
    document.removeEventListener("keydown", onKey, true);
    if (closeSheet === close) closeSheet = null;
    if (antes && antes.focus) { try { antes.focus(); } catch (e) { /* ya no existe */ } }
  };

  const enfocables = () => caja.querySelectorAll(
    'button:not([disabled]), input:not([disabled]), [href], select, textarea, [tabindex]:not([tabindex="-1"])'
  );

  const onKey = (e) => {
    // Con un modal abierto encima, las teclas le tocan a él.
    if (closeModal) return;
    if (e.key === "Escape") { e.preventDefault(); close(); return; }
    if (e.key !== "Tab") return;
    // El foco se queda dentro de la hoja: antes el tabulador seguía
    // recorriendo la página de debajo, que sigue en el DOM.
    const lista = enfocables();
    if (!lista.length) return;
    const primero = lista[0], ultimo = lista[lista.length - 1];
    const dentro = caja.contains(document.activeElement);
    if (!dentro) { e.preventDefault(); (e.shiftKey ? ultimo : primero).focus(); return; }
    if (e.shiftKey && (document.activeElement === primero || document.activeElement === caja)) {
      e.preventDefault(); ultimo.focus();
    } else if (!e.shiftKey && document.activeElement === ultimo) {
      e.preventDefault(); primero.focus();
    }
  };

  back.addEventListener("mousedown", (e) => {
    if (closeModal) return;              // el modal de encima manda
    if (e.target === back) close();      // sólo el fondo, no la hoja
  });
  document.addEventListener("keydown", onKey, true);
  wireButton(btnCerrar, close);
  closeSheet = close;

  caja.setAttribute("tabindex", "-1");
  caja.focus();

  if (setup) setup(close, cuerpo);
}
