<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Deep Work</title>
<meta name="description" content="Registro diario de sesiones de trabajo profundo." />
<meta name="theme-color" content="#14141a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Deep Work" />
<link rel="manifest" href="manifest.json" />
<!-- El SVG es el que usa la pestaña: es vectorial y sale nítido a 16 px.
     El PNG queda de reserva para iOS, que no admite favicons en SVG. -->
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root {
    /* Paleta. Antes el fondo era casi negro (#020203) y los grises pequeños
       se perdían: --dim sobre la tarjeta daba 2,96:1, por debajo del 4,5:1
       que pide WCAG AA. Ahora las superficies son gris pizarra y los grises
       de texto están subidos hasta pasar el umbral:
         --dim   sobre --card → 5,3:1
         --muted sobre --card → 7,6:1
         --accent sobre --card → 4,6:1 */
    --bg: #14141a;
    --card: #1c1c24;
    --panel: #232330;
    --panel-2: #2b2b38;
    --raised: #33333f;
    --line: rgba(255,255,255,.09);
    --line-2: rgba(255,255,255,.17);
    --text: #f4f4f8;
    --muted: #adadbd;
    --dim: #8f8fa1;
    --accent: #5b7cff;
    --accent-deep: #3651d4;
    --good: #3ddc97;
    --veil: rgba(10,10,14,.74);
    /* Escala de la rejilla. Es la única fuente: la leyenda y el JS la leen
       de aquí, para que no haya que cambiar el color en tres sitios. */
    --l0: #2f2f3d;
    --l1: #2a3a80;
    --l2: #3a50b4;
    --l3: #4a65dd;
    --l4: #7d97ff;
    --ease: cubic-bezier(.22,1,.36,1);
    --spring: cubic-bezier(.34,1.4,.64,1);
    --cell: 16px;
    --cell-gap: 4px;
  }

  * { box-sizing: border-box; }

  html, body { overscroll-behavior-y: none; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  /* resplandor de fondo: sutil en reposo, respira durante la sesion */
  body::before {
    content: "";
    position: fixed;
    inset: -30vh -30vw auto;
    height: 70vh;
    background: radial-gradient(50% 50% at 50% 50%, rgba(91,124,255,.13), transparent 70%);
    opacity: .5;
    transition: opacity .8s var(--ease);
    pointer-events: none;
    z-index: 0;
  }
  body.running::before { animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .7; } 50% { opacity: 1.1; } }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;   /* en el movil la barra del navegador se retrae */
    display: flex;
    align-items: center;
    justify-content: center;
    /* Zona segura por los cuatro lados. Antes solo estaba la de abajo, y
       como la app declara viewport-fit=cover con la barra de estado
       translucida, en un iPhone con muesca la cabecera quedaba tapada por
       el reloj, y en horizontal la muesca se comia la columna de dias. */
    padding: calc(20px + env(safe-area-inset-top))
             calc(12px + env(safe-area-inset-right))
             calc(24px + env(safe-area-inset-bottom))
             calc(12px + env(safe-area-inset-left));
  }

  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 22px 20px 18px;
    width: 100%;
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 24px 70px rgba(0,0,0,.6);
    animation: cardIn .5s var(--ease) both;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.99); } }

  /* ---------- cabecera ---------- */
  .header-row {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 14px; margin-bottom: 16px;
  }
  .eyebrow { font-size: 11px; letter-spacing: .14em; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -.01em; }

  .stats-row { display: flex; gap: 8px; }
  .stat-box {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 12px; min-width: 74px; text-align: center;
    transition: transform .35s var(--spring), border-color .35s var(--ease);
  }
  .stat-box.bump { transform: translateY(-3px); border-color: rgba(91,124,255,.45); }
  .stat-value {
    font-family: "SF Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .stat-label { font-size: 10px; color: var(--dim); margin-top: 2px; }

  /* ---------- objetivo del dia ---------- */
  .goal { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
  .goal-bar {
    position: relative; flex: 1; height: 6px; border-radius: 99px;
    background: var(--l0); overflow: hidden;
  }
  .goal-fill {
    position: absolute; inset: 0 auto 0 0; width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent-deep), var(--accent));
    transition: width .7s var(--ease), background .4s var(--ease);
  }
  .goal-fill.done { background: linear-gradient(90deg, #2fa877, var(--good)); }
  .goal-fill::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    transform: translateX(-100%);
  }
  .goal-fill.done::after { animation: sheen 2.2s var(--ease) .1s 2; }
  @keyframes sheen { to { transform: translateX(100%); } }
  .goal-text { font-size: 11px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- panel de control ---------- */
  .control-panel {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 18px; margin-bottom: 20px;
    transition: border-color .5s var(--ease), box-shadow .5s var(--ease);
  }
  body.running .control-panel {
    border-color: rgba(91,124,255,.3);
    box-shadow: 0 0 0 1px rgba(91,124,255,.08), 0 10px 40px rgba(54,81,212,.14);
  }

  .timer-block { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pulse {
    width: 8px; height: 8px; border-radius: 99px; background: var(--dim);
    transition: background .4s var(--ease); flex-shrink: 0;
  }
  body.running .pulse { background: var(--accent); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(91,124,255,.5); }
    50% { box-shadow: 0 0 0 7px rgba(91,124,255,0); }
  }

  .timer-clock {
    font-family: "SF Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: 20px; min-width: 104px; opacity: .3;
    font-variant-numeric: tabular-nums;
    transition: opacity .4s var(--ease);
  }
  .timer-clock.active { opacity: 1; }

  #timerButtons { display: flex; gap: 8px; }

  .btn {
    position: relative; overflow: hidden;
    border: none; border-radius: 10px; padding: 10px 16px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; color: var(--text);
    touch-action: manipulation;
    transition: transform .18s var(--spring), background .2s var(--ease), border-color .2s var(--ease);
    animation: btnIn .3s var(--ease) both;
  }
  @keyframes btnIn { from { opacity: 0; transform: scale(.94); } }
  .btn:active { transform: scale(.95); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent-deep); color: #fff; }
  .btn-stop { background: #f2f2f5; color: #0c0c0e; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line-2); font-weight: 500; }

  /* onda al pulsar */
  .ripple {
    position: absolute; border-radius: 99px; transform: scale(0);
    background: rgba(255,255,255,.35); pointer-events: none;
    animation: ripple .55s var(--ease) forwards;
  }
  @keyframes ripple { to { transform: scale(2.6); opacity: 0; } }

  .divider { width: 1px; align-self: stretch; background: var(--line); }

  /* ---------- rejilla ---------- */
  .grid-wrap { overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .grid-wrap::-webkit-scrollbar { height: 6px; }
  .grid-wrap::-webkit-scrollbar-thumb { background: var(--l0); border-radius: 99px; }
  .grid-inner { display: inline-block; min-width: 100%; }

  .month-row { display: flex; gap: var(--cell-gap); margin-bottom: 4px; }
  .month-cell { width: var(--cell); font-size: 10px; color: var(--dim); white-space: nowrap; }
  .grid-row { display: flex; gap: var(--cell-gap); align-items: center; margin-bottom: var(--cell-gap); }
  /* La columna de dias se queda fija al desplazar la rejilla: si no, al
     abrir la app ya desplazada hasta hoy, Lun-Dom quedaban fuera de
     pantalla y las filas no se podian identificar. */
  .day-label {
    width: 38px; font-size: 11px; color: var(--muted); flex-shrink: 0;
    position: sticky; left: 0; z-index: 3;
    background: var(--card);
  }

  .cell {
    width: var(--cell); height: var(--cell); border-radius: 4px; flex-shrink: 0;
    cursor: pointer; padding: 0; border: 1px solid rgba(255,255,255,.03);
    background: var(--l0);
    position: relative;
    touch-action: manipulation;   /* sin esto, el doble toque hacia zoom */
    transition: transform .2s var(--spring), box-shadow .2s var(--ease), background .45s var(--ease);
    animation: cellIn .4s var(--ease) both;
  }
  /* El cuadrado se ve pequeño pero la zona sensible se agranda por debajo,
     que era el problema real: con celdas de 16px la yema tapaba cuatro a la
     vez y se editaba el dia equivocado. */
  .cell::after { content: ""; position: absolute; inset: calc(var(--cell-gap) / -2); }
  @keyframes cellIn { from { opacity: 0; transform: scale(.4); } }
  .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 4; }
  .cell.today { border: 1.5px solid rgba(255,255,255,.85); }
  .cell.future { background: transparent; border: 1px solid rgba(255,255,255,.05); cursor: default; }
  .cell.future::after { content: none; }
  .cell.pop { animation: cellPop .6s var(--spring); }
  @keyframes cellPop { 0% { transform: scale(1); } 45% { transform: scale(1.7); } 100% { transform: scale(1); } }

  /* Los efectos de raton solo donde hay raton. En una pantalla tactil el
     :hover se queda pegado tras el toque: la celda se quedaba ampliada y el
     tooltip no desaparecia hasta tocar en otro sitio. */
  @media (hover: hover) and (pointer: fine) {
    .cell:hover { transform: scale(1.32); box-shadow: 0 3px 10px rgba(0,0,0,.5); z-index: 2; }
    .cell.future:hover { transform: none; box-shadow: none; }
    .btn-primary:hover { background: #4a67e8; }
    .btn-stop:hover { background: #fff; }
    .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,.28); }
    .step-btn:hover { background: var(--raised); }
    .chip:hover { color: var(--text); border-color: var(--line-2); }
    .link-btn:hover { color: var(--text); background: rgba(255,255,255,.07); }
    .code-chip:hover { border-color: var(--accent); background: var(--raised); }
    .metric-tab:hover { color: var(--muted); }
    .rank-row:hover { background: rgba(255,255,255,.04); }
  }

  .legend-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; flex-wrap: wrap; gap: 8px; }
  .legend { display: flex; align-items: center; gap: 4px; }
  .legend-label { font-size: 10px; color: var(--dim); margin: 0 4px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; }
  .hover-info { font-size: 12px; color: var(--muted); min-height: 16px; }

  /* ---------- resumen inferior ---------- */
  .summary {
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--dim);
  }
  .summary b { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .summary .spacer { flex: 1; min-width: 0; }
  .link-btn {
    background: none; border: none; color: var(--dim); font-size: 11px; font-family: inherit;
    cursor: pointer; padding: 3px 7px; border-radius: 6px;
    transition: color .2s, background .2s;
  }

  /* ---------- tooltip ---------- */
  .tip {
    position: fixed; z-index: 50; pointer-events: none;
    background: var(--raised); border: 1px solid var(--line-2);
    border-radius: 8px; padding: 6px 9px; font-size: 11.5px; color: var(--text);
    white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.55);
    opacity: 0; transform: translate(-50%, -4px);
    transition: opacity .15s var(--ease), transform .15s var(--ease);
  }
  .tip.show { opacity: 1; transform: translate(-50%, -10px); }
  /* cuando no cabe encima de la celda, se coloca debajo */
  .tip.below { transform: translate(-50%, 4px); }
  .tip.below.show { transform: translate(-50%, 10px); }
  .tip small { color: var(--dim); }

  /* ---------- modal ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 60;
    background: var(--veil); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn .2s var(--ease);
    /* El teclado del movil encoge la pantalla visible pero no este fondo
       fijo, asi que el modal quedaba centrado en la pantalla completa y los
       botones Guardar/Cancelar caian debajo del teclado, sin manera de
       alcanzarlos. Con scroll propio y altura maxima en dvh, el modal
       siempre se puede desplazar hasta los botones. */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: calc(16px + env(safe-area-inset-top))
             calc(16px + env(safe-area-inset-right))
             calc(16px + env(safe-area-inset-bottom))
             calc(16px + env(safe-area-inset-left));
  }
  .backdrop.closing { animation: fadeOut .18s var(--ease) forwards; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }

  .modal {
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 20px; padding: 22px; width: 100%; max-width: 340px;
    box-shadow: 0 30px 80px rgba(0,0,0,.7);
    animation: modalIn .32s var(--spring) both;
    margin: auto;                 /* centrado sin romper el scroll del fondo */
    max-height: none;
  }
  .backdrop.closing .modal { animation: modalOut .18s var(--ease) forwards; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(16px) scale(.95); } }
  @keyframes modalOut { to { opacity: 0; transform: translateY(8px) scale(.97); } }

  .modal h2 { margin: 0 0 2px; font-size: 16px; font-weight: 650; }
  .modal .sub { font-size: 12px; color: var(--dim); margin-bottom: 16px; }

  .stepper { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .step-btn {
    width: 46px; height: 46px; flex-shrink: 0;
    border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-2);
    color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; touch-action: manipulation;
    transition: transform .18s var(--spring), background .2s;
  }
  .step-btn:active { transform: scale(.9); }

  input {
    background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 10px;
    padding: 12px; color: var(--text); font-family: inherit;
    outline: none; width: 100%; min-width: 0;
    font-variant-numeric: tabular-nums;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
    /* 16px es obligatorio: por debajo, Safari en iOS amplia la pagina al
       enfocar el campo y el modal se sale de la pantalla, sin volver solo
       al cerrarlo. Antes estaba en 15px. */
    font-size: 16px;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,124,255,.16); }
  input[type=number] { text-align: center; -moz-appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 99px; padding: 6px 11px; font-size: 11.5px; cursor: pointer;
    font-family: inherit; touch-action: manipulation;
    transition: transform .18s var(--spring), background .2s, color .2s, border-color .2s;
  }
  .chip:active { transform: scale(.93); }

  .modal-actions { display: flex; gap: 8px; }
  .modal-actions .btn { flex: 1; padding: 12px; }

  /* ---------- aviso de sesion recuperada ---------- */
  .notice {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: rgba(91,124,255,.08); border: 1px solid rgba(91,124,255,.25);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 16px;
    font-size: 12.5px; color: #c9d2ff;
    animation: cardIn .35s var(--ease) both;
  }
  .notice .spacer { flex: 1; min-width: 8px; }

  /* ---------- toast ---------- */
  .toast-wrap {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 80;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none;
  }
  .toast {
    background: var(--raised); border: 1px solid var(--line-2); color: var(--text);
    border-radius: 12px; padding: 10px 16px; font-size: 13px;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
    animation: toastIn .38s var(--spring) both;
    display: flex; align-items: center; gap: 8px;
  }
  .toast.out { animation: toastOut .28s var(--ease) forwards; }
  .toast .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--good); flex-shrink: 0; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(18px) scale(.94); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(10px) scale(.97); } }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ---------- ranking ---------- */
  .stack { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 1020px; }

  .rank-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
  }
  .rank-head h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
  .rank-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .code-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 7px 10px; cursor: pointer;
    font-family: "SF Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: 13px; letter-spacing: .12em; color: var(--text);
    transition: transform .18s var(--spring), border-color .2s, background .2s;
  }
  .code-chip:active { transform: scale(.96); }
  .code-chip .hint { font-family: inherit; font-size: 10px; letter-spacing: 0; color: var(--dim); }

  .metric-tabs { display: flex; gap: 4px; background: var(--panel); border-radius: 10px; padding: 3px; }
  .metric-tab {
    border: none; background: transparent; color: var(--dim);
    font-family: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
    transition: color .2s var(--ease), background .3s var(--ease);
  }
  .metric-tab.on { background: var(--panel-2); color: var(--text); }

  .rank-list { display: flex; flex-direction: column; gap: 2px; }

  .rank-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px; border-radius: 12px;
    position: relative; overflow: hidden;
    border: 1px solid transparent;
    transition: background .25s var(--ease), border-color .25s var(--ease);
    animation: rowIn .42s var(--ease) both;
  }
  @keyframes rowIn { from { opacity: 0; transform: translateY(8px); } }
  .rank-row.me { background: rgba(91,124,255,.09); border-color: rgba(91,124,255,.26); }

  /* barra proporcional al mejor del grupo */
  .rank-row .bar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: linear-gradient(90deg, rgba(54,81,212,.30), rgba(91,124,255,.06));
    transition: width .8s var(--ease);
    z-index: 0;
  }
  .rank-row > *:not(.bar) { position: relative; z-index: 1; }

  .rank-pos {
    width: 30px; flex-shrink: 0; text-align: center;
    font-family: "SF Mono", ui-monospace, monospace; font-size: 13px;
    font-variant-numeric: tabular-nums; color: var(--dim); font-weight: 600;
    display: flex; flex-direction: column; align-items: center; line-height: 1.1;
  }
  .rank-pos.medal { font-size: 15px; }
  .rank-pos.medal .pos-num { font-size: 9px; opacity: .75; }

  .rank-who { flex: 1; min-width: 0; }
  .rank-name {
    font-size: 14px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rank-name .you {
    font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--accent);
    margin-left: 6px; vertical-align: 1px;
  }

  @media (prefers-reduced-motion: reduce) {

</style>

<script src="config.js"></script>
<script>
"use strict";

/* =======================================================================
   Deep Work — registro diario
   Los datos viven en el dispositivo, en tres sitios a la vez (localStorage,
   copia de seguridad e IndexedDB) y se fusionan al arrancar. Así un borrado
   parcial del navegador no se lleva el historial por delante.
   ======================================================================= */

const K = {
  LOG:     "deepwork:log:v2",
  BACKUP:  "deepwork:log:backup:v2",
  SESSION: "deepwork:session:v2",
  PREFS:   "deepwork:prefs:v2",
  GROUP:   "deepwork:group:v1",
  PENDING_LEAVE: "deepwork:leave-pendiente:v1",
  OLD_LOG: "deepwork-log",
  OLD_SES: "deepwork-active-session"
};

const WEEKS_TO_SHOW = 26;
/* La escala sale del CSS (--l0..--l4), que es la unica fuente. Antes estaba
   repetida en tres sitios: aqui, en la leyenda y en :root. */
const LEVEL_COLORS = (() => {
  const cs = getComputedStyle(document.documentElement);
  return [0, 1, 2, 3, 4].map((i) => cs.getPropertyValue("--l" + i).trim() || "#2f2f3d");
})();
const DAY_NAMES = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const LONG_SESSION_H = 5;   // por encima de esto, al volver preguntamos qué hacer
const MIN_SAVE_MIN = 0.5;   // sesiones más cortas no se guardan

/* ---------------------------- utilidades ---------------------------- */

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

function dateKey(d) {
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function keyToDate(key) {
  const p = key.split("-").map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}
function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
}
function startOfWeek(d) {
  const x = startOfDay(d);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));  // semana que empieza en lunes
  return x;
}
function fmtMinutes(mins) {
  const total = Math.round(mins);
  const h = Math.floor(total / 60);
  const m = total % 60;
  if (h === 0) return m + "m";
  if (m === 0) return h + "h";
  return h + "h " + m + "m";
}
function fmtClock(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor((s % 3600) / 60)) + ":" + pad(s % 60);
}
function levelFor(mins) {
  if (!mins || mins <= 0) return 0;
  if (mins < 30) return 1;
  if (mins < 90) return 2;
  if (mins < 180) return 3;
  return 4;
}
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/* ------------------------- almacenamiento --------------------------- */
/* Documento: { version: 2, days: { "2026-08-23": { m: minutos, t: sello } } }
   El sello por día permite fusionar dos copias sin perder nada: gana la
   escritura más reciente de ese día concreto, no el documento entero. */

function readJSON(key) {
  try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; }
}
function writeJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
}

function emptyDoc() { return { version: 2, days: {}, updatedAt: 0 }; }

function normalize(raw) {
  const doc = emptyDoc();
  if (!raw || typeof raw !== "object") return doc;

  if (raw.version === 2 && raw.days) {
    doc.updatedAt = raw.updatedAt || 0;
    for (const key in raw.days) {
      const v = raw.days[key];
      if (typeof v === "number") doc.days[key] = { m: v, t: doc.updatedAt };
      else if (v && typeof v.m === "number") doc.days[key] = { m: v.m, t: v.t || 0 };
    }
    return doc;
  }

  // formato antiguo: { "2026-08-23": 42 }
  for (const key in raw) {
    if (/^\d{4}-\d{2}-\d{2}$/.test(key) && typeof raw[key] === "number") {
      doc.days[key] = { m: raw[key], t: 1 };
    }
  }
  doc.updatedAt = 1;
  return doc;
}

function mergeDocs(a, b) {
  const out = emptyDoc();
  out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  const keys = new Set(Object.keys(a.days).concat(Object.keys(b.days)));
  keys.forEach((k) => {
    const x = a.days[k], y = b.days[k];
    if (!x) { out.days[k] = y; return; }
    if (!y) { out.days[k] = x; return; }
    out.days[k] = (y.t || 0) > (x.t || 0) ? y : x;   // empate: gana `a`
  });
  return out;
}

/* IndexedDB como tercera copia. Sobrevive a limpiezas que sí vacían
   localStorage, y en iOS aguanta bastante más. Todo con try/catch: si el
   navegador la bloquea (modo privado), la app sigue funcionando igual. */
const IDB = { name: "deepwork", store: "kv", version: 1 };

function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!("indexedDB" in window)) return reject(new Error("sin indexedDB"));
    const req = indexedDB.open(IDB.name, IDB.version);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(IDB.store)) req.result.createObjectStore(IDB.store);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const req = db.transaction(IDB.store, "readonly").objectStore(IDB.store).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return null; }
}
async function idbSet(key, value) {
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB.store, "readwrite");
      tx.objectStore(IDB.store).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* sin IndexedDB seguimos con localStorage */ }
}

/* Pide almacenamiento persistente. Es lo que evita que Safari y Chrome
   borren los datos por inactividad, que es el motivo real de que el
   historial "se reiniciara". */
async function requestPersistence() {
  try {
    if (navigator.storage && navigator.storage.persist) {
      if (await navigator.storage.persisted()) return true;
      return await navigator.storage.persist();
    }
  } catch (e) { /* ignorar */ }
  return false;
}

/* ------------------------------ estado ------------------------------ */

let doc = emptyDoc();
let prefs = Object.assign({ goal: 120 }, readJSON(K.PREFS) || {});
let session = null;          // { startedAt }
let tickHandle = null;
let wakeLock = null;
let lastTodayKey = dateKey(new Date());
let lastStats = { today: null, week: null, streak: null };
let pendingRecovery = null;

function loadSync() {
  let d = normalize(readJSON(K.LOG));
  d = mergeDocs(d, normalize(readJSON(K.BACKUP)));
  d = mergeDocs(d, normalize(readJSON(K.OLD_LOG)));
  doc = d;
  bumpStampFloor(doc);

  // La sesión se refleja siempre, también cuando ya no hay ninguna. Antes
  // esto solo asignaba, nunca limpiaba: si parabas la sesión en otra
  // pestaña, esta seguía contando y al pararla aquí sumaba el rato por
  // segunda vez.
  const raw = readJSON(K.SESSION) || readJSON(K.OLD_SES);
  const valida = raw && typeof raw.startedAt === "number" &&
                 raw.startedAt > 0 && raw.startedAt <= Date.now();
  // Con el aviso de recuperación en pantalla, K.SESSION sigue ahí a
  // propósito (para que sobreviva a una recarga), así que no se reactiva
  // sola: la decisión de guardarla o tirarla es del usuario.
  session = valida && !pendingRecovery ? { startedAt: raw.startedAt } : null;
}

async function loadAsync() {
  const fromIdb = normalize(await idbGet("log"));
  const merged = mergeDocs(doc, fromIdb);
  const changed = JSON.stringify(merged.days) !== JSON.stringify(doc.days);
  doc = merged;
  bumpStampFloor(doc);
  persist();                      // deja las tres copias al día desde el arranque
  if (changed) render();
}

/* Escribe fusionando antes con lo que haya en disco: si tienes la app
   abierta en dos pestañas, ninguna pisa el trabajo de la otra. */
function persist() {
  doc = mergeDocs(normalize(readJSON(K.LOG)), doc);
  doc.updatedAt = stamp();
  const ok = writeJSON(K.LOG, doc);
  writeJSON(K.BACKUP, doc);
  idbSet("log", doc);
  if (!ok) toast("No se ha podido guardar en este navegador", true);
  schedulePush();
}

function savePrefs() { writeJSON(K.PREFS, prefs); }

/* Sello estrictamente creciente. Con Date.now() a secas, dos escrituras en
   el mismo milisegundo empatan y la fusión se queda con la de disco: la
   segunda edición se perdía. */
let lastStamp = 0;
function stamp() {
  const now = Date.now();
  lastStamp = now > lastStamp ? now : lastStamp + 1;
  return lastStamp;
}

/* Pone el contador por encima del sello mas alto que ya haya guardado.
   Sin esto, un sello con fecha futura (reloj del movil mal puesto, o un
   dato corrupto) dejaba ese dia congelado para siempre: cada edicion
   nueva nacia con un sello menor y la fusion la descartaba en silencio. */
function bumpStampFloor(d) {
  for (const key in d.days) {
    const t = d.days[key].t || 0;
    if (t > lastStamp) lastStamp = t;
  }
}

function minutesOf(key) {
  const entry = doc.days[key];
  return entry ? entry.m : 0;
}
function setMinutes(key, mins) {
  const value = Math.max(0, mins);
  doc.days[key] = { m: value, t: stamp() };
  persist();
}
function addMinutes(key, mins) {
  setMinutes(key, minutesOf(key) + mins);
}

/* --------------------------- microdetalles -------------------------- */

function haptic(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignorar */ }
}

function toast(message, isWarning) {
  const wrap = $("toastWrap");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = '<span class="dot" style="background:' + (isWarning ? "#ff6b6b" : "#3ddc97") + '"></span>';
  el.appendChild(document.createTextNode(message));
  wrap.appendChild(el);
  setTimeout(() => {
    el.classList.add("out");
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

function ripple(event) {
  const btn = event.currentTarget;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const span = document.createElement("span");
  span.className = "ripple";
  span.style.width = span.style.height = size + "px";
  span.style.left = (event.clientX - rect.left - size / 2) + "px";
  span.style.top = (event.clientY - rect.top - size / 2) + "px";
  btn.appendChild(span);
  setTimeout(() => span.remove(), 600);
}

function wireButton(el, handler) {
  if (!el) return;
  el.addEventListener("click", (e) => { ripple(e); handler(e); });
}

function bump(el) {
  if (!el) return;
  el.classList.remove("bump");
  void el.offsetWidth;              // reinicia la animación
  el.classList.add("bump");
  setTimeout(() => el.classList.remove("bump"), 380);
}

/* ---------------------------- sesiones ------------------------------ */

async function acquireWakeLock() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch (e) { wakeLock = null; }
}
function releaseWakeLock() {
  try { if (wakeLock) wakeLock.release(); } catch (e) { /* ignorar */ }
  wakeLock = null;
}

function startSession() {
  session = { startedAt: Date.now() };
  writeJSON(K.SESSION, session);
  haptic(12);
  acquireWakeLock();
  render();
  startTicking();
  toast("Sesión iniciada");
}

/* Reparte el tiempo entre días si la sesión cruza la medianoche. */
function commitRange(from, to) {
  let cursor = from;
  let total = 0;
  while (cursor < to) {
    const day = new Date(cursor);
    const midnight = new Date(day);
    midnight.setHours(24, 0, 0, 0);
    const end = Math.min(to, midnight.getTime());
    const mins = (end - cursor) / 60000;
    if (mins > 0) { addMinutes(dateKey(day), mins); total += mins; }
    cursor = end;
  }
  return total;
}

function stopSession() {
  if (!session) return;
  const started = session.startedAt;
  const elapsed = (Date.now() - started) / 60000;
  session = null;
  localStorage.removeItem(K.SESSION);
  localStorage.removeItem(K.OLD_SES);
  stopTicking();
  releaseWakeLock();

  if (elapsed >= MIN_SAVE_MIN) {
    commitRange(started, Date.now());
    haptic([10, 40, 18]);
    render();
    popToday();
    toast("Guardado: " + fmtMinutes(elapsed));
    if (group && supaReady()) syncNow(false);   // el ranking se entera al momento
  } else {
    render();
    toast("Sesión demasiado corta, no se ha guardado", true);
  }
}

function discardSession() {
  if (!session) return;
  session = null;
  localStorage.removeItem(K.SESSION);
  localStorage.removeItem(K.OLD_SES);
  stopTicking();
  releaseWakeLock();
  render();
  toast("Sesión descartada", true);
}

function startTicking() {
  stopTicking();
  tickHandle = setInterval(tick, 1000);
}
function stopTicking() {
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = null;
  document.title = "Deep Work";
}

function tick() {
  // si el reloj cruza la medianoche con la app abierta, redibujamos entero
  const nowKey = dateKey(new Date());
  if (nowKey !== lastTodayKey) { lastTodayKey = nowKey; render(); return; }

  const clock = $("timerClock");
  if (session) {
    const secs = Math.floor((Date.now() - session.startedAt) / 1000);
    clock.textContent = fmtClock(secs);
    clock.classList.add("active");
    document.title = fmtClock(secs) + " · Deep Work";
  }
  updateStats();
  updateTodayCell();

  // durante la sesión, mi fila del ranking sube sola una vez por minuto
  if (session && group && Math.floor((Date.now() - session.startedAt) / 1000) % 60 === 0) renderRanking();
}

/* --------------------- recuperación de sesión ----------------------- */
/* Si el móvil se apagó con una sesión abierta, al volver no damos por
   buenas ocho horas de trabajo: preguntamos. */

function checkRecovery() {
  if (!session) return;
  const hours = (Date.now() - session.startedAt) / 3600000;
  if (hours < LONG_SESSION_H) return;

  pendingRecovery = { startedAt: session.startedAt, hours: hours };
  session = null;
  stopTicking();
  renderNotice();
}

function renderNotice() {
  const slot = $("noticeSlot");
  if (!pendingRecovery) { slot.innerHTML = ""; return; }

  const started = new Date(pendingRecovery.startedAt);
  const when = started.toLocaleString("es-ES", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  slot.innerHTML =
    '<div class="notice">' +
      '<span>Había una sesión abierta desde el ' + when + ' (' + fmtMinutes(pendingRecovery.hours * 60) + ').</span>' +
      '<span class="spacer"></span>' +
      '<button class="btn btn-primary" id="recKeep" style="padding:8px 12px;font-size:12px">Guardarla</button>' +
      '<button class="btn btn-ghost" id="recDrop" style="padding:8px 12px;font-size:12px">Descartar</button>' +
    '</div>';

  /* Limpia el rastro de la sesión recuperada sin tocar una que esté
     corriendo ahora. Antes esto borraba K.SESSION a secas: si mientras el
     aviso estaba en pantalla habías empezado una sesión nueva, se cargaba
     su registro y al recargar la app esa sesión había desaparecido. */
  const cerrarAviso = () => {
    pendingRecovery = null;
    localStorage.removeItem(K.OLD_SES);
    if (session) writeJSON(K.SESSION, session);
    else localStorage.removeItem(K.SESSION);
  };

  wireButton($("recKeep"), () => {
    const mins = pendingRecovery.hours * 60;
    commitRange(pendingRecovery.startedAt, Date.now());
    cerrarAviso();
    render();
    popToday();
    toast("Guardado: " + fmtMinutes(mins));
  });
  wireButton($("recDrop"), () => {
    cerrarAviso();
    render();
    toast("Sesión descartada", true);
  });
}

let closeModal = null;

let modalSeq = 0;

function openModal(html, setup) {
  if (closeModal) closeModal();
  const slot = $("modalSlot");
  const antes = document.activeElement;          // a dónde vuelve el foco al cerrar
  const tituloId = "modal-titulo-" + (++modalSeq);

  const backdrop = document.createElement("div");
  backdrop.className = "backdrop";
  backdrop.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="' + tituloId + '">' + html + "</div>";
  slot.appendChild(backdrop);

  const caja = backdrop.querySelector(".modal");
  const titulo = caja.querySelector("h2");
  if (titulo) titulo.id = tituloId;              // el diálogo tiene nombre accesible

  const close = () => {
    backdrop.classList.add("closing");
    // Se retira este backdrop concreto, no todo el contenedor: antes el
    // temporizador de 200 ms vaciaba el hueco entero y se llevaba por
    // delante el modal que se acabara de abrir encima.
    setTimeout(() => backdrop.remove(), 200);
    document.removeEventListener("keydown", onKey, true);
    closeModal = null;
    if (antes && antes.focus) { try { antes.focus(); } catch (e) { /* ya no existe */ } }
  };

  const enfocables = () => caja.querySelectorAll(
    'button:not([disabled]), input:not([disabled]), [href], select, textarea, [tabindex]:not([tabindex="-1"])'
  );

  const onKey = (e) => {
    if (e.key === "Escape") { e.preventDefault(); close(); return; }
    if (e.key !== "Tab") return;
    // El foco se queda dentro del diálogo mientras esté abierto.
    const lista = enfocables();
    if (!lista.length) return;
    const primero = lista[0], ultimo = lista[lista.length - 1];
    if (e.shiftKey && document.activeElement === primero) { e.preventDefault(); ultimo.focus(); }
    else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primero.focus(); }
  };

  backdrop.addEventListener("mousedown", (e) => { if (e.target === backdrop) close(); });
  document.addEventListener("keydown", onKey, true);
  closeModal = close;
  setup(close);

  // Si nadie ha pedido el foco, se lo lleva el propio diálogo, para que un
  // lector de pantalla lo anuncie y el tabulador no siga en la página.
  if (!caja.contains(document.activeElement)) {
    caja.setAttribute("tabindex", "-1");
    caja.focus();
  }
}

function exportData() {
  const payload = { app: "deepwork", exportedAt: new Date().toISOString(), version: 2, days: doc.days, prefs: prefs };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  link.href = url;
  link.download = "deepwork-" + dateKey(new Date()) + ".json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast("Copia descargada");
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const raw = JSON.parse(String(reader.result));
      const incoming = normalize(raw.days ? { version: 2, days: raw.days, updatedAt: stamp() } : raw);
      const before = new Set(Object.keys(doc.days));
      doc = mergeDocs(doc, incoming);
      if (raw.prefs && typeof raw.prefs.goal === "number") { prefs.goal = raw.prefs.goal; savePrefs(); }
      persist();
      render();
      const added = Object.keys(doc.days).filter((k) => !before.has(k)).length;
      toast("Importado · " + added + (added === 1 ? " día nuevo" : " días nuevos"));
    } catch (e) {
      toast("El archivo no es válido", true);
    }
  };
  reader.readAsText(file);
}

/* ----------------------------- render ------------------------------- */

function liveMinutes() {
  return session ? (Date.now() - session.startedAt) / 60000 : 0;
}

/* Parte de la sesion en marcha que cae dentro de un dia concreto. Antes se
   sumaba entera a "hoy", asi que una sesion empezada a las 23:30 aparecia
   a las 00:15 como 45 minutos del dia nuevo, cuando media hora era de ayer.
   Al pararla, commitRange() si repartia bien, y las cifras daban un salto.
   El final del dia se calcula con setDate y no sumando 24 horas, para que
   los domingos de cambio de hora (23 o 25 horas) salgan bien. */
function liveMinutesOn(key) {
  if (!session) return 0;
  const inicio = keyToDate(key);
  const fin = new Date(inicio);
  fin.setDate(fin.getDate() + 1);
  const desde = Math.max(session.startedAt, inicio.getTime());
  const hasta = Math.min(Date.now(), fin.getTime());
  return hasta > desde ? (hasta - desde) / 60000 : 0;
}

function minutesForDay(key) {
  return minutesOf(key) + liveMinutesOn(key);
}

function render() {
  // El día se recalcula en cada pintado. Si no, tras pasar la medianoche
  // con la app abierta, la barra de objetivo seguía midiendo contra el día
  // anterior porque lastTodayKey se había quedado atrás.
  lastTodayKey = dateKey(new Date());
  document.body.classList.toggle("running", !!session);
  renderTimer();
  renderNotice();
  renderGrid();
  updateStats();
  updateGoal();
  updateSummary();
  renderRanking();
}

function renderTimer() {
  const buttons = $("timerButtons");
  const clock = $("timerClock");

  if (session) {
    buttons.innerHTML =
      '<button class="btn btn-stop" id="stopBtn">■ Terminar</button>' +
      '<button class="btn btn-ghost" id="discardBtn">Descartar</button>';
    wireButton($("stopBtn"), stopSession);
    wireButton($("discardBtn"), discardSession);
    clock.classList.add("active");
    clock.textContent = fmtClock((Date.now() - session.startedAt) / 1000);
  } else {
    buttons.innerHTML = '<button class="btn btn-primary" id="startBtn">● Empezar sesión</button>';
    wireButton($("startBtn"), startSession);
    clock.classList.remove("active");
    clock.textContent = "00:00:00";
  }
}

function updateStats() {
  const today = startOfDay(new Date());
  const todayKey = dateKey(today);
  const totalToday = minutesForDay(todayKey);

  const weekStart = startOfWeek(today);
  let totalWeek = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    if (d > today) break;
    totalWeek += minutesForDay(dateKey(d));
  }

  let streak = 0;
  const cursor = new Date(today);
  if (!(totalToday > 0)) cursor.setDate(cursor.getDate() - 1);
  while (minutesForDay(dateKey(cursor)) > 0) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }

  const nextToday = fmtMinutes(totalToday);
  const nextWeek = fmtMinutes(totalWeek);
  const nextStreak = streak + " día" + (streak === 1 ? "" : "s");

  const pinta = (id, valor, anterior, etiqueta) => {
    if (valor === anterior) return;
    const el = $(id);
    el.textContent = valor;
    el.setAttribute("aria-label", etiqueta + ": " + valor);
    if (anterior !== null) bump(el.parentElement);
  };
  pinta("statToday", nextToday, lastStats.today, "Hoy");
  pinta("statWeek", nextWeek, lastStats.week, "Esta semana");
  pinta("statStreak", nextStreak, lastStats.streak, "Racha");

  lastStats = { today: nextToday, week: nextWeek, streak: nextStreak };
  updateGoal(totalToday);
}

function updateGoal(totalToday) {
  const mins = totalToday === undefined ? minutesForDay(lastTodayKey) : totalToday;
  const pct = clamp((mins / prefs.goal) * 100, 0, 100);
  const fill = $("goalFill");
  const done = mins >= prefs.goal;

  fill.style.width = pct + "%";
  if (done !== fill.classList.contains("done")) fill.classList.toggle("done", done);
  $("goalBar").setAttribute("aria-valuenow", Math.round(pct));
  $("goalText").textContent = done
    ? "Objetivo cumplido · " + fmtMinutes(mins)
    : fmtMinutes(mins) + " de " + fmtMinutes(prefs.goal);
}

function updateSummary() {
  const values = Object.keys(doc.days).map((k) => doc.days[k].m).filter((m) => m > 0);
  const total = values.reduce((a, b) => a + b, 0);
  const best = values.length ? Math.max.apply(null, values) : 0;
  $("sumTotal").textContent = fmtMinutes(total);
  $("sumBest").textContent = fmtMinutes(best);
  $("sumAvg").textContent = values.length ? fmtMinutes(total / values.length) : "0m";
  $("sumDays").textContent = String(values.length);
}

function renderGrid() {
  const today = startOfDay(new Date());
  const todayKey = dateKey(today);
  const firstWeek = startOfWeek(today);
  firstWeek.setDate(firstWeek.getDate() - 7 * (WEEKS_TO_SHOW - 1));

  const columns = [];
  for (let w = 0; w < WEEKS_TO_SHOW; w++) {
    const days = [];
    for (let d = 0; d < 7; d++) {
      const date = new Date(firstWeek);
      date.setDate(date.getDate() + 7 * w + d);
      days.push(date);
    }
    columns.push(days);
  }

  let lastMonth = null;
  let monthHtml = '<div style="width:38px"></div>';
  columns.forEach((days) => {
    const month = days[0].getMonth();
    let label = "";
    if (month !== lastMonth) { label = days[0].toLocaleDateString("es-ES", { month: "short" }); lastMonth = month; }
    monthHtml += '<div class="month-cell">' + label + "</div>";
  });
  $("monthRow").innerHTML = monthHtml;

  let rowsHtml = "";
  for (let row = 0; row < 7; row++) {
    rowsHtml += '<div class="grid-row"><div class="day-label">' + DAY_NAMES[row] + "</div>";
    columns.forEach((days, col) => {
      const date = days[row];
      const key = dateKey(date);
      const future = date > today;
      const mins = future ? 0 : minutesForDay(key);
      const classes = ["cell"];
      if (future) classes.push("future");
      if (key === todayKey) classes.push("today");
      const style = "animation-delay:" + Math.min(col * 9 + row * 5, 500) + "ms;" +
                    (future ? "" : "background:" + LEVEL_COLORS[levelFor(mins)] + ";");
      const label = date.toLocaleDateString("es-ES", { day: "numeric", month: "long" }) + ", " + fmtMinutes(mins);
      // Sólo hoy queda en el orden de tabulación; al resto se llega con las flechas.
      const tab = future ? "-1" : (key === todayKey ? "0" : "-1");
      rowsHtml += "<button type=\"button\" class=\"" + classes.join(" ") + "\" data-key=\"" + key + "\"" +
                  ' tabindex="' + tab + '"' +
                  (future ? " disabled aria-hidden=\"true\"" : ' aria-label="' + label + '"') +
                  ' style="' + style + '"></button>';
    });
    rowsHtml += "</div>";
  }
  $("gridRows").innerHTML = rowsHtml;
}

function updateTodayCell() {
  const cell = $("gridRows").querySelector('[data-key="' + lastTodayKey + '"]');
  if (!cell) return;
  const color = LEVEL_COLORS[levelFor(minutesForDay(lastTodayKey))];
  if (cell.style.backgroundColor !== color) cell.style.background = color;
}

function popCell(key) {
  const cell = $("gridRows").querySelector('[data-key="' + key + '"]');

  // Se mide una vez visible para poder encajarlo dentro de la pantalla:
  // en las columnas de los extremos se salía por el lado, y en la fila del
  // lunes se salía por arriba.

  tip.style.top = "0px";

  const alto = tip.offsetHeight;

  tip.classList.toggle("below", !cabeArriba);
  tip.style.top = (cabeArriba ? arriba : rect.bottom + alto + 14) + "px";

  $("hoverInfo").textContent =
    capitalize(date.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "short" })) + " · " + fmtMinutes(mins);
}

/* =====================================================================
   Ranking por grupos
   ---------------------------------------------------------------------
   El registro local sigue mandando: la app funciona igual sin conexión y
   sin grupo. Esto sólo añade una copia de tus minutos en Supabase para
   poder compararlos con los de tu gente. El código del grupo es la llave
   compartida; el secreto de cada miembro, guardado sólo en su
   dispositivo, es lo que impide que nadie escriba en tu nombre.
   ===================================================================== */

const SUPA = window.DEEPWORK_CONFIG || {};
const supaReady = () => !!(SUPA.SUPABASE_URL && SUPA.SUPABASE_KEY);

let group = readJSON(K.GROUP);          // { code, name, memberId, secret, nickname }
let board = null;                       // respuesta de dw_leaderboard
let boardError = null;
let boardLoading = false;
let metric = (prefs.metric === "today" || prefs.metric === "total") ? prefs.metric : "week";
let syncState = { state: "idle", at: 0, error: null };
let boardFresh = false;                 // la entrada escalonada sólo al traer datos nuevos
let pushTimer = null;
let pushing = null;      // promesa del envio en curso, o null
let pushAgain = false;

const RPC_TIMEOUT = 12000;

async function rpc(fn, args) {
  const base = String(SUPA.SUPABASE_URL).replace(/\/+$/, "");
  // Con una red que acepta la conexión y luego no contesta (típico de un
  // wifi de bar), fetch se queda esperando indefinidamente: el ranking se
  // quedaba en "Sincronizando…" para siempre y, como pushing seguía en
  // true, ningún envío posterior salía ya nunca.
  const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  const corte = ctrl ? setTimeout(() => ctrl.abort(), RPC_TIMEOUT) : null;

  let res;
  try {
    res = await fetch(base + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: SUPA.SUPABASE_KEY,
        Authorization: "Bearer " + SUPA.SUPABASE_KEY
      },
      body: JSON.stringify(args),
      signal: ctrl ? ctrl.signal : undefined
    });
  } catch (e) {
    throw new Error(e && e.name === "AbortError" ? "La conexión ha tardado demasiado" : "Sin conexión");
  } finally {
    if (corte) clearTimeout(corte);
  }

  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { /* respuesta vacía */ }
  if (!res.ok) {
    throw new Error((data && (data.message || data.hint || data.error_description)) || ("Error " + res.status));
  }
  return data;
}

function saveGroup() {
  if (group) writeJSON(K.GROUP, group);
  else localStorage.removeItem(K.GROUP);
}

/* --------------------------- enviar minutos ------------------------- */

/* Van también los días a cero. dw_push sólo hace upsert, así que si se
   omitían, vaciar un día no lo borraba del ranking: el servidor se quedaba
   con la cifra vieja para siempre y seguías apareciendo con horas que ya
   habías quitado. */
function daysPayload() {
  const out = {};
  for (const key in doc.days) {
    out[key] = Math.round(doc.days[key].m * 10) / 10;
  }
  return out;
}

function schedulePush() {
  if (!group || !supaReady()) return;
  clearTimeout(pushTimer);
  // Agrupa ráfagas de ediciones, y al terminar recarga el ranking: si no,
  // tras editar un día tu propia fila seguía mostrando la cifra anterior
  // hasta que pulsabas Actualizar a mano.
  pushTimer = setTimeout(() => {
    pushNow().then(() => { if (syncState.state === "ok") fetchBoard(true); });
  }, 2500);
}

/* Devuelve siempre la promesa del envío en curso. Antes, si ya había uno en
   vuelo, esto salía de vuelta al instante: "Actualizar" pedía el ranking sin
   esperar a que el envío llegase, pintaba datos anteriores a tus propios
   cambios y aun así anunciaba "Ranking actualizado". */
function pushNow() {
  if (!group || !supaReady()) return Promise.resolve();
  if (pushing) { pushAgain = true; return pushing; }
  clearTimeout(pushTimer);
  syncState = { state: "sending", at: syncState.at, error: null };
  renderSync();

  const quien = group.memberId;
  pushing = (async () => {
    try {
      await rpc("dw_push", {
        p_member: quien,
        p_secret: group.secret,
        p_days: daysPayload(),
        p_nickname: null
      });
      syncState = { state: "ok", at: Date.now(), error: null };
    } catch (e) {
      syncState = { state: "error", at: syncState.at, error: e.message };
    }
    pushing = null;
    renderSync();
    if (pushAgain) { pushAgain = false; schedulePush(); }
  })();

  return pushing;
}

async function fetchBoard(silent) {
  if (!group || !supaReady()) return;
  const codigo = group.code;              // el grupo puede cambiar durante la espera
  boardLoading = true;
  boardError = null;
  if (!silent) renderRanking();
  let datos = null, fallo = null;
  try {
    datos = await rpc("dw_leaderboard", { p_code: codigo, p_today: dateKey(new Date()) });
  } catch (e) {
    fallo = e.message;
  }
  boardLoading = false;
  // Si mientras tanto has salido del grupo o te has cambiado a otro, esta
  // respuesta ya no vale: antes resucitaba el ranking del grupo abandonado.
  if (!group || group.code !== codigo) { renderRanking(); return; }

  if (datos) {
    board = datos;
    boardFresh = true;
    if (datos.name && datos.name !== group.name) { group.name = datos.name; saveGroup(); }
  } else {
    boardError = fallo;
  }
  renderRanking();
}

/* Reintenta las bajas de grupo que se quedaron sin enviar. */
async function flushPendingLeaves() {
  if (!supaReady()) return;
  const cola = readJSON(K.PENDING_LEAVE);
  if (!cola || !cola.length) return;
  const quedan = [];
  for (const credenciales of cola) {
    try { await rpc("dw_leave", credenciales); }
    catch (e) { quedan.push(credenciales); }
  }
  if (quedan.length) writeJSON(K.PENDING_LEAVE, quedan);
  else localStorage.removeItem(K.PENDING_LEAVE);
}

async function syncNow(announce) {
  flushPendingLeaves();
  await pushNow();
  await fetchBoard(true);
  if (announce) toast(boardError ? "No se ha podido actualizar" : "Ranking actualizado", !!boardError);
}

/* ------------------------------ pintado ----------------------------- */

const METRICS = [
  { id: "today", label: "Hoy" },
  { id: "week",  label: "Semana" },
  { id: "total", label: "Total" }
];

function renderRanking() {
  const tools = $("rankTools");
  const body = $("rankBody");
  const title = $("rankTitle");

  if (!supaReady()) {
    title.textContent = "Ranking sin configurar";
    tools.innerHTML = "";
    body.innerHTML =
      '<div class="rank-empty">Falta conectar la base de datos.<br>' +
      "Rellena <b>config.js</b> con los datos de tu proyecto de Supabase y el ranking se activa solo.</div>";
    renderSync();
    return;
  }

  if (!group) {
    title.textContent = "Compite con tu gente";
    tools.innerHTML = "";
    body.innerHTML =
      '<div class="rank-empty">Crea un grupo y pasa el código a quien quieras.<br>' +
      "Veréis las horas de trabajo profundo de cada uno." +
      '<div class="rank-cta">' +
        '<button class="btn btn-primary" id="createGroupBtn">Crear un grupo</button>' +
        '<button class="btn btn-ghost" id="joinGroupBtn">Tengo un código</button>' +
      "</div></div>";
    wireButton($("createGroupBtn"), openCreateGroup);
    wireButton($("joinGroupBtn"), openJoinGroup);
    renderSync();
    return;
  }

  title.textContent = group.name;
  tools.innerHTML =
    '<button class="code-chip" id="codeChip" title="Copiar el código">' +
      group.code + '<span class="hint">copiar</span>' +
    "</button>" +
    '<div class="metric-tabs">' +
      METRICS.map((m) => '<button class="metric-tab' + (m.id === metric ? " on" : "") + '" data-metric="' + m.id + '">' + m.label + "</button>").join("") +
    "</div>";

  $("codeChip").onclick = copyCode;
  tools.querySelectorAll(".metric-tab").forEach((tab) => {
    tab.onclick = () => {
      metric = tab.dataset.metric;
      prefs.metric = metric;
      savePrefs();
      haptic(8);
      renderRanking();
    };
  });

  if (boardLoading && !board) {
    body.innerHTML = '<div class="rank-list">' + '<div class="skeleton"></div>'.repeat(3) + "</div>";
    renderSync();
    return;
  }

  if (boardError && !board) {
    body.innerHTML = '<div class="rank-empty">No se ha podido cargar el ranking.<br>' + boardError +
      '<div class="rank-cta"><button class="btn btn-ghost" id="retryBoard">Reintentar</button></div></div>';
    wireButton($("retryBoard"), () => fetchBoard(false));
    renderSync();
    return;
  }

  const members = (board && board.members) || [];
  const live = liveMinutes();

  // A mis propias cifras les sumo la sesión en marcha, que el servidor
  // todavía no conoce: así mi fila no se queda atrás mientras trabajo.
  const rows = members.map((m) => {
    const mine = m.member_id === group.memberId;
    return {
      mine: mine,
      nickname: m.nickname,
      today: (m.today || 0) + (mine ? live : 0),
      week: (m.week || 0) + (mine ? live : 0),
      total: (m.total || 0) + (mine ? live : 0),
      streak: m.streak || 0,
      lastDay: m.last_day || null
    };
  });

  rows.sort((a, b) => b[metric] - a[metric] || a.nickname.localeCompare(b.nickname, "es"));
  const top = rows.length ? Math.max(rows[0][metric], 1) : 1;
  const medals = ["🥇", "🥈", "🥉"];

  if (!rows.length) {
    body.innerHTML = '<div class="rank-empty">Todavía no hay nadie más.<br>Pasa el código <b>' + group.code + "</b> a quien quieras.</div>";
    renderSync();
    return;
  }

  body.innerHTML = '<div class="rank-list">' + rows.map((r, i) => {
    const value = r[metric];
    const width = clamp((value / top) * 100, 0, 100);
    // El puesto se escribe siempre en número; la medalla es adorno. Antes el
    // emoji sustituía a la cifra, y quien no lo vea (lector de pantalla, o
    // una fuente sin ese emoji) se quedaba sin saber la posición.
    const conMedalla = i < 3 && value > 0;
    const puesto = '<span aria-hidden="true">' + (conMedalla ? medals[i] : "") + "</span>" +
                   '<span class="pos-num">' + (i + 1) + "</span>";
    const sub = [];
    if (r.streak > 0) sub.push('<span aria-hidden="true">🔥</span> ' + r.streak + " día" + (r.streak === 1 ? "" : "s") + " seguido" + (r.streak === 1 ? "" : "s"));
    if (metric !== "total") sub.push("total " + fmtMinutes(r.total));
    if (!r.lastDay && !value) sub.push("sin registrar nada aún");

    const anim = boardFresh ? "animation-delay:" + Math.min(i * 45, 400) + "ms" : "animation:none";
    return '<div class="rank-row' + (r.mine ? " me" : "") + '" style="' + anim + '">' +
      '<div class="bar" aria-hidden="true" style="width:' + width + '%"></div>' +
      '<div class="rank-pos' + (conMedalla ? " medal" : "") + '">' + puesto + "</div>" +
      '<div class="rank-who">' +
        '<div class="rank-name">' + escapeHtml(r.nickname) + (r.mine ? '<span class="you">TÚ</span>' : "") + "</div>" +
        (sub.length ? '<div class="rank-sub">' + sub.join(" · ") + "</div>" : "") +
      "</div>" +
      '<div class="rank-value">' + fmtMinutes(value) + "</div>" +
    "</div>";
  }).join("") + "</div>";

  boardFresh = false;
  renderSync();
}

function renderSync() {
  const slot = $("rankSync");
  if (!supaReady() || !group) { slot.innerHTML = ""; return; }

  let dotClass = "sync-dot";
  let text;
  if (syncState.state === "sending" || boardLoading) { dotClass += " wait"; text = "Sincronizando…"; }
  else if (syncState.state === "error") { dotClass += " bad"; text = "Sin conexión · se enviará al volver"; }
  else if (syncState.at) { text = "Al día · " + new Date(syncState.at).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }); }
  else { dotClass += " wait"; text = "Pendiente de enviar"; }

  slot.innerHTML =
    '<div class="sync-line">' +
      '<span class="' + dotClass + '"></span><span>' + text + "</span>" +
      '<span class="spacer"></span>' +
      '<button class="link-btn" id="refreshBtn">Actualizar</button>' +
      '<button class="link-btn" id="renameBtn">Cambiar apodo</button>' +
      '<button class="link-btn" id="leaveBtn">Salir del grupo</button>' +
    "</div>";

  wireButton($("refreshBtn"), () => syncNow(true));
  wireButton($("renameBtn"), openRename);
  wireButton($("leaveBtn"), openLeave);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function copyCode() {
  const done = () => { haptic(10); toast("Código " + group.code + " copiado"); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(group.code).then(done, () => toast("No se ha podido copiar", true));
  } else {
    const tmp = document.createElement("input");
    tmp.value = group.code;
    document.body.appendChild(tmp);
    tmp.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("No se ha podido copiar", true); }
    tmp.remove();
  }
}

/* ------------------------------ diálogos ---------------------------- */

function showModalError(message) {
  // Si la petición falla después de cerrar el diálogo no hay dónde pintar el
  // error: antes esto reventaba con un TypeError al leer parentNode de null.
  const caja = document.querySelector(".modal");
  if (!caja) { toast(message, true); return; }

  const box = caja.querySelector(".error");
  if (box) { box.textContent = message; return; }

  const el = document.createElement("div");
  el.className = "error";
  el.setAttribute("role", "alert");
  el.textContent = message;
  const fields = caja.querySelector(".fields");
  if (fields) fields.parentNode.insertBefore(el, fields);
  else caja.insertBefore(el, caja.querySelector(".modal-actions") || null);
}

function busy(button, isBusy, label) {
  if (!button) return;
  button.disabled = isBusy;
  button.style.opacity = isBusy ? ".6" : "";
  button.textContent = isBusy ? "…" : label;
}

function openCreateGroup() {
  openModal(
    "<h2>Crear un grupo</h2>" +
    '<div class="sub">Te daremos un código para invitar a quien quieras</div>' +
    '<div class="fields">' +
      '<div><div class="field-label">Nombre del grupo</div>' +
        '<input class="text" id="gName" maxlength="40" placeholder="Los del gimnasio" /></div>' +
      '<div><div class="field-label">Tu apodo</div>' +
        '<input class="text" id="gNick" maxlength="24" placeholder="Alex" value="' + escapeHtml(prefs.nickname || "") + '" /></div>' +
    "</div>" +
    '<div class="modal-actions">' +
      '<button class="btn btn-ghost" id="gCancel">Cancelar</button>' +
      '<button class="btn btn-primary" id="gCreate">Crear</button>' +
    "</div>",
    (close) => {
      $("gName").focus();
      const submit = async () => {
        const button = $("gCreate");
        if (button.disabled) return;   // Enter repetido no dispara varios envios
        busy(button, true, "Crear");
        try {
          const data = await rpc("dw_create_group", { p_name: $("gName").value, p_nickname: $("gNick").value });
          group = { code: data.code, name: data.name, memberId: data.member_id, secret: data.secret, nickname: data.nickname };
          saveGroup();
          prefs.nickname = data.nickname;
          savePrefs();
          close();
          renderRanking();
          await syncNow(false);
          haptic([10, 40, 18]);
          toast("Grupo creado · código " + data.code);
        } catch (e) {
          busy(button, false, "Crear");
          showModalError(e.message);
        }
      };
      document.querySelectorAll(".modal input").forEach((i) =>
        i.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); }));
      wireButton($("gCancel"), close);
      wireButton($("gCreate"), submit);
    }
  );
}

      '<div><div class="field-label">Tu apodo</div>' +

      '<button class="btn btn-primary" id="gJoin">Entrar</button>' +
    "</div>",
    (close) => {
      $("gCode").focus();

        busy(button, true, "Entrar");
        try {
          const data = await rpc("dw_join_group", { p_code: $("gCode").value, p_nickname: $("gNick").value });

function openRename() {
  openModal(
    "<h2>Cambiar apodo</h2>" +
    '<div class="sub">Así te verá el resto del grupo</div>' +
    '<div class="fields">' +
      '<div><input class="text" id="gNick" maxlength="24" value="' + escapeHtml(group.nickname) + '" /></div>' +
    "</div>" +
    '<div class="modal-actions">' +
      '<button class="btn btn-ghost" id="gCancel">Cancelar</button>' +
      '<button class="btn btn-primary" id="gSave">Guardar</button>' +
    "</div>",
    (close) => {
      $("gNick").focus();
      $("gNick").select();
      const submit = async () => {
        const button = $("gSave");
        if (button.disabled) return;   // Enter repetido no dispara varios envios
        busy(button, true, "Guardar");
        try {
          await rpc("dw_push", {
            p_member: group.memberId, p_secret: group.secret,
            p_days: daysPayload(), p_nickname: $("gNick").value
          });
          group.nickname = $("gNick").value.trim();
          saveGroup();
          prefs.nickname = group.nickname;
          savePrefs();
          close();
          await fetchBoard(true);
          toast("Ahora eres " + group.nickname);
        } catch (e) {
          busy(button, false, "Guardar");
          showModalError(e.message);
        }
      };
      $("gNick").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
      wireButton($("gCancel"), close);
      wireButton($("gSave"), submit);
    }
  );
}

function openLeave() {
  openModal(
    "<h2>Salir del grupo</h2>" +
    '<div class="sub">Tu registro diario se queda intacto en este dispositivo. Lo que se borra es tu copia en el grupo, y desaparecerás del ranking de los demás.</div>' +
    '<div class="modal-actions">' +
      '<button class="btn btn-ghost" id="gCancel">Quedarme</button>' +
      '<button class="btn btn-stop" id="gLeave">Salir</button>' +
    "</div>",
    (close) => {
      wireButton($("gCancel"), close);
      wireButton($("gLeave"), async () => {
        const button = $("gLeave");
        if (button.disabled) return;
        busy(button, true, "Salir");
        const credenciales = { p_member: group.memberId, p_secret: group.secret };
        let entregado = true;
        try {
          await rpc("dw_leave", credenciales);
        } catch (e) {
          // Sin conexión salíamos igual en local y el miembro se quedaba
          // huérfano en el servidor: seguías apareciendo en el ranking de
          // los demás y tu apodo quedaba pillado para siempre. Ahora la
          // baja queda pendiente y se reintenta al recuperar la red.
          entregado = false;
          const cola = readJSON(K.PENDING_LEAVE) || [];
          cola.push(credenciales);
          writeJSON(K.PENDING_LEAVE, cola);
        }
        group = null;
        board = null;
        saveGroup();
        close();
        renderRanking();
        toast(entregado ? "Has salido del grupo" : "Fuera del grupo · la baja se enviará al recuperar la conexión", !entregado);
      });
    }
  );
}

/* ------------------------------ arranque ---------------------------- */

loadSync();
if (Object.keys(doc.days).length) persist();   // migra el formato antiguo a las claves nuevas
checkRecovery();
render();
if (session) { startTicking(); acquireWakeLock(); }
loadAsync();
requestPersistence();
renderRanking();
if (group && supaReady()) syncNow(false);

// scroll al final para que hoy quede a la vista en móvil
const wrap = $("gridWrap");
wrap.scrollLeft = wrap.scrollWidth;

// delegación de eventos en la rejilla: un único listener para 182 celdas
const rows = $("gridRows");
rows.addEventListener("click", (e) => {
  const cell = e.target.closest(".cell");
  if (cell && !cell.disabled) { haptic(8); openDayEditor(cell.dataset.key); }
});
rows.addEventListener("mouseover", (e) => {
  const cell = e.target.closest(".cell");
  if (cell && !cell.disabled) showTip(cell);
});
rows.addEventListener("mouseleave", hideTip);
rows.addEventListener("focusin", (e) => {
  const cell = e.target.closest(".cell");
  if (cell && !cell.disabled) { moverFoco(cell); showTip(cell); }
});
rows.addEventListener("focusout", hideTip);

// En táctil el tooltip se quedaba puesto hasta tocar en otro sitio.
rows.addEventListener("touchstart", hideTip, { passive: true });
$("gridWrap").addEventListener("scroll", hideTip, { passive: true });
window.addEventListener("scroll", hideTip, { passive: true });

/* Navegación por teclado de la rejilla. Antes las 182 celdas estaban todas
   en el orden de tabulación: llegar al pie de la página exigía 182 pulsaciones
   de Tab. Ahora sólo una celda es tabulable y dentro se anda con las flechas,
   que es como se recorre una cuadrícula. */
function moverFoco(cell) {
  rows.querySelectorAll('.cell[tabindex="0"]').forEach((c) => c.setAttribute("tabindex", "-1"));
  cell.setAttribute("tabindex", "0");
}

rows.addEventListener("keydown", (e) => {
  const cell = e.target.closest(".cell");
  if (!cell) return;
  const salto = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!salto && e.key !== "Home" && e.key !== "End") return;
  e.preventDefault();

  const libres = [...rows.querySelectorAll(".cell:not(.future)")];
  if (e.key === "Home") { const c = libres[0]; if (c) { moverFoco(c); c.focus(); } return; }
  if (e.key === "End") { const c = libres[libres.length - 1]; if (c) { moverFoco(c); c.focus(); } return; }

  const fila = cell.parentElement;
  const filas = [...rows.querySelectorAll(".grid-row")];
  const y = filas.indexOf(fila);
  const x = [...fila.querySelectorAll(".cell")].indexOf(cell);
  const destinoFila = filas[y + salto[1]];
  if (!destinoFila) return;
  const destino = [...destinoFila.querySelectorAll(".cell")][x + salto[0]];
  if (!destino || destino.classList.contains("future")) return;
  moverFoco(destino);
  destino.focus();
});

wireButton($("manualOpenBtn"), () => openDayEditor(dateKey(new Date())));
wireButton($("goalBtn"), openGoalEditor);
wireButton($("exportBtn"), exportData);
wireButton($("importBtn"), () => $("importFile").click());
$("importFile").addEventListener("change", (e) => {
  if (e.target.files && e.target.files[0]) importData(e.target.files[0]);
  e.target.value = "";
});

// atajo de teclado: S para empezar o terminar
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // Con un diálogo abierto el atajo no manda: antes, escribir un apodo con
  // ese sonido arrancaba o paraba la sesión sin que se viera.
  if (closeModal) return;
  const activo = document.activeElement;
  if (activo && /^(INPUT|TEXTAREA|SELECT)$/.test(activo.tagName)) return;
  if (activo && activo.isContentEditable) return;
  if (e.key === "s" || e.key === "S") {
    e.preventDefault();
    session ? stopSession() : startSession();
  }
});

// otra pestaña ha guardado: nos ponemos al día sin recargar
window.addEventListener("storage", (e) => {
  if (e.key !== K.LOG && e.key !== K.SESSION) return;
  loadSync();
  render();
  if (session && !tickHandle) startTicking();
  if (!session) stopTicking();
});

// al volver a la app: recalcular, recuperar el bloqueo de pantalla y guardar
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  lastTodayKey = dateKey(new Date());
  checkRecovery();
  render();
  if (session) acquireWakeLock();
  // al volver a la app, refresca el ranking si lleva más de un minuto parado
  if (group && supaReady() && Date.now() - syncState.at > 60000) syncNow(false);
});

// se recupera la conexión: enviamos lo que quedó pendiente
window.addEventListener("online", () => { if (group && supaReady()) syncNow(false); });

// última red de seguridad: la sesión abierta queda anotada al salir
window.addEventListener("pagehide", () => {
  if (session) writeJSON(K.SESSION, session);
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
