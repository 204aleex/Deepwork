<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Deep Work</title>
<meta name="description" content="Registro diario de sesiones de trabajo profundo." />
<meta name="theme-color" content="#1c1c25" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Deep Work" />
<link rel="manifest" href="manifest.json" />
<!-- El SVG es el que usa la pestaña: es vectorial y sale nítido a 16 px.
     El PNG queda de reserva para iOS, que no admite favicons en SVG. -->
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<!-- Tipografía del contador. Sólo la gasta la cifra grande y las tres
     cifras de debajo: el resto de la interfaz sigue con la del sistema,
     que a tamaño pequeño se lee mejor y no cuesta una descarga. Si la red
     falla, cae al redondeado del sistema y no se rompe nada. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" />
<style>
  :root {
    /* Paleta. Antes el fondo era casi negro (#020203) y los grises pequeños
       se perdían: --dim sobre la tarjeta daba 2,96:1, por debajo del 4,5:1
       que pide WCAG AA. Ahora las superficies son gris pizarra y los grises
       de texto están subidos hasta pasar el umbral:
         --dim    sobre --card → 5,4:1
         --muted  sobre --card → 7,5:1
         --accent sobre --card → 5,5:1  (4,9 sobre tu propia fila,
                                         que lleva un velo azul encima) */
    --bg: #1c1c25;
    --card: #262631;
    --panel: #2e2e3c;
    --panel-2: #383846;
    --raised: #424252;
    --line: rgba(255,255,255,.10);
    --line-2: rgba(255,255,255,.18);
    --text: #f6f6fa;
    --muted: #b6b6c6;
    --dim: #9a9aac;
    --accent: #7d97ff;
    /* Solo para etiquetas pequeñas sobre un velo del propio acento, donde
       --accent se queda corto de contraste. */
    --accent-soft: #93a9ff;
    --accent-deep: #3f59dd;
    --good: #3ddc97;
    --veil: rgba(14,14,20,.72);
    /* Las aletas del reloj van mas oscuras que la tarjeta: es lo que las
       separa del fondo sin necesidad de borde. */
    --flip-bg: #15151c;
    /* Escala de la rejilla. Es la única fuente: la leyenda y el JS la leen
       de aquí, para que no haya que cambiar el color en tres sitios. */
    --l0: #3a3a4a;
    --l1: #31469b;
    --l2: #4160c6;
    --l3: #5e7ae8;
    --l4: #8aa2ff;
    /* Geométrica y de terminaciones redondas, con cifras de ancho fijo:
       a 100px el contador no baila al pasar los segundos. Las alternativas
       del sistema van detrás por si no llega la descarga. */
    --font-dial: "Outfit", ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", system-ui, sans-serif;
    --ease: cubic-bezier(.22,1,.36,1);
    --spring: cubic-bezier(.34,1.4,.64,1);
    --cell: 16px;
    --cell-gap: 4px;
  }

  * { box-sizing: border-box; }

  html, body { overscroll-behavior-y: none; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  /* resplandor de fondo: sutil en reposo, respira durante la sesion */
  body::before {
    content: "";
    position: fixed;
    inset: -30vh -30vw auto;
    height: 70vh;
    background: radial-gradient(50% 50% at 50% 50%, rgba(91,124,255,.13), transparent 70%);
    opacity: .5;
    transition: opacity .8s var(--ease);
    pointer-events: none;
    z-index: 0;
  }
  body.running::before { animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .7; } 50% { opacity: 1.1; } }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;   /* en el movil la barra del navegador se retrae */
    display: flex;
    /* Sin centrado vertical: ahora el contenido es alto y centrarlo sólo
       servía para dejar la primera pantalla a medias. */
    align-items: flex-start;
    justify-content: center;
    /* Zona segura por los cuatro lados. Antes solo estaba la de abajo, y
       como la app declara viewport-fit=cover con la barra de estado
       translucida, en un iPhone con muesca la cabecera quedaba tapada por
       el reloj, y en horizontal la muesca se comia la columna de dias. */
    padding: calc(20px + env(safe-area-inset-top))
             calc(12px + env(safe-area-inset-right))
             calc(24px + env(safe-area-inset-bottom))
             calc(12px + env(safe-area-inset-left));
  }

  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 22px 20px 18px;
    width: 100%;
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 24px 70px rgba(0,0,0,.6);
    animation: cardIn .5s var(--ease) both;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.99); } }

  .eyebrow { font-size: 11px; letter-spacing: .14em; color: var(--accent); font-weight: 700; margin-bottom: 4px; }

  /* ---------- barra superior ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 0 4px 2px;
  }
  .topbar-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .acct-chip {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--card); border: 1px solid var(--line-2);
    border-radius: 99px; padding: 7px 12px; min-height: 36px;
    color: var(--muted); font-family: inherit; font-size: 12.5px; font-weight: 600;
    cursor: pointer; flex-shrink: 0; touch-action: manipulation;
    transition: transform .18s var(--spring), border-color .2s, color .2s;
  }
  .acct-chip:active { transform: scale(.96); }
  .acct-chip.dentro { color: var(--text); border-color: rgba(91,124,255,.35); }
  .acct-chip .avatar {
    width: 20px; height: 20px; border-radius: 99px; flex-shrink: 0;
    display: grid; place-items: center;
    background: var(--accent-deep); color: #fff; font-size: 11px; font-weight: 700;
  }
  .brand { font-size: 11px; letter-spacing: .16em; color: var(--accent); font-weight: 700; }
  .group-chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); border: 1px solid var(--line-2);
    border-radius: 99px; padding: 7px 13px; min-height: 36px;
    color: var(--text); font-family: inherit; font-size: 12.5px; font-weight: 600;
    cursor: pointer; max-width: 62vw; min-width: 0; touch-action: manipulation;
    transition: transform .18s var(--spring), border-color .2s, background .2s;
  }
  .group-chip:active { transform: scale(.96); }
  .group-chip .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .group-chip .chip-tag {
    font-size: 9px; letter-spacing: .08em; font-weight: 700;
    background: rgba(125,151,255,.16); color: var(--accent-soft);
    border-radius: 5px; padding: 2px 5px; flex-shrink: 0;
  }
  .group-chip .chip-live {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--good); font-weight: 600; flex-shrink: 0;
  }

  /* ---------- el escenario: anillo + cifra ---------- */
  .stage {
    display: flex; flex-direction: column; align-items: center;
    gap: 18px; padding: 26px 20px 20px;
    transition: border-color .5s var(--ease), box-shadow .5s var(--ease);
  }
  body.running .stage {
    border-color: rgba(91,124,255,.32);
    box-shadow: 0 0 0 1px rgba(91,124,255,.08), 0 14px 50px rgba(54,81,212,.16);
  }

  .dial-wrap {
    position: relative;
    width: clamp(232px, 74vw, 320px);
    aspect-ratio: 1;
    display: grid; place-items: center;
  }
  .dial { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .dial-track, .dial-arc {
    fill: none; stroke-width: 9; stroke-linecap: round;
  }
  .dial-track { stroke: var(--l0); }
  /* Anillo en SVG y no en conic-gradient: @property no existe en Safari
     anterior al 16.4 ni en Firefox anterior al 128, y sin @property el
     conic-gradient no se puede animar. stroke-dashoffset anima en todas
     partes y escala solo con el viewBox. */
  .dial-arc {
    stroke: var(--accent);
    stroke-dasharray: 552.92;            /* 2·π·88 */
    stroke-dashoffset: 552.92;
    transition: stroke-dashoffset .8s var(--ease), stroke .45s var(--ease);
  }
  .dial-arc.done { stroke: var(--good); }
  body.running .dial-wrap::after {
    content: ""; position: absolute; inset: 6%;
    border-radius: 50%; pointer-events: none;
    box-shadow: 0 0 60px rgba(91,124,255,.30);
    animation: halo 5.5s ease-in-out infinite;
  }
  @keyframes halo { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

  .dial-face {
    position: relative; z-index: 1; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    /* El reloj de aletas ocupa mucho mas ancho que la cifra suelta que
       habia antes; el hueco lateral baja de un 16% a un 8%. */
    padding: 0 8%;
    width: 100%;
  }
  .dial-state {
    font-size: 10.5px; letter-spacing: .16em; font-weight: 700;
    color: var(--dim); transition: color .4s var(--ease);
  }
  body.running .dial-state { color: var(--accent); }
  /* ---------- reloj de aletas ----------
     Seis aletas (horas, minutos, segundos) y dos separadores. Cada aleta
     son cuatro capas: las dos mitades quietas que se ven en reposo y dos
     hojas que solo aparecen durante el giro — la de arriba cae con el
     digito viejo y la de abajo sube con el nuevo. Es el mecanismo de un
     reloj de aletas de verdad; una sola pieza girando no engaña a nadie.

     Todo se mide en cqw, o sea en porcentaje del ancho de la fila: asi el
     reloj entra igual en los 245px que quedan dentro del anillo de un
     movil que en los 636 de un monitor, sin una sola medida a mano. */
  .flip-reloj {
    container-type: inline-size;
    display: flex; align-items: center; justify-content: center;
    width: 100%; gap: 1.2cqw;
    opacity: .78; transition: opacity .4s var(--ease);
  }
  body.running .flip-reloj { opacity: 1; }

  .flip {
    position: relative;
    flex: 1 1 0; min-width: 0;
    aspect-ratio: .74;
    border-radius: 1.7cqw;
    perspective: 42cqw;
    font-family: var(--font-dial);
    font-size: 13.5cqw; font-weight: 500; line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    box-shadow: 0 .4cqw 1.6cqw rgba(0,0,0,.4);
  }

  .flip-mitad, .flip-hoja {
    position: absolute; left: 0; right: 0; height: 50%;
    overflow: hidden; background: var(--flip-bg);
    backface-visibility: hidden;
  }
  /* El glifo mide el alto entero de la aleta y cada mitad recorta la suya:
     asi las dos partes del numero encajan al milimetro. */
  .flip-mitad > span, .flip-hoja > span {
    position: absolute; left: 0; right: 0; height: 200%;
    display: flex; align-items: center; justify-content: center;
  }
  .f-arr { top: 0; border-radius: 1.7cqw 1.7cqw 0 0; }
  .f-aba { bottom: 0; border-radius: 0 0 1.7cqw 1.7cqw; }
  .f-arr > span { top: 0; }
  .f-aba > span { bottom: 0; }

  .flip-hoja { z-index: 2; display: none; }
  .flip.girando .flip-hoja { display: block; }
  .flip-hoja.f-arr { transform-origin: bottom; animation: hojaCae .26s cubic-bezier(.45,.05,.75,.9) forwards; }
  .flip-hoja.f-aba { transform-origin: top; transform: rotateX(90deg);
                     animation: hojaSube .28s cubic-bezier(.3,.5,.5,1) .26s forwards; }
  @keyframes hojaCae  { to { transform: rotateX(-90deg); } }
  @keyframes hojaSube { from { transform: rotateX(90deg); } to { transform: rotateX(0deg); } }

  /* La raja del medio va por encima de las hojas: en un reloj de verdad
     es una ranura, no una junta que se mueva. */
  .flip::after {
    content: ""; position: absolute; left: 0; right: 0;
    top: calc(50% - .18cqw); height: .36cqw; min-height: 1px;
    background: rgba(0,0,0,.5); z-index: 3; pointer-events: none;
  }

  .flip-dosp {
    flex: 0 0 3.2cqw;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4.6cqw;
  }
  .flip-dosp i { width: 1.5cqw; height: 1.5cqw; min-width: 2px; min-height: 2px;
                 border-radius: 99px; background: var(--dim); }
  .dial-goal {
    font-size: 12px; color: var(--dim);
    font-variant-numeric: tabular-nums; line-height: 1.35;
    background: none; border: none; font-family: inherit;
    padding: 6px 10px; margin: -4px 0; border-radius: 8px;
    cursor: pointer; touch-action: manipulation;
    transition: color .2s var(--ease), background .2s var(--ease);
  }
  .dial-goal { position: relative; }
  /* La zona sensible llega a 44px sin mover nada: el texto vive dentro del
     anillo y agrandarlo de verdad descuadraria el centro. */
  .dial-goal::after { content: ""; position: absolute; inset: -8px -4px; }
  .dial-goal:active { transform: scale(.97); }
  .dial-goal:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stage-actions { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  .stage-actions .btn { flex: 1; min-height: 50px; font-size: 14px; }
  /* Pausar y Terminar se reparten por igual: durante una sesión pausar es
     tan probable como terminar, y así los dos estados del escenario tienen
     la misma forma. */

  .mini-stats { display: flex; gap: 10px; width: 100%; max-width: 340px; }
  .mini {
    flex: 1; min-width: 0; text-align: center;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px 6px;
    transition: transform .35s var(--spring), border-color .35s var(--ease);
  }
  .mini.bump { transform: translateY(-3px); border-color: rgba(91,124,255,.45); }
  /* Las tres cifras de debajo comparten la voz del contador: son el mismo
     dato a otra escala, y con dos tipografías distintas parecían de dos
     pantallas distintas. */
  .mini-value {
    font-family: var(--font-dial);
    font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
  }
  .mini-label { font-size: 10px; color: var(--dim); margin-top: 2px; }

  .stage-extra { margin-top: -4px; min-height: 34px; display: flex; align-items: center; }

  /* En pausa: el anillo se apaga a medias y la cifra se queda legible.
     El estado se ve por la forma del boton y por el rotulo, no sólo por
     el color, que es lo mismo que se hizo con los puntos de presencia. */
  body.paused .stage {
    border-color: rgba(173,173,189,.24);
    box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 10px 40px rgba(0,0,0,.28);
  }
  body.paused .flip-reloj { opacity: .72; }
  body.paused .dial-state { color: var(--muted); }
  /* :not(.done) para no pisar el verde del objetivo cumplido, que tiene
     la misma especificidad y perdía por ir antes en el fichero. */
  body.paused .dial-arc:not(.done) { stroke: var(--muted); }
  body.paused .dial-arc { opacity: .55; }
  body.paused .dial-wrap::after { content: none; }

  /* ---------- calendario plegable ----------
     Era un <details>. Ahora es una seccion normal con un boton, porque en
     el escritorio el calendario es una columna fija y tiene que estar
     siempre abierto: el contenido de un <details> cerrado lo esconde el
     navegador por debajo del CSS y no hay forma fiable de forzarlo desde
     una media query. */
  /* El ancho de la columna de meses del calendario vertical. Es variable
     porque el JS necesita el mismo numero para calcular cuantas semanas
     caben, y tenerlo en dos sitios distintos es como se desalinean. */
  .fold { padding: 0; display: flex; flex-direction: column; --cal-gutter: 30px; }
  .fold-head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    width: 100%; text-align: left; background: none; border: none;
    font-family: inherit; color: inherit;
    padding: 16px 20px; cursor: pointer;
    border-radius: 24px; user-select: none;
  }
  .fold-head::after {
    content: "▾"; margin-left: auto; color: var(--dim); font-size: 12px;
    transition: transform .25s var(--ease);
  }
  .fold-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .fold.cerrado .fold-head::after { transform: rotate(-90deg); }
  .fold.cerrado .fold-body { display: none; }
  .fold-title { font-size: 15px; font-weight: 650; }
  .fold-sub { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .fold-body { padding: 0 20px 18px; }

  .btn {
    position: relative; overflow: hidden;
    border: none; border-radius: 10px; padding: 10px 16px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; color: var(--text);
    touch-action: manipulation;
    transition: transform .18s var(--spring), background .2s var(--ease), border-color .2s var(--ease);
    animation: btnIn .3s var(--ease) both;
  }
  @keyframes btnIn { from { opacity: 0; transform: scale(.94); } }
  .btn:active { transform: scale(.95); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent-deep); color: #fff; }
  .btn-stop { background: #f2f2f5; color: #0c0c0e; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line-2); font-weight: 500; }

  /* onda al pulsar */
  .ripple {
    position: absolute; border-radius: 99px; transform: scale(0);
    background: rgba(255,255,255,.35); pointer-events: none;
    animation: ripple .55s var(--ease) forwards;
  }
  @keyframes ripple { to { transform: scale(2.6); opacity: 0; } }


  /* ---------- rejilla ---------- */
  .grid-wrap { overflow-x: auto; padding-bottom: 6px; }
  .scroller, .grid-wrap, #rankBody, .sheet-body {
    scrollbar-width: thin;
    scrollbar-color: var(--raised) transparent;
  }
  .grid-wrap::-webkit-scrollbar, #rankBody::-webkit-scrollbar,
  .sheet-body::-webkit-scrollbar { width: 8px; height: 6px; }
  .grid-wrap::-webkit-scrollbar-track, #rankBody::-webkit-scrollbar-track,
  .sheet-body::-webkit-scrollbar-track { background: transparent; }
  .grid-wrap::-webkit-scrollbar-thumb, #rankBody::-webkit-scrollbar-thumb,
  .sheet-body::-webkit-scrollbar-thumb { background: var(--raised); border-radius: 99px; }
  .grid-inner { display: inline-block; min-width: 100%; }

  /* ---- calendario en vertical ----
     En el escritorio el calendario ocupa una columna estrecha y alta: las
     semanas pasan a ser filas y los dias columnas, que es como se lee un
     calendario de pared. Solo cambia el reparto; las celdas, el tooltip y
     el teclado son exactamente los mismos. */
  .grid-wrap.vert {
    overflow-x: hidden; overflow-y: auto;
    padding-bottom: 0; padding-right: 6px;
    scrollbar-gutter: stable;
  }
  .grid-inner.vert { display: block; min-width: 0; }
  .grid-inner.vert .month-row {
    position: sticky; top: 0; z-index: 4;
    background: var(--card); padding-bottom: 5px; margin-bottom: 3px;
  }
  .grid-inner.vert .month-cell {
    flex: 1 1 0; width: auto; min-width: 0;
    text-align: center; font-size: 9.5px; letter-spacing: 0;
  }
  .grid-inner.vert .cell {
    flex: 1 1 0; width: auto; height: auto; aspect-ratio: 1; min-width: 0;
  }
  .grid-inner.vert .grid-row { align-items: stretch; }
  /* Aqui la etiqueta de la fila es el mes, no el dia de la semana: el dia
     ya lo dice la columna. */
  .grid-inner.vert .day-label {
    flex: 0 0 var(--cal-gutter); width: var(--cal-gutter);
    font-size: 10px; text-align: right;
    padding-right: 6px; margin-right: 0;
    position: static; background: none;
    display: flex; align-items: center; justify-content: flex-end;
  }
  .cal-gutter { flex: 0 0 var(--cal-gutter); width: var(--cal-gutter); }

  .month-row { display: flex; gap: var(--cell-gap); margin-bottom: 4px; }
  .month-cell { width: var(--cell); font-size: 10px; color: var(--dim); white-space: nowrap; }
  .grid-row { display: flex; gap: var(--cell-gap); align-items: center; margin-bottom: var(--cell-gap); }
  /* La columna de dias se queda fija al desplazar la rejilla: si no, al
     abrir la app ya desplazada hasta hoy, Lun-Dom quedaban fuera de
     pantalla y las filas no se podian identificar. */
  .day-label {
    width: 38px; font-size: 11px; color: var(--muted); flex-shrink: 0;
    position: sticky; left: 0; z-index: 3;
    background: var(--card);
    align-self: stretch; display: flex; align-items: center;
    /* el padding tapa el hueco de la rejilla; el margen negativo lo
       devuelve para que la medida de la fila no cambie */
    padding-right: var(--cell-gap);
    margin-right: calc(var(--cell-gap) * -1);
  }

  .cell {
    width: var(--cell); height: var(--cell); border-radius: 4px; flex-shrink: 0;
    cursor: pointer; padding: 0; border: 1px solid rgba(255,255,255,.03);
    background: var(--l0);
    position: relative;
    touch-action: manipulation;   /* sin esto, el doble toque hacia zoom */
    transition: transform .2s var(--spring), box-shadow .2s var(--ease), background .45s var(--ease);
    animation: cellIn .4s var(--ease) both;
  }
  /* El cuadrado se ve pequeño pero la zona sensible se agranda por debajo,
     que era el problema real: con celdas de 16px la yema tapaba cuatro a la
     vez y se editaba el dia equivocado. */
  .cell::after { content: ""; position: absolute; inset: calc(var(--cell-gap) / -2); }
  @keyframes cellIn { from { opacity: 0; transform: scale(.4); } }
  .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 4; }
  .cell.today { border: 1.5px solid rgba(255,255,255,.85); }
  .cell.future { background: transparent; border: 1px solid rgba(255,255,255,.05); cursor: default; }
  .cell.future::after { content: none; }
  .cell.pop { animation: cellPop .6s var(--spring); }
  @keyframes cellPop { 0% { transform: scale(1); } 45% { transform: scale(1.7); } 100% { transform: scale(1); } }

  /* Los efectos de raton solo donde hay raton. En una pantalla tactil el
     :hover se queda pegado tras el toque: la celda se quedaba ampliada y el
     tooltip no desaparecia hasta tocar en otro sitio. */
  @media (hover: hover) and (pointer: fine) {
    .dial-goal:hover { color: var(--muted); background: rgba(255,255,255,.05); }
    .cell:hover { transform: scale(1.32); box-shadow: 0 3px 10px rgba(0,0,0,.5); z-index: 2; }
    .cell.future:hover { transform: none; box-shadow: none; }
    .btn-primary:hover { background: #4a67e8; }
    .btn-stop:hover { background: #fff; }
    .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,.28); }
    .step-btn:hover { background: var(--raised); }
    .chip:hover { color: var(--text); border-color: var(--line-2); }
    .link-btn:hover { color: var(--text); background: rgba(255,255,255,.07); }
    .metric-tab:hover { color: var(--muted); }
    .rank-row:hover { background: rgba(255,255,255,.04); }
  }

  .legend-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; flex-wrap: wrap; gap: 8px; }
  .legend { display: flex; align-items: center; gap: 4px; }
  .legend-label { font-size: 10px; color: var(--dim); margin: 0 4px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; }
  .hover-info { font-size: 12px; color: var(--muted); min-height: 16px; }

  /* ---------- resumen inferior ---------- */
  .summary {
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--dim);
  }
  .summary b { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .summary .spacer { flex: 1; min-width: 0; }
  .link-btn {
    background: none; border: none; color: var(--dim); font-size: 11px; font-family: inherit;
    cursor: pointer; padding: 3px 7px; border-radius: 6px;
    transition: color .2s, background .2s;
  }

  /* ---------- tooltip ---------- */
  .tip {
    position: fixed; z-index: 50; pointer-events: none;
    background: var(--raised); border: 1px solid var(--line-2);
    border-radius: 8px; padding: 6px 9px; font-size: 11.5px; color: var(--text);
    white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.55);
    opacity: 0; transform: translate(-50%, -4px);
    transition: opacity .15s var(--ease), transform .15s var(--ease);
  }
  .tip.show { opacity: 1; transform: translate(-50%, -10px); }
  /* cuando no cabe encima de la celda, se coloca debajo */
  .tip.below { transform: translate(-50%, 4px); }
  .tip.below.show { transform: translate(-50%, 10px); }
  .tip small { color: var(--dim); }

  /* ---------- modal ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 90;   /* por encima de la hoja: se abre desde ella */
    background: var(--veil); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn .2s var(--ease);
    /* El teclado del movil encoge la pantalla visible pero no este fondo
       fijo, asi que el modal quedaba centrado en la pantalla completa y los
       botones Guardar/Cancelar caian debajo del teclado, sin manera de
       alcanzarlos. Con scroll propio y altura maxima en dvh, el modal
       siempre se puede desplazar hasta los botones. */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: calc(16px + env(safe-area-inset-top))
             calc(16px + env(safe-area-inset-right))
             calc(16px + env(safe-area-inset-bottom))
             calc(16px + env(safe-area-inset-left));
  }
  .backdrop.closing { animation: fadeOut .18s var(--ease) forwards; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }

  .modal {
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 20px; padding: 22px; width: 100%; max-width: 340px;
    box-shadow: 0 30px 80px rgba(0,0,0,.7);
    animation: modalIn .32s var(--spring) both;
    margin: auto;                 /* centrado sin romper el scroll del fondo */
    max-height: none;
  }
  .backdrop.closing .modal { animation: modalOut .18s var(--ease) forwards; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(16px) scale(.95); } }
  @keyframes modalOut { to { opacity: 0; transform: translateY(8px) scale(.97); } }

  .modal h2 { margin: 0 0 2px; font-size: 16px; font-weight: 650; }
  .modal .sub { font-size: 12px; color: var(--dim); margin-bottom: 16px; }

  .stepper { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .step-btn {
    width: 46px; height: 46px; flex-shrink: 0;
    border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-2);
    color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; touch-action: manipulation;
    transition: transform .18s var(--spring), background .2s;
  }
  .step-btn:active { transform: scale(.9); }

  input {
    background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 10px;
    padding: 12px; color: var(--text); font-family: inherit;
    outline: none; width: 100%; min-width: 0;
    font-variant-numeric: tabular-nums;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
    /* 16px es obligatorio: por debajo, Safari en iOS amplia la pagina al
       enfocar el campo y el modal se sale de la pantalla, sin volver solo
       al cerrarlo. Antes estaba en 15px. */
    font-size: 16px;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,124,255,.16); }
  input[type=number] { text-align: center; -moz-appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 99px; padding: 6px 11px; font-size: 11.5px; cursor: pointer;
    font-family: inherit; touch-action: manipulation;
    transition: transform .18s var(--spring), background .2s, color .2s, border-color .2s;
  }
  .chip:active { transform: scale(.93); }

  .modal-actions { display: flex; gap: 8px; }
  .modal-actions .btn { flex: 1; padding: 12px; }

  /* ---------- aviso de sesion recuperada ---------- */
  .notice {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: rgba(91,124,255,.08); border: 1px solid rgba(91,124,255,.25);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 16px;
    font-size: 12.5px; color: #c9d2ff;
    animation: cardIn .35s var(--ease) both;
  }
  .notice .spacer { flex: 1; min-width: 8px; }

  /* ---------- toast ---------- */
  .toast-wrap {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 100;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none;
  }
  .toast {
    background: var(--raised); border: 1px solid var(--line-2); color: var(--text);
    border-radius: 12px; padding: 10px 16px; font-size: 13px;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
    animation: toastIn .38s var(--spring) both;
    display: flex; align-items: center; gap: 8px;
  }
  .toast.out { animation: toastOut .28s var(--ease) forwards; }
  .toast .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--good); flex-shrink: 0; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(18px) scale(.94); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(10px) scale(.97); } }

  /* ---------- hoja de grupos ----------
     Descubrir es hojear: hace falta alto y scroll, no un modal de 340px. */
  .sheet-back {
    position: fixed; inset: 0; z-index: 60;
    background: var(--veil); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: flex; align-items: flex-end; justify-content: center;
    animation: fadeIn .2s var(--ease);
  }
  .sheet-back.closing { animation: fadeOut .18s var(--ease) forwards; }
  .sheet {
    background: var(--card); border: 1px solid var(--line-2);
    border-radius: 24px 24px 0 0;
    width: 100%; max-width: 560px;
    max-height: 92dvh; display: flex; flex-direction: column;
    animation: sheetIn .34s var(--spring) both;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet-back.closing .sheet { animation: sheetOut .2s var(--ease) forwards; }
  @keyframes sheetIn { from { transform: translateY(30px); opacity: 0; } }
  @keyframes sheetOut { to { transform: translateY(20px); opacity: 0; } }
  @media (min-width: 600px) {
    .sheet-back { align-items: center; }
    .sheet { border-radius: 22px; max-height: 84dvh; }
  }

  .sheet-head {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 20px 12px; border-bottom: 1px solid var(--line);
  }
  .sheet-head h2 { margin: 0; font-size: 17px; font-weight: 650; flex: 1; }
  .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 20px 6px; flex: 1; }
  .sheet-foot {
    display: flex; gap: 8px; padding: 12px 20px 18px;
    border-top: 1px solid var(--line);
  }
  .sheet-foot .btn { flex: 1; min-height: 46px; }

  .glist { display: flex; flex-direction: column; gap: 8px; }
  .gcard {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 13px 14px;
    animation: rowIn .38s var(--ease) both;
  }
  .gcard-who { flex: 1; min-width: 0; }
  .gcard-name {
    font-size: 14.5px; font-weight: 650;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .gcard-sub { font-size: 11.5px; color: var(--dim); margin-top: 3px; }
  .gcard-sub .viva { color: var(--good); font-weight: 600; }
  .gcard .btn { min-height: 40px; padding: 9px 16px; flex-shrink: 0; }
  .gcard.actual { border-color: rgba(91,124,255,.3); background: rgba(91,124,255,.07); }

  .sheet-empty { text-align: center; color: var(--dim); font-size: 13px; padding: 26px 10px; line-height: 1.6; }

  .switch-row {
    display: flex; align-items: flex-start; gap: 11px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 13px; margin-bottom: 14px;
    cursor: pointer;
  }
  /* 22px y dentro de un <label>: a 12px no había quien las tocara con el
     dedo, y sin etiqueta asociada el lector de pantalla no decía qué eran. */
  .switch-row input {
    width: 22px; height: 22px; margin: 0; flex-shrink: 0;
    accent-color: var(--accent); cursor: pointer;
  }
  .switch-row:focus-within { border-color: var(--accent); }
  .switch-text { font-size: 12.5px; line-height: 1.5; }
  .switch-text b { display: block; font-size: 13px; margin-bottom: 2px; font-weight: 650; }
  .switch-text span { color: var(--dim); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ---------- ranking ---------- */
  .stack { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 1020px; }

  .rank-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
  }
  .rank-head h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
  .rank-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }


  /* ---------- pestañas Gente / Ranking ---------- */
  .view-tabs { display: flex; gap: 4px; background: var(--panel); border-radius: 10px; padding: 3px; }
  .view-tab {
    border: none; background: transparent; color: var(--dim);
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    padding: 8px 14px; min-height: 38px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: color .2s var(--ease), background .3s var(--ease);
  }
  .view-tab.on { background: var(--panel-2); color: var(--text); }
  .view-tab .badge {
    font-size: 10px; font-weight: 700; border-radius: 5px; padding: 2px 5px;
    background: rgba(61,220,151,.16); color: var(--good);
  }

  /* ---------- tabla de gente ---------- */
  .people { display: flex; flex-direction: column; gap: 2px; }
  .person {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 12px; border-radius: 12px;
    border: 1px solid transparent;
    content-visibility: auto; contain-intrinsic-size: auto 58px;
    transition: background .25s var(--ease), border-color .25s var(--ease);
  }
  .person.me { background: rgba(91,124,255,.09); border-color: rgba(91,124,255,.26); }
  .people.denso .person { padding: 7px 12px; }
  .people.holgado .person { padding: 14px 12px; }

  .mono {
    width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: #fff;
    background: var(--l2);
  }
  .people.denso .mono { width: 26px; height: 26px; font-size: 11px; border-radius: 8px; }

  /* Cuatro estados con FORMA distinta, no sólo color: cuatro tonos de
     verde no los distingue nadie, y menos un 8 % de los hombres. El texto
     de al lado dice siempre lo mismo que el punto. */
  .dot-state { width: 9px; height: 9px; border-radius: 99px; flex-shrink: 0; }
  .dot-state.sesion { background: var(--good); animation: latir 2s ease-in-out infinite; }
  .dot-state.dormido { background: transparent; border: 2px solid var(--good); }
  .dot-state.linea { background: var(--good); opacity: .45; }
  .dot-state.fuera { background: var(--dim); opacity: .5; }
  .dot-state.oculto { background: transparent; border: 1px dashed var(--dim); }
  @keyframes latir {
    0%, 100% { box-shadow: 0 0 0 0 rgba(61,220,151,.55); }
    50% { box-shadow: 0 0 0 6px rgba(61,220,151,0); }
  }

  .person-who { flex: 1; min-width: 0; }
  .person-name {
    font-size: 14px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* La corona del dueño del grupo. Lleva title y un texto sólo para
     lectores de pantalla: un emoji suelto no dice nada a quien no lo ve. */
  .corona {
    font-size: 12px; margin-left: 5px; vertical-align: 1px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
  }
  .person-name .you {
    font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--accent);
    margin-left: 6px; vertical-align: 1px;
  }
  .person-sub {
    font-size: 11.5px; color: var(--dim); margin-top: 2px;
    display: flex; align-items: center; gap: 6px;
  }
  .person-sub.viva { color: var(--good); }
  .people.denso .person-sub { display: none; }
  .person-value {
    font-family: "SF Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums;
    flex-shrink: 0; text-align: right; color: var(--muted);
  }
  .person.me .person-value { color: var(--accent); }
  .people.denso .person-value { font-size: 12.5px; }

  /* ---------- tarjeta de cuenta y grupos ----------
     Antes esto vivia repartido entre dos chips diminutos de la barra de
     arriba y el pie del ranking. En el escritorio hay sitio de sobra para
     enseñarlo con su nombre y una linea que diga para que sirve. */
  .soc-row { display: flex; align-items: center; gap: 11px; padding: 12px 0; }
  .soc-row + .soc-row { border-top: 1px solid var(--line); }
  .soc-who { flex: 1; min-width: 0; }
  .soc-name {
    font-size: 14px; font-weight: 650;
    display: flex; align-items: center; gap: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .soc-sub { font-size: 11.5px; color: var(--dim); margin-top: 3px; line-height: 1.45; }
  .soc-sub b { color: var(--muted); font-weight: 650; }
  .soc-row .btn { flex-shrink: 0; min-height: 38px; padding: 9px 14px; }
  .soc-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .soc-acts .btn { flex: 1; min-width: 92px; min-height: 40px; }
  .tag {
    font-size: 9.5px; font-weight: 700; letter-spacing: .08em;
    color: var(--accent-soft); background: rgba(125,151,255,.14);
    border-radius: 5px; padding: 2px 5px; flex-shrink: 0;
  }

  /* Un grupo de una persona deja media tarjeta en blanco, y lo que hace
     falta ahi no es relleno: es el codigo para que entre alguien. */
  .invitar {
    margin: auto 0 4px; padding: clamp(16px, 1.6vw, 24px) 16px;
    text-align: center; border-radius: 16px;
    border: 1px dashed var(--line-2); background: rgba(255,255,255,.02);
    animation: cardIn .5s var(--ease) both;
  }
  .invitar-titulo { font-size: 13.5px; font-weight: 650; }
  .invitar-sub { font-size: 12px; color: var(--dim); margin-top: 5px; line-height: 1.5; }
  .invitar-codigo {
    font-family: var(--font-dial);
    font-size: clamp(26px, 2.2vw, 40px); font-weight: 500;
    letter-spacing: .16em; text-indent: .16em;
    color: var(--text); margin: 14px 0 12px;
  }

  .stale-note {
    font-size: 11px; color: var(--dim); text-align: center;
    padding: 8px 0 2px;
  }

  .people-filter { margin-bottom: 8px; }
  .people-filter input { font-size: 14px; padding: 9px 12px; }

  .metric-tabs { display: flex; gap: 4px; background: var(--panel); border-radius: 10px; padding: 3px; }
  .metric-tab {
    border: none; background: transparent; color: var(--dim);
    font-family: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
    transition: color .2s var(--ease), background .3s var(--ease);
  }
  .metric-tab.on { background: var(--panel-2); color: var(--text); }

  .rank-list { display: flex; flex-direction: column; gap: 2px; }

  .rank-row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; border-radius: 12px;
    position: relative; overflow: hidden;
    border: 1px solid transparent;
    transition: background .25s var(--ease), border-color .25s var(--ease);
    animation: rowIn .42s var(--ease) both;
  }
  @keyframes rowIn { from { opacity: 0; transform: translateY(8px); } }
  .rank-row.me { background: rgba(91,124,255,.09); border-color: rgba(91,124,255,.26); }

  /* barra proporcional al mejor del grupo */
  .rank-row .bar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: linear-gradient(90deg, rgba(54,81,212,.30), rgba(91,124,255,.06));
    transition: width .8s var(--ease);
    z-index: 0;
  }
  .rank-row > *:not(.bar) { position: relative; z-index: 1; }

  .rank-pos {
    width: 26px; flex-shrink: 0; text-align: center;
    font-family: "SF Mono", ui-monospace, monospace; font-size: 13px;
    font-variant-numeric: tabular-nums; color: var(--dim); font-weight: 600;
    display: flex; flex-direction: column; align-items: center; line-height: 1.1;
  }
  .rank-pos.medal { font-size: 15px; }
  .rank-pos.medal .pos-num { font-size: 9px; opacity: .75; }

  .rank-who { flex: 1; min-width: 0; }
  .rank-name {
    font-size: 14px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rank-name .you {
    font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--accent);
    margin-left: 6px; vertical-align: 1px;
  }
  .rank-sub {
    font-size: 11px; color: var(--dim); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* El verde de "esta trabajando ahora" es el mismo en las dos pestañas:
     si el estado se pinta distinto segun donde mires, deja de leerse. */
  .rank-sub.viva { color: var(--good); }

  .rank-value {
    font-family: "SF Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
    flex-shrink: 0; text-align: right;
  }
  .rank-row.me .rank-value { color: var(--accent); }

  .sync-line {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--dim);
  }
  .sync-line .spacer { flex: 1; min-width: 0; }
  .sync-dot { width: 6px; height: 6px; border-radius: 99px; background: var(--good); flex-shrink: 0; }
  .sync-dot.bad { background: #ff6b6b; }
  .sync-dot.wait { background: var(--dim); animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .rank-empty { text-align: center; padding: 22px 10px 6px; color: var(--dim); font-size: 13px; line-height: 1.6; }
  .rank-cta { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

  .skeleton { background: var(--l0); border-radius: 12px; height: 46px; margin-bottom: 2px; animation: blink 1.4s ease-in-out infinite; }

  .field-label { font-size: 11px; color: var(--dim); margin: 0 0 6px; }
  .o-bien {
    display: flex; align-items: center; gap: 10px;
    margin: 4px 0 12px; color: var(--dim); font-size: 11px;
  }
  .o-bien::before, .o-bien::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  .modal input.text { text-align: left; }
  .modal input.code {
    text-align: center; letter-spacing: .3em; text-transform: uppercase;
    font-family: "SF Mono", ui-monospace, monospace; font-size: 18px;
  }
  .modal .error {
    font-size: 12px; color: #ff9b9b; background: rgba(255,107,107,.1);
    border: 1px solid rgba(255,107,107,.25); border-radius: 10px;
    padding: 9px 11px; margin-bottom: 14px;
    animation: cardIn .3s var(--ease) both;
  }
  .modal .fields { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }

  /* ===================== escritorio: tres columnas =====================
     El reparto sale de la maqueta: el calendario alto a la izquierda, el
     reloj cuadrado en el centro y, a la derecha, el ranking arriba y la
     cuenta y los grupos abajo. Todo cabe en una pantalla; lo que puede
     crecer sin limite —la lista de gente, las semanas del calendario— hace
     scroll dentro de su tarjeta, nunca en la pagina.

     El limite de alto evita que en una ventana baja se apriete todo: por
     debajo de 720px vuelve la columna unica de siempre. */
  @media (min-width: 1120px) and (min-height: 720px) {
    /* Margen igual por los cuatro lados y nada de anchos fijos: el bloque
       crece con la pantalla en vez de quedarse en una isla de 1460px con
       trescientos pixeles muertos a cada lado. El tope de 1880px es para
       que en un monitor ultrapanoramico las tres columnas no queden a
       metros unas de otras. */
    .page { align-items: center; padding: 24px; }

    .stack {
      max-width: 1880px;
      height: calc(100dvh - 48px);
      display: grid;
      /* Las laterales crecen con el ancho pero con techo: pasado cierto
         punto, ensancharlas solo estira el texto. Lo que sobra va al
         centro, que es lo que se mira. */
      /* Los dos huecos van en variables porque entran en la cuenta del
         lado del cuadrado: si se escriben dos veces, se descuadra. */
      --hueco-col: clamp(16px, 1.3vw, 26px);
      --hueco-fila: 14px;

      /* El lado del cuadrado es el menor de tres cosas:
           - el alto de la fila de contenido, que es todo el alto de la
             pagina menos su margen y el hueco de la fila del aviso. Al
             coincidir con el alto de la fila, el reloj queda a la misma
             altura que las tarjetas de los lados en vez de un poco mas
             bajo;
           - un tope de 1100px, para que en un monitor de 1440p no se coma
             la banda entera;
           - lo que queda de ancho tras reservar 300px para cada columna
             lateral, que es lo que impide que en una pantalla estrecha
             empuje a los lados fuera de la ventana. */
      --lado: min(
        calc(100dvh - 48px - var(--hueco-fila)),
        1100px,
        calc(100vw - 50px - 2 * var(--hueco-col) - 600px)
      );
      /* Laterales iguales: es lo unico que deja el cuadrado en el centro
         exacto de la pantalla. */
      grid-template-columns: minmax(300px, 1fr) var(--lado) minmax(300px, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      column-gap: var(--hueco-col);
      row-gap: var(--hueco-fila);
    }

    /* Radios mas generosos con las tarjetas mas grandes: una esquina de
       24px en una tarjeta de 900px se ve casi recta. */
    .card { border-radius: clamp(24px, 1.9vw, 34px); }
    .btn  { border-radius: 14px; }

    /* La barra de arriba entera sobra en el escritorio: los dos chips
       tienen su propia tarjeta a la derecha, con los mismos botones y
       sitio para explicarlos, y el nombre de la app ya esta en la
       pestaña del navegador. Lo que se gana son 45px de alto para el
       cuadrado del reloj. */
    .topbar { display: none; }
    #noticeSlot { grid-column: 1 / -1; grid-row: 1; }

    /* --- izquierda: el calendario, de arriba abajo --- */
    #historyFold {
      grid-column: 1; grid-row: 2 / span 2;
      min-height: 0; overflow: hidden;
      --cell: 24px; --cell-gap: 5px; --cal-gutter: 36px;
    }
    #historyFold .fold-head { padding: clamp(16px, 1.5vw, 22px) clamp(18px, 1.6vw, 26px) 12px; }
    #historyFold .fold-body { min-height: 0; flex: 1; display: flex; flex-direction: column;
                              padding: 0 clamp(18px, 1.6vw, 26px) clamp(16px, 1.4vw, 22px); }
    #historyFold .grid-wrap { flex: 1; min-height: 0; }
    /* Aqui no se pliega: es la columna, no un desplegable. */
    #historyFold .fold-head { cursor: default; }
    #historyFold .fold-head::after { content: none; }
    #historyFold .fold-title { font-size: clamp(15px, 1.15vw, 19px); }
    #historyFold .fold-sub { font-size: clamp(11.5px, .85vw, 13.5px); }
    #historyFold .legend-row { margin-top: 12px; }
    #historyFold .legend-label { font-size: clamp(10px, .72vw, 12px); }
    #historyFold .legend-swatch { width: clamp(12px, 1vw, 16px); height: clamp(12px, 1vw, 16px); }
    #historyFold .summary { gap: 8px 14px; font-size: clamp(11px, .82vw, 13px); }
    #historyFold .link-btn { font-size: clamp(11px, .82vw, 13px); }
    .grid-inner.vert .month-cell { font-size: clamp(9.5px, .68vw, 11.5px); }
    .grid-inner.vert .day-label { font-size: clamp(10px, .72vw, 12px); }
    .grid-inner.vert .cell { border-radius: clamp(5px, .45vw, 8px); }

    /* --- centro: el reloj, cuadrado --- */
    .stage {
      grid-column: 2; grid-row: 2 / span 2;
      align-self: center; justify-self: stretch;
      aspect-ratio: 1;
      /* La columna ya mide el cuadrado: aqui solo hay que llenarla. Con
         un aviso arriba la fila encoge, y prefiero que la tarjeta pierda
         un poco de cuadratura a que la pagina saque barra de scroll. */
      width: 100%; max-height: 100%;
      justify-content: center;
      container-type: inline-size;
      gap: clamp(11px, 2.6cqw, 34px);
      padding: clamp(26px, 2.6vw, 46px);
      border-radius: clamp(28px, 2.6vw, 46px);
    }
    /* El aro se saca de .dial-wrap y se ancla a la tarjeta. Asi
       .dial-wrap deja de reservar un cuadrado y se queda con lo que de
       verdad lleva dentro: el rotulo, la cifra y el objetivo. */
    .stage { position: relative; }
    .dial-wrap {
      position: static;
      width: 100%; height: auto; aspect-ratio: auto;
      flex: 0 0 auto;
    }
    .dial {
      position: absolute;
      inset: clamp(26px, 2.6vw, 46px);
      width: auto; height: auto;
    }
    .dial-track, .dial-arc { stroke-width: 6; }
    .dial-face { padding: 0 12%; }

    /* El halo iba pegado a .dial-wrap, que ya no es el circulo. */
    body.running .dial-wrap::after { content: none; }
    body.running .stage::after {
      content: ""; position: absolute;
      inset: clamp(32px, 3.2vw, 58px);
      border-radius: 50%; pointer-events: none;
      box-shadow: 0 0 90px rgba(125,151,255,.28);
      animation: halo 5.5s ease-in-out infinite;
    }

    .dial-face { padding: 0 12%; gap: clamp(6px, .8vh, 14px); }
    .dial-state { font-size: clamp(10.5px, 1.65cqw, 15px); letter-spacing: .2em; }
    .dial-goal { font-size: clamp(12px, 1.95cqw, 18px); }
    .dial-track, .dial-arc { stroke-width: 7.5; }

    /* Estrechas para que sus esquinas no crucen el aro, que ahora es el
       borde de la tarjeta. La cuerda del circulo a esa altura da de
       sobra; el limite lo pone la tarjeta pequeña. */
    .stage-actions { max-width: min(56%, 470px); gap: clamp(8px, .8vw, 14px); }
    .stage-actions .btn {
      min-height: clamp(46px, 6.2cqw, 68px);
      font-size: clamp(13px, 2.05cqw, 19px);
      border-radius: clamp(14px, 1.6cqw, 20px);
    }
    .mini-stats { max-width: min(64%, 560px); gap: clamp(10px, .9vw, 16px); }
    .mini { padding: clamp(9px, 1.5cqw, 18px) 8px; border-radius: clamp(12px, 1.5cqw, 18px); }
    .mini-value { font-size: clamp(15px, 2.6cqw, 25px); }
    .mini-label { font-size: clamp(10px, 1.4cqw, 13px); margin-top: 3px; }
    .stage-extra { min-height: clamp(28px, 3.9cqw, 46px); }
    .stage-extra .link-btn { font-size: clamp(12px, 1.7cqw, 16px); }

    /* --- derecha: ranking arriba, cuenta y grupos abajo --- */
    #rankCard {
      grid-column: 3; grid-row: 2;
      min-height: 0; overflow: hidden;
      display: flex; flex-direction: column;
      padding: clamp(18px, 1.6vw, 26px) clamp(18px, 1.5vw, 24px) clamp(14px, 1.2vw, 20px);
    }
    #rankCard .rank-head { margin-bottom: clamp(10px, 1vw, 16px); }
    #rankCard .rank-head h2 { font-size: clamp(16px, 1.3vw, 23px); }
    #rankCard .eyebrow { font-size: clamp(10.5px, .78vw, 13px); }
    #rankCard .view-tab { padding: 8px clamp(10px, .8vw, 16px); min-height: clamp(34px, 3.4vh, 42px);
                          font-size: clamp(12.5px, .92vw, 15px); }
    #rankCard .metric-tab { padding: 6px clamp(9px, .7vw, 14px); font-size: clamp(11.5px, .85vw, 14px); }
    #rankBody { overflow-y: auto; min-height: 0; flex: 1; display: flex; flex-direction: column; }
    #rankCard .rank-row, #rankCard .person {
      padding: clamp(11px, 1.2vh, 17px) clamp(12px, 1vw, 16px);
      border-radius: clamp(12px, 1vw, 16px);
    }
    #rankCard .rank-name, #rankCard .person-name { font-size: clamp(14px, 1.02vw, 17px); }
    #rankCard .rank-sub, #rankCard .person-sub { font-size: clamp(11px, .82vw, 13.5px); }
    #rankCard .rank-value, #rankCard .person-value { font-size: clamp(14px, 1.05vw, 18px); }
    #rankCard .mono { width: clamp(32px, 2.5vw, 42px); height: clamp(32px, 2.5vw, 42px);
                      font-size: clamp(13px, 1vw, 17px); border-radius: clamp(10px, .9vw, 14px); }
    #rankCard .sync-line { font-size: clamp(11px, .8vw, 13px); }

    #socialCard {
      grid-column: 3; grid-row: 3;
      padding: clamp(16px, 1.35vw, 22px) clamp(18px, 1.5vw, 24px) clamp(14px, 1.2vw, 20px);
    }
    #socialCard .rank-head { margin-bottom: 2px; }
    #socialCard .rank-head h2 { font-size: clamp(15px, 1.2vw, 20px); }
    #socialCard .eyebrow { font-size: clamp(10.5px, .78vw, 13px); }
    #socialCard .soc-row { padding: clamp(10px, 1.1vh, 16px) 0; }
    #socialCard .soc-name { font-size: clamp(14px, 1.02vw, 17px); }
    #socialCard .soc-sub { font-size: clamp(11.5px, .85vw, 14px); }
    #socialCard .mono { width: clamp(32px, 2.5vw, 42px); height: clamp(32px, 2.5vw, 42px);
                        font-size: clamp(13px, 1vw, 17px); border-radius: clamp(10px, .9vw, 14px); }
    #socialCard .soc-acts { margin-top: clamp(10px, 1vw, 16px); }
    #socialCard .soc-acts .btn {
      min-height: clamp(36px, 3.8vh, 48px);
      font-size: clamp(12px, .88vw, 15px);
      padding: 8px 10px;
      min-width: 76px;
    }
    #socialCard .soc-row .btn { min-height: clamp(38px, 3.8vh, 48px); font-size: clamp(12.5px, .9vw, 15px); }


    @media (max-height: 980px) {
      #socialCard { padding: 12px 16px 13px; }
      #socialCard .rank-head { display: none; }
      #socialCard .soc-row { padding: 9px 0; }
      #socialCard .soc-acts { margin-top: 9px; }
      #socialCard .soc-acts .btn { min-height: 34px; font-size: 12px; }
      #socialCard .soc-row .btn { min-height: 36px; }
      #socialCard .mono { width: 30px; height: 30px; font-size: 12.5px; }
      #socialCard .soc-sub { font-size: 11.5px; }
    }
  }

  @media (max-width: 560px) {
    .card { padding: 18px 14px 14px; border-radius: 20px; }
    .rank-head { align-items: stretch; }
    .rank-tools { width: 100%; }
    .metric-tabs { flex: 1; }
    .view-tabs { flex: 1; }
    .view-tab { flex: 1; justify-content: center; }
    .stage { padding: 20px 14px 16px; gap: 15px; }
    .soc-acts .btn { min-height: 44px; }
    .fold-head { padding: 14px 16px; }
    .fold-body { padding: 0 14px 14px; }

    /* Celdas mas grandes con el dedo. La rejilla ya vive dentro de un
       contenedor con scroll propio, asi que solo supone desplazarse algo mas. */
    :root { --cell: 22px; --cell-gap: 6px; }
    .cell { border-radius: 5px; }

    /* Objetivos tactiles de 44px. Antes los botones median 34-36px de alto
       y los enlaces del pie 21px. */
    .btn { min-height: 44px; padding: 11px 16px; }
    .metric-tab { flex: 1; min-height: 40px; }
    .chip { min-height: 38px; padding: 9px 13px; }
    .link-btn { min-height: 40px; padding: 10px 12px; font-size: 12px; }
    .summary { gap: 12px 14px; }

    /* El toast se quedaba encajonado en la mitad del ancho */
    .toast-wrap { left: 12px; right: 12px; transform: none; }
    .toast { width: 100%; justify-content: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
<div class="page">
 <div class="stack">

  <header class="topbar">
    <div class="brand">DEEP WORK</div>
    <div class="topbar-right">
      <button class="acct-chip" id="acctChip" aria-label="Cuenta">Entrar</button>
      <button class="group-chip" id="groupChip" aria-label="Grupo">Buscar grupo</button>
    </div>
  </header>

  <div id="noticeSlot"></div>

  <!-- ================= el temporizador, la pieza principal =================
       El anillo mide el OBJETIVO DEL DÍA, no la sesión: una sesión es un
       cronómetro abierto sin duración prevista, así que un anillo de sesión
       no podría llenarse nunca y sería un adorno que miente. -->
  <main class="card stage" id="stage">
    <div class="dial-wrap" role="progressbar" id="dialWrap"
         aria-label="Progreso del objetivo diario" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg class="dial" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
        <circle class="dial-track" cx="100" cy="100" r="88"></circle>
        <circle class="dial-arc" id="dialArc" cx="100" cy="100" r="88"></circle>
      </svg>
      <div class="dial-face">
        <div class="dial-state" id="dialState">LISTO</div>
        <!-- Las aletas las monta el JS: seis digitos y dos separadores.
             Van marcadas como decorativas y el texto legible para un
             lector de pantalla va en el span de al lado, sin aria-live:
             un reloj que se anuncia cada segundo es inservible. -->
        <div class="flip-reloj" id="timerClock" aria-hidden="true"></div>
        <span class="sr-only" id="timerClockSr"></span>
        <button class="dial-goal" id="goalText" aria-label="Cambiar el objetivo diario">—</button>
      </div>
    </div>

    <div class="stage-actions" id="timerButtons"></div>

    <div class="mini-stats">
      <div class="mini"><div class="mini-value" id="statToday" aria-label="Hoy: 0 minutos">0m</div><div class="mini-label" aria-hidden="true">Hoy</div></div>
      <div class="mini"><div class="mini-value" id="statWeek" aria-label="Esta semana: 0 minutos">0m</div><div class="mini-label" aria-hidden="true">Semana</div></div>
      <div class="mini"><div class="mini-value" id="statStreak" aria-label="Racha: 0 días">0 días</div><div class="mini-label" aria-hidden="true">Racha</div></div>
    </div>

    <div class="stage-extra" id="stageExtra"></div>
  </main>

  <!-- ===================== gente y ranking =====================
       Dos preguntas distintas con una sola petición: Gente contesta
       "quién está ahora" y se ordena por presencia; Ranking contesta
       "quién lleva más" y se ordena por minutos. -->
  <section class="card" id="rankCard">
    <div class="rank-head">
      <div>
        <div class="eyebrow" id="rankEyebrow">GRUPO</div>
        <h2 id="rankTitle">Compite con tu gente</h2>
      </div>
      <div class="rank-tools" id="rankTools"></div>
    </div>
    <div id="rankBody"></div>
    <div id="rankSync"></div>
  </section>

  <!-- ===================== cuenta y grupos =====================
       Todo lo que no es "cuanto he trabajado": quien eres, en que grupo
       estas y como cambiarlo. En el escritorio vive debajo del ranking. -->
  <section class="card" id="socialCard">
    <div class="rank-head">
      <div>
        <div class="eyebrow">TU CUENTA</div>
        <h2>Cuenta y grupo</h2>
      </div>
    </div>
    <div id="socialBody"></div>
  </section>

  <!-- ===================== calendario ===================== -->
  <section class="card fold" id="historyFold">
    <button class="fold-head" type="button" id="foldHead" aria-expanded="true" aria-controls="foldBody">
      <span class="fold-title">Calendario</span>
      <span class="fold-sub" id="foldSub"></span>
    </button>

    <div class="fold-body" id="foldBody">
      <div class="grid-wrap" id="gridWrap">
        <div class="grid-inner" id="gridInner">
          <div class="month-row" id="monthRow"></div>
          <div id="gridRows"></div>
        </div>
      </div>

      <div class="legend-row">
        <div class="hover-info" id="hoverInfo">&nbsp;</div>
        <div class="legend">
          <span class="legend-label">Nada</span>
          <div class="legend-swatch" style="background:var(--l0)"></div>
          <div class="legend-swatch" style="background:var(--l1)"></div>
          <div class="legend-swatch" style="background:var(--l2)"></div>
          <div class="legend-swatch" style="background:var(--l3)"></div>
          <div class="legend-swatch" style="background:var(--l4)"></div>
          <span class="legend-label" id="legendGoal">Objetivo</span>
        </div>
      </div>

      <div class="summary">
        <span>Total <b id="sumTotal">0h</b></span>
        <span>Mejor día <b id="sumBest">0h</b></span>
        <span>Media por día activo <b id="sumAvg">0m</b></span>
        <span>Días registrados <b id="sumDays">0</b></span>
        <span class="spacer"></span>
        <button class="link-btn" id="goalBtn">Objetivo</button>
        <button class="link-btn" id="exportBtn">Exportar</button>
        <button class="link-btn" id="importBtn">Importar</button>
        <input type="file" id="importFile" accept="application/json,.json" class="sr-only" />
      </div>
    </div>
  </section>

 </div>
</div>

<div id="sheetSlot"></div>

<div class="tip" id="tip" role="tooltip" aria-hidden="true"></div>
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
<div id="modalSlot"></div>
